                          style={{ flex:1, background:"#0e0e10", border:`1px solid ${BORDER}`, borderRadius:6, padding:"5px 9px", color:WHITE, fontSize:11, outline:"none" }} />
                        <button onClick={()=>{ if(!newCatInputs[key].trim()) return; updateGastoCats({...gastoCategories,[key]:[...cats,newCatInputs[key].trim()]}); setNewCatInputs(p=>({...p,[key]:""})); }}
                          style={{ padding:"5px 14px", background:color, color:"#141414", border:"none", borderRadius:6, cursor:"pointer", fontWeight:700, fontSize:11 }}>+</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* Cards por mes */}
          <div style={{ display:"flex",flexDirection:"column",gap:6 }}>
            {MONTHS.map((mes,m)=>{
              const md       = getMD(m);
              const ingresos = md.ingresos || [];
              const egresos  = getEgresosDisplay(m);
              const cc = getCashCollected(m);
              const g  = getTotalGastos(m);
              const flujo = cc - g;
              const exp = expandedM===m;
              const hasData = cc>0||g>0;

              return (
                <div key={m} style={{ background:CARD,borderRadius:10,border:`1px solid ${hasData?BORDER:BORDER+"44"}`,overflow:"hidden" }}>
                  {/* Header */}
                  <div onClick={()=>{ if(!exp) migrateGastoItems(m); setExpandedM(exp?null:m); }}
                    style={{ display:"flex",alignItems:"center",padding:"10px 16px",cursor:"pointer",gap:0,userSelect:"none" }}>
                    <span style={{ color:WHITE,fontWeight:700,fontSize:13,width:36 }}>{mes}</span>
                    <div style={{ flex:1,display:"flex",gap:5,alignItems:"center",overflow:"hidden" }}>
                      {ingresos.slice(0,2).map(i=>(
                        <span key={i.id} style={{ background:"#22C55E22",borderRadius:4,padding:"1px 7px",color:"#22C55E",fontSize:10,whiteSpace:"nowrap",maxWidth:100,overflow:"hidden",textOverflow:"ellipsis" }}>
                          {i.client||i.concept||"Ingreso"}
                        </span>
                      ))}
                      {ingresos.length>2 && <span style={{ color:GRAY,fontSize:10 }}>+{ingresos.length-2}</span>}
                    </div>
                    <span style={{ color:"#22C55E",fontSize:12,fontWeight:700,width:96,textAlign:"right" }}>{cc>0?fmtCOP(cc):"—"}</span>
                    <span style={{ color:"#EF4444",fontSize:12,fontWeight:700,width:96,textAlign:"right" }}>{g>0?fmtCOP(g):"—"}</span>
                    <span style={{ color:flujo>0?"#22C55E":flujo<0?"#EF4444":GRAY,fontSize:12,fontWeight:800,width:100,textAlign:"right" }}>
                      {(cc>0||g>0)?(flujo>0?"+":"")+fmtCOP(flujo):"—"}
                    </span>
                    <span style={{ color:GRAY,fontSize:11,marginLeft:10 }}>{exp?"▲":"▼"}</span>
                  </div>

                  {exp && (
                    <div style={{ padding:"0 16px 18px",borderTop:`1px solid ${BORDER}33` }}>
                      <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,paddingTop:16 }}>

                        {/* INGRESOS */}
                        <div>
                          <div style={{ color:"#22C55E",fontWeight:700,fontSize:12,letterSpacing:1,marginBottom:10 }}>
                            INGRESOS · {fmtCOP(cc)}
                          </div>
                          {ingresos.map(ing=>{
                            const isUSD = ing.currency==="USD";
                            const copVal = toCOP(ing);
                            return (
                            <div key={ing.id} style={{ display:"flex",gap:8,marginBottom:6,padding:"8px 10px",background:"#22C55E08",borderRadius:7,border:`1px solid #22C55E22`,alignItems:"flex-start" }}>
                              <div style={{ flex:1 }}>
                                <div style={{ color:WHITE,fontSize:12,fontWeight:600 }}>{ing.client||"Sin nombre"}</div>
                                {ing.concept && <div style={{ color:GRAY,fontSize:10,marginTop:2 }}>{ing.concept}</div>}
                              </div>
                              <div style={{ textAlign:"right",flexShrink:0 }}>
                                <div style={{ color:"#22C55E",fontSize:12,fontWeight:700,whiteSpace:"nowrap" }}>
                                  {isUSD ? `$${Number(ing.amount).toLocaleString("en-US")} USD` : fmtCOP(ing.amount)}
                                </div>
                                {isUSD && <div style={{ color:GRAY,fontSize:9,marginTop:1 }}>≈ {fmtCOP(copVal)}</div>}
                              </div>
                              <button onClick={()=>setMD(m,md=>({...md,ingresos:(md.ingresos||[]).filter(x=>x.id!==ing.id)}))}
                                style={{ background:"none",border:"none",color:GRAY,cursor:"pointer",fontSize:14,opacity:0.5,lineHeight:1,padding:0 }}>×</button>
                            </div>
                            );
                          })}
                          {ingresos.length===0 && <div style={{ color:GRAY,fontSize:11,marginBottom:8 }}>Sin ingresos registrados</div>}

                          {/* Formulario ingreso */}
                          <div style={{ marginTop:8,padding:"10px",background:"#111113",borderRadius:8,border:`1px solid #22C55E22` }}>
                            <div style={{ color:"#22C55E",fontSize:10,fontWeight:700,marginBottom:7,letterSpacing:0.5 }}>+ AGREGAR INGRESO</div>
                            <input value={ingF(m).client} onChange={e=>setIngF(m,"client",e.target.value)}
                              placeholder="Cliente / Fuente  (Ej: Zenova, Stefa, AYM...)"
                              style={{ width:"100%",background:"#0e0e10",border:`1px solid ${BORDER}`,borderRadius:5,padding:"6px 8px",color:WHITE,fontSize:11,outline:"none",marginBottom:5,boxSizing:"border-box" }} />
                            <input value={ingF(m).concept} onChange={e=>setIngF(m,"concept",e.target.value)}
                              placeholder="Concepto  (Ej: Fee julio, Comisión cerrada, Bono)"
                              onKeyDown={e=>e.key==="Enter"&&ingF(m).amount&&addIngreso(m)}
                              style={{ width:"100%",background:"#0e0e10",border:`1px solid ${BORDER}`,borderRadius:5,padding:"6px 8px",color:WHITE,fontSize:11,outline:"none",marginBottom:5,boxSizing:"border-box" }} />
                            <div style={{ display:"flex",gap:6 }}>
                              <select value={ingF(m).currency||"USD"} onChange={e=>setIngF(m,"currency",e.target.value)}
                                style={{ background:"#0e0e10",border:`1px solid ${BORDER}`,borderRadius:5,padding:"6px 8px",color:GOLD,fontSize:12,fontWeight:700,outline:"none",width:70 }}>
                                <option value="USD">USD</option>
                                <option value="COP">COP</option>
                              </select>
                              <input value={ingF(m).amount} onChange={e=>setIngF(m,"amount",e.target.value)} type="number"
                                placeholder={ingF(m).currency==="USD"?"Monto en USD":"Monto en COP"}
                                onKeyDown={e=>e.key==="Enter"&&addIngreso(m)}
                                style={{ flex:1,background:"#0e0e10",border:`1px solid ${BORDER}`,borderRadius:5,padding:"6px 8px",color:WHITE,fontSize:11,outline:"none" }} />
                              <button onClick={()=>addIngreso(m)}
                                style={{ padding:"6px 16px",background:"#22C55E",color:"#141414",border:"none",borderRadius:5,cursor:"pointer",fontWeight:700,fontSize:13 }}>+</button>
                            </div>
                            {ingF(m).currency==="USD"&&ingF(m).amount&&(
                              <div style={{ color:GRAY,fontSize:10,marginTop:4 }}>
                                ≈ {fmtCOP(parseFloat(ingF(m).amount)*trm)} a TRM ${trm.toLocaleString()}
                              </div>
                            )}
                          </div>

                        </div>

                        {/* EGRESOS */}
                        <div>
                          <div style={{ color:"#EF4444",fontWeight:700,fontSize:12,letterSpacing:1,marginBottom:10 }}>
                            EGRESOS · {fmtCOP(g)}
                          </div>
                          {(()=>{
                            const groups = {};
                            egresos.forEach(eg=>{
                              const grp = (eg.category||"").split(" · ")[0] || "Otros";
                              if(!groups[grp]) groups[grp]=[];
                              groups[grp].push(eg);
                            });
                            return Object.entries(groups).map(([grp,items])=>(
                              <div key={grp} style={{ marginBottom:8 }}>
                                <div style={{ color:CAT_COLORS[grp]||GRAY,fontSize:10,fontWeight:700,marginBottom:4,letterSpacing:0.5 }}>{grp.toUpperCase()}</div>
                                {items.map(eg=>(
                                  <div key={eg.id} style={{ display:"flex",gap:8,marginBottom:4,padding:"6px 8px",background:"#EF444408",borderRadius:6,border:`1px solid #EF444422`,alignItems:"flex-start" }}>
                                    <div style={{ flex:1 }}>
                                      <div style={{ color:WHITE,fontSize:11,fontWeight:600 }}>{(eg.category||"").split(" · ")[1]||eg.category||"Gasto"}</div>
                                      {eg.description && <div style={{ color:GRAY,fontSize:10,marginTop:1 }}>{eg.description}</div>}
                                    </div>
                                    <span style={{ color:"#EF4444",fontSize:11,fontWeight:700,whiteSpace:"nowrap" }}>{fmtCOP(eg.amount)}</span>
                                    <button onClick={()=>setMD(m,md=>{
                                      if (md.egresos !== undefined) return {...md, egresos:md.egresos.filter(x=>x.id!==eg.id)};
                                      // Legacy: migrar y omitir este item
                                      const kept = giToEgresos(md.gastoItems||{}).filter(x=>x.category!==eg.category||x.amount!==eg.amount);
                                      const {gastoItems:_,...rest}=md; return {...rest,egresos:kept};
                                    })} style={{ background:"none",border:"none",color:GRAY,cursor:"pointer",fontSize:14,opacity:0.5,lineHeight:1,padding:0 }}>×</button>
                                  </div>
                                ))}
                              </div>
                            ));
                          })()}
                          {egresos.length===0 && <div style={{ color:GRAY,fontSize:11,marginBottom:8 }}>Sin gastos registrados</div>}

                          {/* Formulario egreso */}
                          <div style={{ marginTop:8,padding:"10px",background:"#111113",borderRadius:8,border:`1px solid #EF444422` }}>
                            <div style={{ color:"#EF4444",fontSize:10,fontWeight:700,marginBottom:7,letterSpacing:0.5 }}>+ AGREGAR GASTO</div>
                            <select value={egF(m).cat} onChange={e=>setEgF(m,"cat",e.target.value)}
                              style={{ width:"100%",background:"#0e0e10",border:`1px solid ${BORDER}`,borderRadius:5,padding:"6px 8px",color:egF(m).cat?WHITE:"#666",fontSize:11,outline:"none",marginBottom:5,boxSizing:"border-box" }}>
                              <option value="">Categoría...</option>
                              {egCats.map(c=>(<option key={c} value={c}>{c}</option>))}
                            </select>
                            <input value={egF(m).desc} onChange={e=>setEgF(m,"desc",e.target.value)}
                              placeholder="Descripción  (Ej: Mercado, Netflix, Vuelo Madrid)"
                              onKeyDown={e=>e.key==="Enter"&&egF(m).amount&&addEgreso(m)}
                              style={{ width:"100%",background:"#0e0e10",border:`1px solid ${BORDER}`,borderRadius:5,padding:"6px 8px",color:WHITE,fontSize:11,outline:"none",marginBottom:5,boxSizing:"border-box" }} />
                            <div style={{ display:"flex",gap:6 }}>
                              <input value={egF(m).amount} onChange={e=>setEgF(m,"amount",e.target.value)} type="number"
                                placeholder="$ Monto COP"
                                onKeyDown={e=>e.key==="Enter"&&addEgreso(m)}
                                style={{ flex:1,background:"#0e0e10",border:`1px solid ${BORDER}`,borderRadius:5,padding:"6px 8px",color:WHITE,fontSize:11,outline:"none" }} />
                              <button onClick={()=>addEgreso(m)}
                                style={{ padding:"6px 16px",background:"#EF4444",color:"#fff",border:"none",borderRadius:5,cursor:"pointer",fontWeight:700,fontSize:13 }}>+</button>
                            </div>
                          </div>
                        </div>
                      </div>

                      {/* Resumen del mes */}
                      {(cc>0||g>0) && (
                        <div style={{ marginTop:14,padding:"10px 14px",background:"#111113",borderRadius:8,display:"flex",gap:20,flexWrap:"wrap" }}>
                          <span style={{ fontSize:11,color:GRAY }}>Ingresos: <span style={{ color:GOLD,fontWeight:700 }}>{fmtCOP(cc)}</span></span>
                          <span style={{ fontSize:11,color:GRAY }}>Gastos: <span style={{ color:"#EF4444",fontWeight:700 }}>{fmtCOP(g)}</span></span>
                          <span style={{ fontSize:11,color:GRAY }}>Flujo Neto: <span style={{ color:flujo>=0?"#22C55E":"#EF4444",fontWeight:700 }}>{fmtCOP(flujo)}</span></span>
                        </div>
                      )}

                      {/* PROYECCIÓN DE PIPELINE */}
                      {(()=>{
                        const target   = salesConfig.monthlyTarget || 0;
                        if (!target) return null;
                        const gapToTarget = Math.max(0, target - cc);
                        const pctDone  = target > 0 ? Math.min(100, cc/target*100) : 0;

                        // Revenue per new client: fee + canal commission (above floor)
                        const fee      = salesConfig.avgFee || 0;
                        const cFloor2  = salesConfig.commissionFloor || 0;
                        const canal    = Math.max(0, (salesConfig.avgClientSales||0) - cFloor2) * (salesConfig.channelPct||10) / 100;
                        const revPerClient = fee + canal;

                        // Existing clients in the ledger
                        const existingClients = [...new Set(ingresos.map(i=>i.client||i.concept).filter(Boolean))].length;

                        // Upsell potential: Mejora Continua on existing clients
                        const upsellTotal = existingClients * (salesConfig.upsellPrice||2000000);

                        // Pure new-client path
                        const newClientsNeeded   = revPerClient>0 ? Math.ceil(gapToTarget/revPerClient) : null;
                        const meetingsNeeded     = newClientsNeeded ? newClientsNeeded * (salesConfig.meetingsPerClose||3) : null;

                        // Hybrid: upsell first, then new clients
                        const gapAfterUpsell     = Math.max(0, gapToTarget - upsellTotal);
                        const newAfterUpsell     = revPerClient>0 ? Math.ceil(gapAfterUpsell/revPerClient) : null;
                        const meetingsAfterUpsell= newAfterUpsell ? newAfterUpsell * (salesConfig.meetingsPerClose||3) : 0;
                        const convPct = Math.round(100/(salesConfig.meetingsPerClose||3));

                        return (
                          <div style={{ marginTop:14,background:"#0a0a0b",borderRadius:10,border:`1px solid ${GOLD}22`,padding:"14px 16px" }}>
                            <div style={{ color:GOLD,fontWeight:700,fontSize:11,letterSpacing:1,marginBottom:12 }}>PROYECCIÓN DE CIERRE</div>

                            {/* Progress bar */}
                            <div style={{ marginBottom:12 }}>
                              <div style={{ display:"flex",justifyContent:"space-between",marginBottom:5 }}>
                                <span style={{ color:GRAY,fontSize:11 }}>Meta: <span style={{ color:WHITE,fontWeight:700 }}>{fmtCOP(target)}</span></span>
                                <span style={{ color:pctDone>=100?"#22C55E":GOLD,fontSize:11,fontWeight:700 }}>{pctDone.toFixed(0)}%</span>
                              </div>
                              <div style={{ height:6,background:"#222",borderRadius:3,overflow:"hidden" }}>
                                <div style={{ height:"100%",width:pctDone+"%",background:`linear-gradient(90deg,${GOLD_DIM},${GOLD})`,borderRadius:3,transition:"width 0.4s" }} />
                              </div>
                              {gapToTarget>0
                                ? <div style={{ color:"#EF4444",fontSize:11,marginTop:5 }}>Falta cerrar: <span style={{ fontWeight:700 }}>{fmtCOP(gapToTarget)}</span></div>
                                : <div style={{ color:"#22C55E",fontSize:11,fontWeight:700,marginTop:5 }}>✓ Meta del mes alcanzada</div>
                              }
                            </div>

                            {gapToTarget>0 && (
                              <div style={{ display:"flex",flexDirection:"column",gap:8 }}>

                                {/* Revenue per client breakdown */}
                                <div style={{ background:CARD,borderRadius:8,padding:"8px 12px",fontSize:10,color:GRAY }}>
                                  <span>Por cliente: </span>
                                  <span style={{ color:WHITE }}>{fmtCOP(fee)}</span><span> fee </span>
                                  <span style={{ color:"#22C55E",fontWeight:700 }}>+ {fmtCOP(canal)} canal ({salesConfig.channelPct||10}%{cFloor2>0?` sobre >${fmtCOP(cFloor2)}`:""})</span>
                                  <span style={{ color:GOLD,fontWeight:700 }}> = {fmtCOP(revPerClient)}/mes</span>
                                </div>

                                {/* Option A: Pure new clients */}
                                <div style={{ background:CARD,borderRadius:8,padding:"10px 12px",border:`1px solid #3B82F622` }}>
                                  <div style={{ color:"#3B82F6",fontSize:10,fontWeight:700,letterSpacing:0.5,marginBottom:8 }}>A · SOLO NUEVOS CLIENTES</div>
                                  <div style={{ display:"flex",gap:20 }}>
                                    <div style={{ textAlign:"center" }}>
                                      <div style={{ color:WHITE,fontWeight:900,fontSize:22 }}>{newClientsNeeded ?? "—"}</div>
                                      <div style={{ color:GRAY,fontSize:9 }}>clientes a cerrar</div>
                                    </div>
                                    <div style={{ textAlign:"center" }}>
                                      <div style={{ color:"#F59E0B",fontWeight:900,fontSize:22 }}>{meetingsNeeded ?? "—"}</div>
                                      <div style={{ color:GRAY,fontSize:9 }}>reuniones a agendar</div>
                                    </div>
                                    <div style={{ textAlign:"center" }}>
                                      <div style={{ color:GRAY,fontWeight:700,fontSize:16 }}>{convPct}%</div>
                                      <div style={{ color:GRAY,fontSize:9 }}>conversión</div>
                                    </div>
                                  </div>
                                </div>

                                {/* Option B: Upsell / Adicional + new clients */}
                                {existingClients>0 && (
                                  <div style={{ background:CARD,borderRadius:8,padding:"10px 12px",border:`1px solid #8B5CF622` }}>
                                    <div style={{ color:"#8B5CF6",fontSize:10,fontWeight:700,letterSpacing:0.5,marginBottom:8 }}>B · UPSELL A CLIENTES ACTUALES + NUEVOS (RECOMENDADO)</div>
                                    <div style={{ color:GRAY,fontSize:10,marginBottom:6 }}>
                                      Ofrecer servicio adicional a {existingClients} cliente{existingClients!==1?"s":""} actuales:
                                      <span style={{ color:"#8B5CF6",fontWeight:700 }}> +{fmtCOP(upsellTotal)}/mes</span>
                                    </div>
                                    {gapAfterUpsell<=0
                                      ? <div style={{ color:"#22C55E",fontSize:11,fontWeight:700 }}>✓ Solo el upsell ya cubre la brecha</div>
                                      : <div style={{ color:GRAY,fontSize:10 }}>
                                          Brecha restante: <span style={{ color:"#EF4444",fontWeight:700 }}>{fmtCOP(gapAfterUpsell)}</span>
                                          {" → "}<span style={{ color:WHITE,fontWeight:700 }}>{newAfterUpsell}</span> cliente nuevo
                                          {" = "}<span style={{ color:"#F59E0B",fontWeight:700 }}>{meetingsAfterUpsell}</span> reunión{meetingsAfterUpsell!==1?"es":""}
                                        </div>
                                    }
                                  </div>
                                )}

                                {/* Call to action */}
                                <div style={{ background:"#F59E0B11",borderRadius:8,padding:"8px 12px",border:`1px solid #F59E0B22`,display:"flex",alignItems:"center",gap:8 }}>
                                  <span style={{ fontSize:14 }}>📅</span>
                                  <span style={{ color:"#F59E0B",fontSize:11,fontWeight:700 }}>
                                    Agendá {existingClients>0?meetingsAfterUpsell:meetingsNeeded} reunión{(existingClients>0?meetingsAfterUpsell:meetingsNeeded)!==1?"es":""} este mes para cerrar la meta
                                  </span>
                                </div>
                              </div>
                            )}
                          </div>
                        );
                      })()}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ══ PATRIMONIO & DEUDAS ══ */}
      {tab==="patrimonio" && (
        <div>
          {/* Flujo neto acumulado del año */}
          {(totCC>0||totG>0) && (
            <div style={{ display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16 }}>
              {[
                { overline:"Facturación", label:"Ingresado este año",      val:fmtCOP(totCC),     color:"#22C55E" },
                { overline:"Costos",      label:"Gastado este año",        val:fmtCOP(totG),      color:"#EF4444" },
                { overline:"Balance",     label:"Queda después de costos", val:fmtCOP(totFlujo),  color:totFlujo>=0?"#22C55E":"#EF4444" },
              ].map(({overline,label,val,color})=>(
                <div key={label} style={{ background:"#0a0a0b", borderRadius:12, padding:"14px 16px", border:`1px solid ${BORDER}`, borderTop:`2px solid ${color}55`, textAlign:"center" }}>
                  <div style={{ color:color+"88", fontSize:9, fontWeight:700, letterSpacing:2, textTransform:"uppercase", marginBottom:6 }}>{overline}</div>
                  <div style={{ color, fontWeight:900, fontSize:18, lineHeight:1, letterSpacing:-0.5 }}>{val}</div>
                  <div style={{ color:GRAY, fontSize:10, marginTop:5 }}>{label}</div>
                </div>
              ))}
            </div>
          )}

          <div style={{ background:"#0a0a0b", borderRadius:14, padding:"22px 24px", border:`1px solid ${netWorth>=0?"#22C55E33":"#EF444433"}`, borderLeft:`4px solid ${netWorth>=0?"#22C55E":"#EF4444"}`, marginBottom:20 }}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:12 }}>
              <div>
                <div style={{ color:(netWorth>=0?"#22C55E":"#EF4444")+"88", fontSize:9, fontWeight:700, letterSpacing:2.5, textTransform:"uppercase", marginBottom:6 }}>Posición financiera</div>
                <div style={{ color:netWorth>=0?"#22C55E":"#EF4444", fontWeight:900, fontSize:32, lineHeight:1, letterSpacing:-1 }}>{fmtCOP(netWorth)}</div>
                <div style={{ color:GRAY, fontSize:11, marginTop:6 }}>Patrimonio Neto</div>
              </div>
              <div style={{ textAlign:"right" }}>
                <div style={{ color:GRAY, fontSize:9, marginBottom:3 }}>Equivalente USD</div>
                <div style={{ color:WHITE, fontWeight:700, fontSize:18 }}>{fmtUSD(netWorthUSD)}</div>
                <div style={{ display:"flex", alignItems:"center", gap:5, marginTop:6, justifyContent:"flex-end" }}>
                  <span style={{ color:GRAY, fontSize:10 }}>TRM</span>
                  <input value={fxRate} onChange={e=>onUpdate({finance:{...finance,fxRate:parseFloat(e.target.value)||4200}})} type="number"
                    style={{ width:68, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:5, padding:"3px 7px", color:GOLD, fontSize:11, outline:"none", textAlign:"right" }} />
                  <span style={{ color:GRAY, fontSize:10 }}>COP/USD</span>
                </div>
              </div>
            </div>
          </div>

          <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16 }}>
            {/* Activos */}
            <div style={{ background:CARD,borderRadius:12,padding:16,border:`1px solid #22C55E33` }}>
              <div style={{ display:"flex",justifyContent:"space-between",marginBottom:12 }}>
                <span style={{ color:WHITE,fontWeight:700,fontSize:13 }}>Activos</span>
                <span style={{ color:"#22C55E",fontWeight:700,fontSize:13 }}>{fmtCOP(totalAssets)}</span>
              </div>
              {assets.length===0 && <div style={{ color:GRAY,fontSize:11,marginBottom:8 }}>Ej: Efectivo, Inversiones, Propiedad...</div>}
              {assets.map(a=>(
                <div key={a.id} style={{ display:"flex",alignItems:"center",gap:8,marginBottom:6 }}>
                  <span style={{ flex:1,color:WHITE,fontSize:12 }}>{a.name}</span>
                  <span style={{ color:"#22C55E",fontSize:12 }}>{fmtCOP(a.value)}</span>
                  <button onClick={()=>onUpdate({finance:{...finance,assets:assets.filter(x=>x.id!==a.id)}})}
                    style={{ background:"none",border:"none",color:GRAY,cursor:"pointer",fontSize:14,opacity:0.5 }}>×</button>
                </div>
              ))}
              <div style={{ display:"flex",gap:6,marginTop:10 }}>
                <input value={assetName} onChange={e=>setAssetName(e.target.value)} placeholder="Nombre activo..."
                  style={{ flex:1,background:"#111113",border:`1px solid ${BORDER}`,borderRadius:6,padding:"6px 8px",color:WHITE,fontSize:11,outline:"none" }} />
                <input value={assetVal} onChange={e=>setAssetVal(e.target.value)} placeholder="$ COP" type="number"
                  style={{ width:90,background:"#111113",border:`1px solid ${BORDER}`,borderRadius:6,padding:"6px 8px",color:WHITE,fontSize:11,outline:"none" }} />
                <button onClick={()=>{ if(!assetName.trim()||!assetVal)return; onUpdate({finance:{...finance,assets:[...assets,{id:"a_"+Date.now(),name:assetName.trim(),value:parseFloat(assetVal)}]}}); setAssetName("");setAssetVal(""); }}
                  style={{ padding:"6px 12px",background:"#22C55E",color:"#141414",border:"none",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:13 }}>+</button>
              </div>
            </div>

            {/* Deudas */}
            <div style={{ background:CARD,borderRadius:12,padding:16,border:`1px solid #EF444433` }}>
              <div style={{ display:"flex",justifyContent:"space-between",marginBottom:12 }}>
                <span style={{ color:WHITE,fontWeight:700,fontSize:13 }}>Deudas</span>
                <span style={{ color:totalDebts>0?"#EF4444":"#22C55E",fontWeight:700,fontSize:13 }}>
                  {totalDebts>0?fmtCOP(totalDebts):"Sin deudas ✓"}
                </span>
              </div>
              {debts.map(d=>{
                const {months,totalPaid,totalInterest}=calcDebt(d.balance,d.rate,d.payment);
                const noAlcanza=d.payment>0&&d.rate>0&&months===null;
                const payments = d.payments||[];
                const totalAbonado = payments.reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
                const expD = expandedDebt===d.id;
                const doAbono = () => {
                  const amt=parseFloat(abonoInputs[d.id]); if(!amt||amt<=0) return;
                  const fecha = abonoDate[d.id] || new Date().toISOString().slice(0,10);
                  const nb = Math.max(0, d.balance-amt);
                  const newPmt = { id:"ab_"+Date.now(), date:fecha, amount:amt };
                  const updD = { ...d, balance:nb, payments:[...payments,newPmt] };
                  onUpdate({finance:{...finance, debts: nb===0 ? debts.filter(x=>x.id!==d.id) : debts.map(x=>x.id===d.id?updD:x)}});
                  setAbonoInputs(p=>({...p,[d.id]:""}));
                };

                // ── Proyección ──
                const today = new Date();
                let payoffStr=null, targetStatus=null, aceleracion=null;
                if (months) {
                  const pd = new Date(today.getFullYear(), today.getMonth()+months, 1);
                  payoffStr = pd.toLocaleDateString("es-CO",{month:"long",year:"numeric"});
                  const r=(d.rate||0)/100;
                  // 6 meses antes
                  const fn=Math.max(1,months-6);
                  const fp=r>0 ? d.balance*r*Math.pow(1+r,fn)/(Math.pow(1+r,fn)-1) : d.balance/fn;
                  const extra6=Math.round(Math.max(0,fp-(d.payment||0)));
                  aceleracion=extra6>500?extra6:null;
                  // Fecha objetivo
                  if (d.targetDate) {
                    const tgt=new Date(d.targetDate+"T00:00:00");
                    const tgtM=Math.max(1,Math.round((tgt-today)/(30.44*24*60*60*1000)));
                    const tp=r>0 ? d.balance*r*Math.pow(1+r,tgtM)/(Math.pow(1+r,tgtM)-1) : d.balance/tgtM;
                    const extra=Math.round(tp-(d.payment||0));
                    targetStatus={ onTrack:months<=tgtM, extra };
                  }
                }
                const creditCap = (d.payment||0)*30;

                return (
                  <div key={d.id} style={{ marginBottom:10,background:"#EF444408",borderRadius:8,border:`1px solid #EF444422`,overflow:"hidden" }}>

                    {/* Info principal */}
                    <div style={{ padding:"10px 12px" }}>
                      <div style={{ display:"flex",justifyContent:"space-between",marginBottom:5 }}>
                        <span style={{ color:WHITE,fontSize:12,fontWeight:700 }}>{d.name}</span>
                        <button onClick={()=>onUpdate({finance:{...finance,debts:debts.filter(x=>x.id!==d.id)}})}
                          style={{ background:"none",border:"none",color:GRAY,cursor:"pointer",fontSize:14,opacity:0.5 }}>×</button>
                      </div>
                      <div style={{ display:"flex",gap:10,fontSize:11,color:GRAY,flexWrap:"wrap",marginBottom:6 }}>
                        <span>Saldo: <span style={{ color:"#EF4444",fontWeight:700 }}>{fmtCOP(d.balance)}</span></span>
                        {d.rate>0 && <span>Tasa: <span style={{ color:"#F59E0B" }}>{d.rate}%/mes</span></span>}
                        {d.payment>0 && <span>Cuota: <span style={{ color:WHITE }}>{fmtCOP(d.payment)}</span></span>}
                        {totalAbonado>0 && <span>Abonado: <span style={{ color:"#22C55E",fontWeight:700 }}>{fmtCOP(totalAbonado)}</span></span>}
                      </div>

                      {noAlcanza && <div style={{ color:"#EF4444",fontSize:11,fontWeight:700,marginBottom:6 }}>⚠ La cuota no cubre los intereses — nunca termina</div>}

                      {/* Abono rápido */}
                      <div style={{ display:"flex",gap:5 }}>
                        <input type="date" value={abonoDate[d.id]||new Date().toISOString().slice(0,10)}
                          onChange={e=>setAbonoDate(p=>({...p,[d.id]:e.target.value}))}
                          style={{ background:"#0e0e10",border:`1px solid ${BORDER}`,borderRadius:5,padding:"5px 7px",color:GRAY,fontSize:10,outline:"none",width:115 }} />
                        <input value={abonoInputs[d.id]||""} type="number" placeholder="Monto a abonar..."
                          onChange={e=>setAbonoInputs(p=>({...p,[d.id]:e.target.value}))}
                          onKeyDown={e=>e.key==="Enter"&&doAbono()}
                          style={{ flex:1,background:"#0e0e10",border:`1px solid #22C55E44`,borderRadius:5,padding:"5px 8px",color:WHITE,fontSize:11,outline:"none" }} />
                        <button onClick={doAbono}
                          style={{ padding:"5px 12px",background:"#22C55E",color:"#111",border:"none",borderRadius:5,cursor:"pointer",fontWeight:800,fontSize:12,whiteSpace:"nowrap" }}>↓ Abonar</button>
                      </div>
                    </div>

                    {/* ── Proyección & crédito ── */}
                    {payoffStr && (()=>{
                      const simExtra = parseFloat(simExtras[d.id])||0;
                      const simPmt   = (d.payment||0) + simExtra;
                      const sim      = simExtra>0 ? calcDebt(d.balance, d.rate, simPmt) : null;
                      const simDate  = sim?.months ? new Date(today.getFullYear(), today.getMonth()+sim.months, 1) : null;
                      const simStr   = simDate ? simDate.toLocaleDateString("es-CO",{month:"long",year:"numeric"}) : null;
                      const msSaved  = sim?.months ? months - sim.months : 0;
                      const intSaved = (sim?.totalInterest!=null&&totalInterest!=null) ? Math.max(0,totalInterest-sim.totalInterest) : 0;
                      const simCreditDate = simDate ? simDate.toLocaleDateString("es-CO",{month:"short",year:"numeric"}) : null;
                      const baseCreditDate= new Date(today.getFullYear(),today.getMonth()+months,1).toLocaleDateString("es-CO",{month:"short",year:"numeric"});
                      const simCredit = simPmt * 30;
                      return (
                      <div style={{ borderTop:`1px solid #22C55E22`,padding:"10px 12px",background:"#22C55E05" }}>
                        <div style={{ color:"#22C55E",fontSize:9,fontWeight:700,letterSpacing:1.5,marginBottom:8 }}>PROYECCIÓN & ACCESO A CRÉDITO</div>

                        {/* Fecha objetivo */}
                        <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:10 }}>
                          <span style={{ color:GRAY,fontSize:11,whiteSpace:"nowrap" }}>Fecha objetivo:</span>
                          <input type="date" value={d.targetDate||""}
                            onChange={e=>onUpdate({finance:{...finance,debts:debts.map(x=>x.id===d.id?{...x,targetDate:e.target.value}:x)}})}
                            style={{ background:"#0e0e10",border:`1px solid ${BORDER}`,borderRadius:4,padding:"3px 6px",color:WHITE,fontSize:11,outline:"none" }} />
                        </div>

                        {/* Chips base */}
                        <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:10 }}>
                          <div style={{ background:"#111113",borderRadius:6,padding:"7px 9px" }}>
                            <div style={{ color:GRAY,fontSize:9,marginBottom:3 }}>Liquidación actual</div>
                            <div style={{ color:simExtra>0?"#9B9B9F":WHITE,fontSize:12,fontWeight:700,lineHeight:1.2,textDecoration:simExtra>0?"line-through":"none" }}>{payoffStr}</div>
                            <div style={{ color:GRAY,fontSize:10,marginTop:2 }}>{months} cuotas · {(months/12).toFixed(1)}a</div>
                          </div>
                          <div style={{ background:"#111113",borderRadius:6,padding:"7px 9px" }}>
                            <div style={{ color:GRAY,fontSize:9,marginBottom:3 }}>Flujo liberado/mes</div>
                            <div style={{ color:"#22C55E",fontSize:12,fontWeight:700 }}>{fmtCOP(d.payment||0)}</div>
                            <div style={{ color:GRAY,fontSize:10,marginTop:2 }}>al terminar</div>
                          </div>
                          <div style={{ background:"#111113",borderRadius:6,padding:"7px 9px" }}>
                            <div style={{ color:GRAY,fontSize:9,marginBottom:3 }}>Crédito accesible est.</div>
                            <div style={{ color:simExtra>0?"#9B9B9F":GOLD,fontSize:12,fontWeight:700,textDecoration:simExtra>0?"line-through":"none" }}>{fmtCOP(creditCap)}</div>
                            <div style={{ color:GRAY,fontSize:10,marginTop:2 }}>en {baseCreditDate}</div>
                          </div>
                        </div>

                        {/* ── Simulador ── */}
                        <div style={{ background:"#111113",borderRadius:7,padding:"9px 10px",marginBottom:8 }}>
                          <div style={{ color:GOLD,fontSize:9,fontWeight:700,letterSpacing:1.5,marginBottom:7 }}>SIMULAR PAGO EXTRA</div>
                          <div style={{ display:"flex",gap:6,alignItems:"center",marginBottom: simExtra>0?8:0 }}>
                            <span style={{ color:GRAY,fontSize:11,whiteSpace:"nowrap" }}>+ Extra/mes:</span>
                            <input type="number" value={simExtras[d.id]||""} placeholder="0"
                              onChange={e=>setSimExtras(p=>({...p,[d.id]:e.target.value}))}
                              style={{ flex:1,background:"#0e0e10",border:`1px solid ${GOLD}55`,borderRadius:5,padding:"4px 8px",color:GOLD,fontSize:12,fontWeight:700,outline:"none" }} />
                            {simExtra>0&&<button onClick={()=>setSimExtras(p=>({...p,[d.id]:""}))}
                              style={{ background:"none",border:"none",color:GRAY,cursor:"pointer",fontSize:12,opacity:0.5 }}>×</button>}
                          </div>

                          {/* Resultado simulación */}
                          {simExtra>0 && simStr && (
                            <div>
                              <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:6 }}>
                                <div style={{ background:"#0a0a0b",borderRadius:5,padding:"6px 8px",border:`1px solid ${GOLD}33` }}>
                                  <div style={{ color:GRAY,fontSize:9,marginBottom:2 }}>Nueva liquidación</div>
                                  <div style={{ color:GOLD,fontSize:12,fontWeight:800 }}>{simStr}</div>
                                  <div style={{ color:"#22C55E",fontSize:10,marginTop:1 }}>-{msSaved} meses antes</div>
                                </div>
                                <div style={{ background:"#0a0a0b",borderRadius:5,padding:"6px 8px",border:`1px solid #22C55E33` }}>
                                  <div style={{ color:GRAY,fontSize:9,marginBottom:2 }}>Intereses ahorrados</div>
                                  <div style={{ color:"#22C55E",fontSize:12,fontWeight:800 }}>{fmtCOP(Math.round(intSaved))}</div>
                                  <div style={{ color:GRAY,fontSize:10,marginTop:1 }}>{sim.months} cuotas</div>
                                </div>
                                <div style={{ background:"#0a0a0b",borderRadius:5,padding:"6px 8px",border:`1px solid ${GOLD}33` }}>
                                  <div style={{ color:GRAY,fontSize:9,marginBottom:2 }}>Crédito accesible</div>
                                  <div style={{ color:GOLD,fontSize:12,fontWeight:800 }}>{fmtCOP(Math.round(simCredit))}</div>
                                  <div style={{ color:GRAY,fontSize:10,marginTop:1 }}>en {simCreditDate}</div>
                                </div>
                              </div>
                              <div style={{ padding:"5px 8px",borderRadius:5,background:"#22C55E10",border:`1px solid #22C55E22`,fontSize:10,color:"#22C55E" }}>
                                Pagando <span style={{ fontWeight:700 }}>{fmtCOP(simPmt)}/mes</span> ({fmtCOP(simExtra)} extra) accedes a ~<span style={{ fontWeight:700 }}>{fmtCOP(Math.round(simCredit))}</span> en crédito nuevo <span style={{ fontWeight:700 }}>{msSaved} meses antes</span>
                              </div>
                            </div>
                          )}
                          {simExtra>0 && !simStr && (
                            <div style={{ color:"#F59E0B",fontSize:10 }}>Calcula agregando tasa mensual para ver proyección</div>
                          )}
                        </div>

                        {/* Estado vs fecha objetivo */}
                        {targetStatus && (
                          <div style={{ padding:"6px 9px",borderRadius:5,marginBottom:6,
                            background:targetStatus.onTrack?"#22C55E15":"#EF444415",
                            border:`1px solid ${targetStatus.onTrack?"#22C55E33":"#EF444433"}` }}>
                            {targetStatus.onTrack
                              ? <span style={{ color:"#22C55E",fontSize:11,fontWeight:600 }}>✓ Vas en ritmo — terminas antes de la fecha objetivo</span>
                              : <span style={{ color:"#EF4444",fontSize:11 }}>Para tu fecha objetivo necesitas <span style={{ fontWeight:700 }}>{fmtCOP(targetStatus.extra)}/mes extra</span></span>
                            }
                          </div>
                        )}

                        {/* Intereses base */}
                        {totalPaid && (
                          <div style={{ display:"flex",gap:16,fontSize:10 }}>
                            <span style={{ color:GRAY }}>Intereses totales: <span style={{ color:"#EF4444",fontWeight:600 }}>{fmtCOP(totalInterest)}</span></span>
                            <span style={{ color:GRAY }}>Costo total: <span style={{ color:WHITE,fontWeight:600 }}>{fmtCOP(totalPaid)}</span></span>
                          </div>
                        )}
                      </div>
                      );
                    })()}

                    {/* ── Historial de abonos ── */}
                    {payments.length>0 && (
                      <div style={{ borderTop:`1px solid #EF444422` }}>
                        <div onClick={()=>setExpandedDebt(expD?null:d.id)}
                          style={{ display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 12px",cursor:"pointer",userSelect:"none" }}>
                          <span style={{ color:GRAY,fontSize:10,fontWeight:700,letterSpacing:1 }}>HISTORIAL · {payments.length} abonos · {fmtCOP(totalAbonado)} total</span>
                          <span style={{ color:GRAY,fontSize:10 }}>{expD?"▲":"▼"}</span>
                        </div>
                        {expD && (
                          <div style={{ padding:"0 12px 10px" }}>
                            {[...payments].reverse().map(p=>(
                              <div key={p.id} style={{ display:"flex",alignItems:"center",gap:8,padding:"4px 0",borderBottom:`1px solid #EF444411` }}>
                                <span style={{ color:GRAY,fontSize:11,flex:1 }}>{p.date}</span>
                                <span style={{ color:"#22C55E",fontSize:11,fontWeight:700 }}>-{fmtCOP(p.amount)}</span>
                                <button onClick={()=>{
                                  const restored = d.balance+parseFloat(p.amount);
                                  onUpdate({finance:{...finance,debts:debts.map(x=>x.id===d.id?{...x,balance:restored,payments:payments.filter(pp=>pp.id!==p.id)}:x)}});
                                }} style={{ background:"none",border:"none",color:GRAY,cursor:"pointer",fontSize:12,opacity:0.4,padding:0 }}>×</button>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
              <div style={{ display:"grid",gridTemplateColumns:"1fr 80px 50px 80px 110px 36px",gap:4,marginTop:8,alignItems:"center" }}>
                <input value={debtName} onChange={e=>setDebtName(e.target.value)} placeholder="Acreedor..."
                  style={{ background:"#111113",border:`1px solid ${BORDER}`,borderRadius:6,padding:"5px 7px",color:WHITE,fontSize:11,outline:"none" }} />
                <input value={debtBal} onChange={e=>setDebtBal(e.target.value)} placeholder="Saldo" type="number"
                  style={{ background:"#111113",border:`1px solid ${BORDER}`,borderRadius:6,padding:"5px 7px",color:WHITE,fontSize:11,outline:"none" }} />
                <input value={debtRate} onChange={e=>setDebtRate(e.target.value)} placeholder="%" type="number"
                  style={{ background:"#111113",border:`1px solid ${BORDER}`,borderRadius:6,padding:"5px 7px",color:WHITE,fontSize:11,outline:"none" }} />
                <input value={debtPmt} onChange={e=>setDebtPmt(e.target.value)} placeholder="Cuota" type="number"
                  style={{ background:"#111113",border:`1px solid ${BORDER}`,borderRadius:6,padding:"5px 7px",color:WHITE,fontSize:11,outline:"none" }} />
                <input value={debtTarget||""} onChange={e=>setDebtTarget(e.target.value)} type="date" title="Fecha objetivo de pago"
                  style={{ background:"#111113",border:`1px solid ${BORDER}`,borderRadius:6,padding:"5px 7px",color:GRAY,fontSize:10,outline:"none" }} />

                <div style={{ color:GRAY, fontSize:12, marginTop:5 }}>de <span style={{ color:GOLD, fontWeight:700 }}>{fmtUSD(visionUSD)} USD</span> objetivo</div>

              {avgNetUSD>0 && monthsToGoal && (
                <div style={{ background:"rgba(34,197,94,0.08)", borderRadius:10, padding:"12px 16px", border:`1px solid #22C55E33`, flex:1, minWidth:220 }}>
                  <div style={{ color:GRAY, fontSize:9, fontWeight:700, letterSpacing:2, textTransform:"uppercase", marginBottom:6 }}>A tu ritmo actual</div>
                  <div style={{ color:"#22C55E", fontWeight:900, fontSize:20, lineHeight:1 }}>{monthsToGoal} meses</div>
                  <div style={{ color:GRAY, fontSize:10, marginTop:5 }}>

                  </div>
                  <div style={{ color:GRAY, fontSize:10, marginTop:2 }}>
                    CC {fmtCOP(avgCC)} · Gastos {fmtCOP(avgG)}
                  </div>

            </div>
            <div style={{ background:"rgba(255,255,255,0.04)", borderRadius:8, height:10, overflow:"hidden", marginBottom:6 }}>
              <div style={{ height:"100%", borderRadius:8, background:`linear-gradient(90deg,${GOLD_DIM},${GOLD},#22C55E)`, width:`${pctProgress}%`, transition:"width 0.6s ease" }} />
            </div>
            <div style={{ display:"flex", justifyContent:"space-between", color:GRAY, fontSize:10 }}>
              <span>$0</span>
              <span style={{ color:GOLD, fontWeight:700 }}>{pctProgress.toFixed(1)}% completado</span>
              <span>{fmtUSD(visionUSD)}</span>
            </div>
            {!avgNetUSD && (
              <div style={{ color:GRAY, fontSize:11, marginTop:12, padding:"10px 14px", background:"#111113", borderRadius:8 }}>
                Registrá ingresos y gastos en Mensual para ver la proyección real
              </div>
            )}
          </div>

          <div style={{ display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:20 }}>
            {[
              { overline:"Escenario 24 meses", sub:"necesitás ganar/mes",
                val: gap>0 ? fmtCOP(gap/24*fxRate + avgG) : "¡Meta alcanzada!",
                detail: gap>0 ? `${fmtUSD(gap/24)} ahorro + gastos` : null,
                color:"#3B82F6" },
              { overline:"Escenario 36 meses", sub:"necesitás ganar/mes",
                val: gap>0 ? fmtCOP(gap/36*fxRate + avgG) : "¡Meta alcanzada!",
                detail: gap>0 ? `${fmtUSD(gap/36)} ahorro + gastos` : null,
                color:"#8B5CF6" },
              { overline:"Brecha restante", sub: gap>0 ? `≈ ${fmtCOP(gap*fxRate)}` : "Objetivo superado",
                val: gap>0 ? fmtUSD(gap)+" USD" : "¡Ya llegaste!",
                detail: null,
                color: gap<=0?"#22C55E":GOLD },
            ].map(({overline,sub,val,detail,color})=>(
              <div key={overline} style={{ background:"#0a0a0b", borderRadius:12, padding:"16px", border:`1px solid ${BORDER}`, borderTop:`2px solid ${color}55` }}>
                <div style={{ color:color+"88", fontSize:9, fontWeight:700, letterSpacing:2, textTransform:"uppercase", marginBottom:6 }}>{overline}</div>
                <div style={{ color, fontWeight:900, fontSize:16, lineHeight:1.2, marginBottom:4 }}>{val}</div>

                {detail && <div style={{ color:GRAY, fontSize:9 }}>{detail}</div>}

          <div style={{ background:CARD,borderRadius:12,padding:16,border:`1px solid ${BORDER}` }}>
            <div style={{ color:WHITE,fontWeight:700,fontSize:13,marginBottom:4 }}>Proyección 24 meses</div>
            <div style={{ color:GRAY,fontSize:10,marginBottom:14 }}>
              Basado en ahorro neto de <span style={{ color:"#22C55E" }}>{fmtUSD(avgNetUSD)}/mes</span>
              {recent.length>0&&` · promedio últimos ${recent.length} meses con datos`}
            </div>
            <div style={{ display:"flex",gap:2,alignItems:"flex-end",overflowX:"auto",paddingBottom:4 }}>
              {Array.from({length:24},(_,i)=>{
                const proj  = netWorthUSD+(i+1)*avgNetUSD;
                const pct   = Math.min(100,Math.max(0,proj/visionUSD*100));
                const hit   = proj>=visionUSD;
                const now   = new Date();
                const dt    = new Date(now.getFullYear(),now.getMonth()+i+1,1);
                const label = `${MONTHS[dt.getMonth()]} ${String(dt.getFullYear()).slice(2)}`;
                return (
                  <div key={i} title={`${label}: ${fmtUSD(proj)} (${pct.toFixed(0)}%)`}
                    style={{ display:"flex",flexDirection:"column",alignItems:"center",minWidth:26 }}>
                    <div style={{ height:90,width:18,background:"#222225",borderRadius:4,overflow:"hidden",position:"relative" }}>
                      <div style={{ position:"absolute",bottom:0,width:"100%",borderRadius:4,background:hit?"#22C55E":i<11?GOLD_DIM:GOLD,height:`${pct}%` }} />

                    <span style={{ color:GRAY,fontSize:8,marginTop:3,textAlign:"center",lineHeight:1.2 }}>{label}</span>

              <span style={{display:"flex",gap:4,alignItems:"center"}}><span style={{width:10,height:10,background:GOLD_DIM,borderRadius:2,display:"inline-block"}}/>Año 1</span>
              <span style={{display:"flex",gap:4,alignItems:"center"}}><span style={{width:10,height:10,background:GOLD,borderRadius:2,display:"inline-block"}}/>Año 2</span>
              <span style={{display:"flex",gap:4,alignItems:"center"}}><span style={{width:10,height:10,background:"#22C55E",borderRadius:2,display:"inline-block"}}/>Meta</span>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── PERSONAL TAB ─────────────────────────────────────────────────────────────
function PersonalTab({ data, onChange }) {
  const { useState: us } = React;
  const [unlocked,  setUnlocked]  = us(false);
  const [pinInput,  setPinInput]  = us("");
  const [pinError,  setPinError]  = us(false);
  const [subTab,    setSubTab]    = us("entrenamiento");

  const personal = data.personal || {};
  const pin      = data.settings?.personalPin || "";

  if (pin && !unlocked) {
    return (
      <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", minHeight:340, gap:14 }}>
        <div style={{ fontSize:32 }}>🔒</div>
        <div style={{ color:WHITE, fontSize:16, fontWeight:700 }}>Área Personal</div>
        <div style={{ color:GRAY, fontSize:13 }}>Ingresá tu PIN para acceder</div>
        <input type="password" value={pinInput}
          onChange={e=>{ setPinInput(e.target.value); setPinError(false); }}
          onKeyDown={e=>{ if(e.key==="Enter"){ if(pinInput===pin){setUnlocked(true);setPinInput("");}else{setPinError(true);setPinInput("");} } }}
          placeholder="PIN" autoFocus
          style={{ background:"#111113", border:`2px solid ${pinError?"#EF4444":BORDER}`, borderRadius:10, padding:"12px 20px", color:WHITE, fontSize:18, textAlign:"center", outline:"none", width:180, letterSpacing:8 }} />
        {pinError && <div style={{ color:"#EF4444", fontSize:12 }}>PIN incorrecto</div>}
        <button onClick={()=>{ if(pinInput===pin){setUnlocked(true);setPinInput("");}else{setPinError(true);setPinInput("");} }}
          style={{ padding:"10px 32px", background:GOLD, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:14 }}>
          Acceder
        </button>
      </div>
    );
  }

  const updatePersonal = (patch) => onChange({ ...data, personal: { ...personal, ...patch } });

  return (
    <div>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:20 }}>
        <div>
          <div style={{ color:GOLD_DIM, fontSize:10, fontWeight:700, letterSpacing:3, textTransform:"uppercase", marginBottom:5 }}>Privado</div>
          <div style={{ color:WHITE, fontWeight:800, fontSize:20, letterSpacing:-0.3 }}>Área Personal</div>
          <div style={{ color:GRAY, fontSize:12 }}>Solo visible para vos</div>
        </div>
        {pin && <button onClick={()=>setUnlocked(false)}
          style={{ padding:"7px 14px", background:"rgba(42,42,46,0.5)", color:GRAY, border:`1px solid ${BORDER}`, borderRadius:8, cursor:"pointer", fontSize:12, fontWeight:500 }}>
          🔒 Bloquear
        </button>}
      </div>

      <div style={{ display:"flex", gap:0, marginBottom:24, borderBottom:`1px solid ${BORDER}` }}>
        {[["entrenamiento","Entrenamiento"],["metricas","Métricas"],["finanzas","Finanzas"]].map(([id,label])=>(
          <button key={id} onClick={()=>setSubTab(id)}
            className={`gp-nav-tab${subTab===id?" active":""}`}>
            {label}
          </button>
        ))}
      </div>

      {subTab==="entrenamiento" && <EntrenamientoSection personal={personal} onUpdate={updatePersonal} />}
      {subTab==="metricas"      && <MetricasSection      personal={personal} onUpdate={updatePersonal} />}
      {subTab==="finanzas"      && <FinanzasSection      personal={personal} onUpdate={updatePersonal} />}
    </div>
  );
}

// ─── SETTINGS TAB ─────────────────────────────────────────────────────────────
function SettingsTab({ data, onChange }) {
  const [key, setKey] = useState(data.settings?.apiKey || "");
  const [saved, setSaved] = useState(false);
  const [testStatus, setTestStatus] = useState(null);
  const [testMsg, setTestMsg] = useState("");
  const [importMsg, setImportMsg] = useState("");
  const [pinInput, setPinInput] = useState("");
  const [pinCurrent, setPinCurrent] = useState("");
  const [pinSaved, setPinSaved] = useState(false);
  const [pinError, setPinError] = useState(false);
  const hasPin = !!data.settings?.teamPin;

  const savePin = () => {
    if (hasPin && pinCurrent !== data.settings.teamPin) {
      setPinError(true);
      setTimeout(()=>setPinError(false), 2000);
      return;
    }
    onChange({ ...data, settings: { ...(data.settings||{}), teamPin: pinInput.trim() } });
    setPinInput(""); setPinCurrent("");
    setPinSaved(true);
    setTimeout(()=>setPinSaved(false), 2000);
  };

  const removePin = () => {
    if (pinCurrent !== data.settings.teamPin) {
      setPinError(true);
      setTimeout(()=>setPinError(false), 2000);
      return;
    }
    onChange({ ...data, settings: { ...(data.settings||{}), teamPin: "" } });
    setPinInput(""); setPinCurrent("");
  };

  const saveKey = () => {
    onChange({ ...data, settings: { ...(data.settings||{}), apiKey: key.trim() } });
    setSaved(true);
    setTimeout(()=>setSaved(false), 2000);
  };

  const testConnection = async () => {
    if (!key.trim()) return;
    setTestStatus("loading"); setTestMsg("");
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "x-api-key": key.trim(),
          "anthropic-version":"2023-06-01",
          "anthropic-dangerous-direct-browser-access":"true",
        },
        body: JSON.stringify({ model:"claude-haiku-4-5-20251001", max_tokens:10, messages:[{ role:"user", content:"Responde solo: OK" }] }),
      });
      const json = await res.json();
      if (json.error) throw new Error(json.error.message);
      setTestStatus("ok"); setTestMsg("Conexión exitosa — Claude responde correctamente.");
    } catch(e) {
      setTestStatus("error"); setTestMsg(e.message || "API key inválida o error de red.");
    }
  };

  const handleExport = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `gp_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (!parsed.clients) throw new Error("Archivo inválido");
        onChange(parsed);
        setImportMsg("✓ Datos importados correctamente.");
        setTimeout(()=>setImportMsg(""), 4000);
      } catch {
        setImportMsg("Error: archivo no válido.");
        setTimeout(()=>setImportMsg(""), 4000);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  return (
    <div style={{ maxWidth:600 }}>
      <div style={{ marginTop:0, padding:16, background:"rgba(212,175,55,0.06)", border:`1px solid ${GOLD_DIM}`, borderRadius:10 }}>
        <div style={{ color:GOLD, fontWeight:600, fontSize:13, marginBottom:6 }}>✦ Conexión con Claude IA</div>
        <div style={{ color:GRAY, fontSize:12, lineHeight:1.6, marginBottom:12 }}>
          Pega tu API key de Anthropic para que el botón "Analizar con IA" en el canvas llame directamente a Claude y muestre el análisis en el dashboard. La key se guarda localmente, nunca sale de tu dispositivo.
        </div>
        <div style={{ display:"flex", gap:8 }}>
          <input
            type="password"
            value={key}
            onChange={e=>{ setKey(e.target.value); setTestStatus(null); setTestMsg(""); }}
            placeholder="sk-ant-api03-..."
            style={{ flex:1, background:BG, border:`1px solid ${BORDER}`, borderRadius:8, padding:"8px 12px", color:WHITE, fontSize:13, outline:"none" }}
          />
          <button onClick={testConnection} disabled={!key.trim() || testStatus==="loading"}
            style={{ padding:"8px 14px", background:"transparent", color:testStatus==="ok"?GREEN:testStatus==="error"?"#EF4444":GRAY, border:`1px solid ${testStatus==="ok"?GREEN:testStatus==="error"?"#EF4444":BORDER}`, borderRadius:8, cursor:"pointer", fontSize:13, fontWeight:600, opacity: testStatus==="loading"?0.7:1 }}>
            {testStatus==="loading" ? "Probando…" : testStatus==="ok" ? "✓ OK" : testStatus==="error" ? "✕ Error" : "Probar"}
          </button>
          <button onClick={saveKey}
            style={{ padding:"8px 18px", background:GOLD, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13 }}>
            {saved ? "✓ Guardado" : "Guardar"}
          </button>
        </div>
        {testMsg && (
          <div style={{ marginTop:8, fontSize:11, color: testStatus==="ok" ? GREEN : "#EF4444" }}>{testMsg}</div>
        )}
        {!testMsg && data.settings?.apiKey && (
          <div style={{ marginTop:8, color:GREEN, fontSize:11 }}>✓ API key activa — el análisis de IA y la importación de imágenes están habilitados.</div>
        )}
      </div>

      <div style={{ marginTop:20, padding:16, background:"rgba(76,175,125,0.06)", border:`1px solid ${GREEN}44`, borderRadius:10 }}>
        <div style={{ color:GREEN, fontWeight:600, fontSize:13, marginBottom:6 }}>Backup de datos</div>
        <div style={{ color:GRAY, fontSize:12, lineHeight:1.6, marginBottom:12 }}>
          Exportá todos tus clientes, tareas y procesos como archivo JSON. Antes de cualquier actualización del dashboard, hacé un backup.
        </div>
        <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
          <button onClick={handleExport}
            style={{ padding:"8px 18px", background:GREEN, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13 }}>
            ↓ Exportar datos
          </button>
          <label style={{ padding:"8px 18px", background:"transparent", color:WHITE, border:`1px solid ${BORDER}`, borderRadius:8, cursor:"pointer", fontWeight:600, fontSize:13 }}>
            ↑ Importar datos
            <input type="file" accept=".json" onChange={handleImport} style={{ display:"none" }} />
          </label>
        </div>
        {importMsg && <div style={{ marginTop:8, color:GREEN, fontSize:11 }}>{importMsg}</div>}
      </div>

      {/* PIN Personal */}
      {(()=>{
        const [pp, setPp]       = React.useState("");
        const [ppCur, setPpCur] = React.useState("");
        const [ppSaved, setPpSaved] = React.useState(false);
        const [ppErr, setPpErr] = React.useState(false);
        const haspp = !!data.settings?.personalPin;
        const savepp = () => {
          if (haspp && ppCur !== data.settings.personalPin) { setPpErr(true); setTimeout(()=>setPpErr(false),2000); return; }
          onChange({ ...data, settings: { ...(data.settings||{}), personalPin: pp.trim() } });
          setPp(""); setPpCur(""); setPpSaved(true); setTimeout(()=>setPpSaved(false),2000);
        };
        const removepp = () => {
          if (ppCur !== data.settings.personalPin) { setPpErr(true); setTimeout(()=>setPpErr(false),2000); return; }
          onChange({ ...data, settings: { ...(data.settings||{}), personalPin: "" } });
          setPp(""); setPpCur("");
        };
        return (
          <div style={{ marginTop:20, padding:16, background:"rgba(139,92,246,0.05)", border:`1px solid rgba(139,92,246,0.25)`, borderRadius:10 }}>
            <div style={{ color:"#8B5CF6", fontWeight:600, fontSize:13, marginBottom:6 }}>🔒 PIN — Área Personal</div>
            <div style={{ color:GRAY, fontSize:12, lineHeight:1.6, marginBottom:12 }}>
              {haspp ? "Para cambiar o quitar el PIN debés ingresar el PIN actual." : "Configurá un PIN para proteger tu sección Personal."}
            </div>
            {ppErr && <div style={{ color:"#EF4444", fontSize:12, marginBottom:8 }}>PIN actual incorrecto.</div>}
            {haspp && (
              <div style={{ display:"flex", gap:8, marginBottom:10 }}>
                <input type="password" value={ppCur} onChange={e=>setPpCur(e.target.value)} placeholder="PIN actual"
                  style={{ width:140, background:BG, border:`1px solid ${ppErr?"#EF4444":BORDER}`, borderRadius:8, padding:"8px 12px", color:WHITE, fontSize:13, outline:"none", letterSpacing:4 }} />
              </div>
            )}
            <div style={{ display:"flex", gap:8 }}>
              <input type="password" value={pp} onChange={e=>setPp(e.target.value)} onKeyDown={e=>e.key==="Enter"&&savepp()}
                placeholder={haspp ? "Nuevo PIN" : "Nuevo PIN (ej: 1234)"}
                style={{ flex:1, background:BG, border:`1px solid ${BORDER}`, borderRadius:8, padding:"8px 12px", color:WHITE, fontSize:13, outline:"none", letterSpacing:4 }} />
              <button onClick={savepp}
                style={{ padding:"8px 18px", background:"#8B5CF6", color:"#fff", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13 }}>
                {ppSaved ? "✓ Guardado" : haspp ? "Cambiar" : "Activar"}
              </button>
              {haspp && <button onClick={removepp} style={{ padding:"8px 14px", background:"transparent", color:GRAY, border:`1px solid ${BORDER}`, borderRadius:8, cursor:"pointer", fontSize:13 }}>Quitar</button>}
            </div>
            {haspp && !ppErr && !ppSaved && <div style={{ marginTop:8, color:"#8B5CF6", fontSize:11 }}>✓ Área Personal protegida con PIN.</div>}
          </div>
        );
      })()}

      <div style={{ marginTop:20, padding:16, background:"rgba(239,68,68,0.05)", border:`1px solid rgba(239,68,68,0.25)`, borderRadius:10 }}>
        <div style={{ color:"#EF4444", fontWeight:600, fontSize:13, marginBottom:6 }}>🔒 PIN — Equipo y Roles</div>

          {hasPin ? "Para cambiar o quitar el PIN debés ingresar el PIN actual primero." : "Configurá un PIN para proteger la pestaña Equipo y Roles. Solo quien lo conozca puede acceder."}
        </div>
        {pinError && <div style={{ color:"#EF4444", fontSize:12, marginBottom:8, fontWeight:600 }}>PIN actual incorrecto.</div>}
        {hasPin && (
          <div style={{ display:"flex", gap:8, marginBottom:10 }}>
            <input type="password" value={pinCurrent} onChange={e=>setPinCurrent(e.target.value)}
              placeholder="PIN actual"
              style={{ width:140, background:BG, border:`1px solid ${pinError?"#EF4444":BORDER}`, borderRadius:8, padding:"8px 12px", color:WHITE, fontSize:13, outline:"none", letterSpacing:4 }} />
            <span style={{ color:GRAY, fontSize:12, alignSelf:"center" }}>→ ingresá el PIN actual para continuar</span>
          </div>
        )}
        <div style={{ display:"flex", gap:8 }}>
          <input type="password" value={pinInput} onChange={e=>setPinInput(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&savePin()}
            placeholder={hasPin ? "Nuevo PIN" : "Nuevo PIN (ej: 1234)"}
            style={{ flex:1, background:BG, border:`1px solid ${BORDER}`, borderRadius:8, padding:"8px 12px", color:WHITE, fontSize:13, outline:"none", letterSpacing:4 }} />
          <button onClick={savePin}
            style={{ padding:"8px 18px", background:"#EF4444", color:"#fff", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13 }}>
            {pinSaved ? "✓ Guardado" : hasPin ? "Cambiar PIN" : "Activar PIN"}
          </button>
          {hasPin && (
            <button onClick={removePin}
              style={{ padding:"8px 14px", background:"transparent", color:GRAY, border:`1px solid ${BORDER}`, borderRadius:8, cursor:"pointer", fontSize:13 }}>
              Quitar PIN
            </button>
          )}
        </div>
        {hasPin && !pinError && !pinSaved && (
          <div style={{ marginTop:8, color:"#EF4444", fontSize:11 }}>✓ Equipo y Roles está protegido con PIN.</div>
        )}
      </div>
    </div>
  );
}

function StepsEditor({ steps, color, onUpdate, onDelete, onAdd, onReset }) {

    <div>
      {steps.map((step, idx) => (
        <div key={step.id || step.n || idx} style={{ display:"flex", gap:8, alignItems:"flex-start", marginBottom:8, padding:"10px 12px", background:CARD, borderRadius:8, border:`1px solid ${BORDER}` }}>

          <div style={{ flex:1, display:"flex", flexDirection:"column", gap:4 }}>
            <input value={step.title} onChange={e=>onUpdate(idx,{title:e.target.value})}
              style={{ background:"transparent", border:"none", borderBottom:`1px solid ${BORDER}`, color:WHITE, fontSize:13, fontWeight:600, outline:"none", padding:"3px 0", width:"100%" }} />
            <input value={step.desc||""} onChange={e=>onUpdate(idx,{desc:e.target.value})}
              placeholder="Descripción del paso..."
              style={{ background:"transparent", border:"none", color:GRAY, fontSize:11, outline:"none", padding:"2px 0", width:"100%" }} />
          </div>
          <button onClick={()=>onDelete(idx)} style={{ background:"none", border:"none", color:RED, cursor:"pointer", fontSize:16, padding:"4px 6px", opacity:0.7, flexShrink:0, marginTop:4 }}>×</button>
        </div>
      ))}
      <div style={{ display:"flex", gap:8, marginTop:8 }}>
        <button onClick={onAdd}
          style={{ padding:"7px 16px", background:"#222225", color:WHITE, border:`1px dashed ${BORDER}`, borderRadius:8, cursor:"pointer", fontSize:12 }}>
          + Agregar paso
        </button>
        {onReset && (
          <button onClick={onReset}
            style={{ padding:"7px 14px", background:"transparent", color:GRAY, border:`1px solid ${BORDER}`, borderRadius:8, cursor:"pointer", fontSize:12 }}>
            ↺ Restaurar defaults
          </button>
        )}
      </div>
    </div>
  );
}
