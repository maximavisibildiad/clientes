}

// ─── MÉTRICAS SECTION ─────────────────────────────────────────────────────────
function MetricasSection({ personal, onUpdate }) {
  const { useState: us, useEffect: ue, useRef: ur } = React;
  const items   = personal.metricsItems || [];
  const logs    = personal.metricsLogs  || {};
  const goals   = personal.goals        || [];
  const warMap  = personal.warMap       || {};
  const warMapCategories = personal.warMapCategories || [];

  const [wmYear,      setWmYear]      = us(new Date().getFullYear());
  const [editLegend,  setEditLegend]  = us(false);
  const [selDay,      setSelDay]      = us(null);
  const [modalTitle,  setModalTitle]  = us("");
  const [modalCatId,  setModalCatId]  = us(null);
  const [modalTime,   setModalTime]   = us("09:00");
  const [modalAllDay, setModalAllDay] = us(true);
  const [paintCatId,  setPaintCatId]  = us(null);
  const [dragDays,    setDragDays]    = us([]);

  // refs for drag-paint (avoid stale closures in window events)
  const dragRef  = ur({ painting: false, days: [] });
  const snapRef  = ur({});
  snapRef.current = { warMap, warMapCategories, paintCatId, onUpdate };

  // Ref siempre actualizado para onUpdate y personal (evita stale closures en el efecto de sync)
  const syncRef = ur({});
  syncRef.current = { personal, onUpdate };

  // Sync warMapCategories from goals whenever goals change
  ue(() => {
    const { personal: p, onUpdate: upd } = syncRef.current;
    const wmc = p.warMapCategories || [];
    const goalLabels = p.goals || [];
    if (!goalLabels.length) return;
    // Solo sincroniza si hay una meta sin categoría (no remueve cats extras — addGoal/removeGoalAndCat lo manejan)
    const needsSync = goalLabels.some(g => !wmc.find(c => c.label === g));
    if (!needsSync) return;
    const COLORS = ["#22C55E","#3B82F6","#F59E0B","#8B5CF6","#EC4899","#EF4444","#06B6D4","#84CC16","#F97316"];
    const usedColors = wmc.map(c => c.color);
    const newCats = goalLabels.map((g, i) => {
      const ex = wmc.find(c => c.label === g);
      if (ex) return ex;
      const col = COLORS.find(c => !usedColors.includes(c)) || COLORS[i % COLORS.length];
      usedColors.push(col);
      return { id: `cat_${uid()}`, label: g, color: col };
    });
    upd({ warMapCategories: newCats });
  }, [(personal.goals || []).join('|')]);

  // Global mousemove + mouseup for drag-paint
  ue(() => {
    const handleMove = (e) => {
      if (!dragRef.current.painting) return;
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const ds = el?.dataset?.ds || el?.parentElement?.dataset?.ds;
      if (ds && !dragRef.current.days.includes(ds)) {
        const next = [...dragRef.current.days, ds];
        dragRef.current.days = next;
        setDragDays(next);
      }
    };
    const handleUp = () => {
      const { warMap: wm, warMapCategories: cats, paintCatId: cid, onUpdate: upd } = snapRef.current;
      if (dragRef.current.painting && dragRef.current.days.length > 0 && cid) {
        const cat = cats.find(c => c.id === cid);
        if (cat) {
          const nm = { ...wm };
          dragRef.current.days.forEach(ds => {
            const ex = nm[ds];
            nm[ds] = { color: cat.color, title: (ex && typeof ex === "object" ? ex.title : "") || "", catId: cid };
          });
          upd({ warMap: nm });
        }
      }
      dragRef.current = { painting: false, days: [] };
      setDragDays([]);
    };
    window.addEventListener("mousemove", handleMove);
    window.addEventListener("mouseup", handleUp);
    return () => {
      window.removeEventListener("mousemove", handleMove);
      window.removeEventListener("mouseup", handleUp);
    };
  }, []);

  const todayStr = new Date().toISOString().slice(0,10);
  const todayLog = logs[todayStr] || {};

  const [newItem,   setNewItem]   = us("");
  const [newGoal,   setNewGoal]   = us("");
  const [editGoals, setEditGoals] = us(false);

  // ── WAR MAP helpers ──
  const MONTHS_ES = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
  const MONTHS_FULL = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

  const getEntry = (ds) => {
    const v = warMap[ds];
    if (!v) return null;
    if (typeof v === "string") return { color:v, title:"", catId:null };
    return v;
  };

  const openModal = (ds) => {
    const e = getEntry(ds);
    setSelDay(ds);
    setModalTitle(e?.title || "");
    setModalCatId(e?.catId || (warMapCategories[0]?.id || null));
    setModalTime("09:00");
    setModalAllDay(true);
  };

  const saveDay = () => {
    if (!selDay) return;
    const cat = warMapCategories.find(c=>c.id===modalCatId);
    if (!modalTitle.trim() && !cat) { closeModal(); return; }
    const entry = { color: cat?.color||GOLD, title: modalTitle.trim(), catId: modalCatId };
    onUpdate({ warMap: { ...warMap, [selDay]: entry } });
    closeModal();
  };

  const deleteDay = () => {
    if (!selDay) return;
    const nm = {...warMap}; delete nm[selDay];
    onUpdate({ warMap: nm }); closeModal();
  };

  const closeModal = () => { setSelDay(null); setModalTitle(""); setModalCatId(null); };

  const openGCal = () => {
    if (!selDay) return;
    const d  = selDay.replace(/-/g,"");
    const nd = (() => { const x=new Date(selDay); x.setDate(x.getDate()+1); return x.toISOString().slice(0,10).replace(/-/g,""); })();
    let dates;
    if (modalAllDay) {
      dates = `${d}/${nd}`;
    } else {
      const [h,m] = modalTime.split(":");
      const start = `${d}T${h}${m}00`;
      const endH  = String(parseInt(h)+1).padStart(2,"0");
      const end   = `${d}T${endH}${m}00`;
      dates = `${start}/${end}`;
    }
    const title = encodeURIComponent(modalTitle || getEntry(selDay)?.title || "Evento");
    const cat   = warMapCategories.find(c=>c.id===modalCatId);
    const details = encodeURIComponent(cat?.label ? `Categoría: ${cat.label}` : "");
    window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dates}&details=${details}`, "_blank");
  };

  const renderMonth = (year, mi) => {
    const days    = new Date(year, mi+1, 0).getDate();
    const todayDs = new Date().toISOString().slice(0,10);
    const cells   = [];
    for (let d=1; d<=days; d++) {
      const ds    = `${year}-${String(mi+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const entry = getEntry(ds);
      const col   = entry?.color;
      const isToday = ds === todayDs;
      cells.push(
        <div key={d}
          data-ds={ds}
          title={entry?.title ? `${ds}: ${entry.title}` : ds}
          onMouseDown={e=>{
            e.preventDefault();
            if (paintCatId) {
              dragRef.current = { painting: true, days: [ds] };
              setDragDays([ds]);
            } else {
              openModal(ds);
            }
          }}
          style={{ width:20, height:20, display:"flex", alignItems:"center", justifyContent:"center",
            borderRadius:3, fontSize:9, position:"relative", userSelect:"none",
            cursor: paintCatId ? "crosshair" : "pointer",
            background: dragDays.includes(ds) && paintCatId
              ? (warMapCategories.find(c=>c.id===paintCatId)?.color||GOLD)+"bb"
              : col || "transparent",
            color: col || (dragDays.includes(ds) && paintCatId) ? "#141414" : isToday ? GOLD : GRAY,
            border: `1px solid ${isToday&&!col ? GOLD+"88" : col ? "transparent" : "#2a2a2e"}`,
            fontWeight: col||isToday||dragDays.includes(ds) ? 700 : 400,
            outline: dragDays.includes(ds) ? `2px solid ${warMapCategories.find(c=>c.id===paintCatId)?.color||GOLD}` : "none" }}>
          {d}
          {entry?.title && <span style={{ position:"absolute", top:1, right:1, width:4, height:4, borderRadius:"50%", background:"#141414", opacity:0.7 }} />}
        </div>
      );
    }
    while (cells.length % 5 !== 0) cells.push(<div key={"pad"+cells.length} style={{width:20,height:20}} />);
    const hasEvents = Array.from({length:days},(_,i)=>`${year}-${String(mi+1).padStart(2,"0")}-${String(i+1).padStart(2,"0")}`).some(ds=>warMap[ds]);
    return (
      <div key={mi} style={{ background:"#111113", borderRadius:8, padding:"8px 10px", border:`1px solid ${hasEvents?BORDER+"88":BORDER}` }}>
        <div style={{ color:WHITE, fontWeight:700, fontSize:10, textAlign:"center", marginBottom:6, letterSpacing:1 }}>{MONTHS_ES[mi]}</div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(5,20px)", gap:2 }}>{cells}</div>
      </div>
    );
  };

  const toggle = (itemId) => {
    const val = !todayLog[itemId];
    onUpdate({ metricsLogs: { ...logs, [todayStr]: { ...todayLog, [itemId]: val } } });
  };

  const addItem = () => {
    if (!newItem.trim()) return;
    const item = { id: "mi_"+Date.now(), label: newItem.trim() };
    onUpdate({ metricsItems: [...items, item] });
    setNewItem("");
  };

  const removeItem = (id) => onUpdate({ metricsItems: items.filter(i=>i.id!==id) });

  const done  = items.filter(i=>todayLog[i.id]).length;
  const total = items.length;
  const pct   = total>0 ? Math.round(done/total*100) : 0;

  // 30-day heatmap
  const days30 = Array.from({length:30},(_,i)=>{
    const d = new Date(); d.setDate(d.getDate()-29+i);
    const ds = d.toISOString().slice(0,10);
    const lg = logs[ds]||{};
    const cnt = items.filter(it=>lg[it.id]).length;
    return { ds, cnt, pct: total>0 ? cnt/total : 0 };
  });

  // ── TRACKER HELPERS ──
  const habitStreak = (itemId) => {
    let s = 0;
    const d = new Date(todayStr+"T12:00:00");
    if (!todayLog[itemId]) d.setDate(d.getDate()-1);
    while (s < 366) {
      const ds = d.toISOString().slice(0,10);
      if (logs[ds]?.[itemId]) { s++; d.setDate(d.getDate()-1); }
      else break;
    }
    return s;
  };
  const habitWeek7 = (itemId) => Array.from({length:7},(_,i)=>{
    const d = new Date(todayStr+"T12:00:00"); d.setDate(d.getDate()-6+i);
    const ds = d.toISOString().slice(0,10);
    return { ds, done:!!(logs[ds]?.[itemId]), isToday:ds===todayStr };
  });
  const habitScore30 = (itemId) => {
    const cnt = Array.from({length:30},(_,i)=>{
      const d = new Date(todayStr+"T12:00:00"); d.setDate(d.getDate()-29+i);
      return (logs[d.toISOString().slice(0,10)]?.[itemId]) ? 1 : 0;
    }).reduce((a,b)=>a+b,0);
    return Math.round(cnt/30*100);
  };
  const weekDots = Array.from({length:7},(_,i)=>{
    const d = new Date(todayStr+"T12:00:00"); d.setDate(d.getDate()-6+i);
    const ds = d.toISOString().slice(0,10);
    const lg = logs[ds]||{};
    const cnt = items.filter(it=>lg[it.id]).length;
    return { ds, pct:items.length?cnt/items.length:0, isToday:ds===todayStr, dayIdx:new Date(ds+"T12:00:00").getDay() };
  });
  const gStreak = (() => {
    if (!items.length) return 0;
    let s = 0;
    const d = new Date(todayStr+"T12:00:00");
    if (!items.every(it=>todayLog[it.id])) d.setDate(d.getDate()-1);
    while (s < 366) {
      const ds = d.toISOString().slice(0,10);
      const lg = logs[ds]||{};
      if (items.every(it=>lg[it.id])) { s++; d.setDate(d.getDate()-1); }
      else break;
    }
    return s;
  })();

  // goal → category color lookup
  const GOAL_COLORS = ["#22C55E","#3B82F6","#F59E0B","#8B5CF6","#EC4899","#EF4444","#06B6D4","#84CC16","#F97316"];
  const catForGoal = (g) => warMapCategories.find(c => c.label === g);

  const addGoal = () => {
    if (!newGoal.trim()) return;
    const used = warMapCategories.map(c=>c.color);
    const col  = GOAL_COLORS.find(c=>!used.includes(c)) || GOAL_COLORS[goals.length % GOAL_COLORS.length];
    const newCat = { id:"wmc"+Date.now(), label:newGoal.trim(), color:col };
    onUpdate({ goals:[...goals,newGoal.trim()], warMapCategories:[...warMapCategories,newCat] });
    setNewGoal("");
  };

  const editGoalLabel = (i, val) => {
    const old = goals[i];
    const gs  = [...goals]; gs[i] = val;
    const newCats = warMapCategories.map(c => c.label===old ? {...c,label:val} : c);
    onUpdate({ goals:gs, warMapCategories:newCats });
  };

  const removeGoalAndCat = (i) => {
    const label = goals[i];
    onUpdate({ goals:goals.filter((_,j)=>j!==i), warMapCategories:warMapCategories.filter(c=>c.label!==label) });
  };

  return (
    <div>
      {/* ── CHECKLIST DIARIO ── */}
      <div style={{ background:CARD, borderRadius:12, padding:18, border:`1px solid ${BORDER}`, marginBottom:16 }}>
        {/* Header */}
        <div style={{ display:"flex", alignItems:"flex-start", gap:14, marginBottom:16 }}>
          {/* Progress ring */}
          <div style={{ position:"relative", flexShrink:0, width:60, height:60 }}>
            <svg width={60} height={60} style={{ transform:"rotate(-90deg)" }}>
              <circle cx={30} cy={30} r={24} fill="none" stroke={BORDER} strokeWidth={5} />
              <circle cx={30} cy={30} r={24} fill="none"
                stroke={pct===100?"#22C55E":GOLD} strokeWidth={5}
                strokeDasharray={(2*Math.PI*24).toFixed(2)}
                strokeDashoffset={(2*Math.PI*24*(1-pct/100)).toFixed(2)}
                strokeLinecap="round" />
            </svg>
            <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center" }}>
              <span style={{ color:WHITE, fontWeight:800, fontSize:13 }}>{pct}%</span>
            </div>
          </div>
          <div style={{ flex:1 }}>
            <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between" }}>
              <div>
                <div style={{ color:WHITE, fontWeight:700, fontSize:14 }}>
                  {(()=>{ const d=new Date(todayStr+"T12:00:00"); const dias=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"]; const meses=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"]; return `${dias[d.getDay()]} ${d.getDate()} ${meses[d.getMonth()]}`; })()}
                </div>
                <div style={{ color:GRAY, fontSize:11, marginTop:2 }}>{done}/{total} completados</div>
              </div>
              {gStreak>0&&(
                <div style={{ display:"flex", alignItems:"center", gap:4, background:"#F59E0B11", border:"1px solid #F59E0B33", borderRadius:8, padding:"4px 10px", flexShrink:0 }}>
                  <span style={{ fontSize:14 }}>🔥</span>
                  <div style={{ lineHeight:1.1 }}>
                    <div style={{ color:"#F59E0B", fontSize:13, fontWeight:800 }}>{gStreak}</div>
                    <div style={{ color:"#F59E0B88", fontSize:9 }}>días</div>
                  </div>
                </div>
              )}
            </div>
            {/* Week rhythm */}
            <div style={{ display:"flex", gap:4, marginTop:8 }}>
              {weekDots.map((d)=>{
                const L=["D","L","M","X","J","V","S"][d.dayIdx];
                return (
                  <div key={d.ds} style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:2 }}>
                    <div style={{ width:22, height:22, borderRadius:5,
                      background:d.pct===0?"#1A1A1D":d.pct<1?GOLD+"55":"#22C55E",
                      border:`2px solid ${d.isToday?(d.pct===1?"#22C55E":GOLD):"transparent"}`,
                      display:"flex", alignItems:"center", justifyContent:"center" }}>
                      {d.pct===1&&<span style={{color:"#141414",fontSize:10,fontWeight:800}}>✓</span>}
                    </div>
                    <span style={{ fontSize:9, color:d.isToday?GOLD:GRAY, fontWeight:d.isToday?700:400 }}>{L}</span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
        {/* Items */}
        {items.map(item=>{
          const isDone  = !!todayLog[item.id];
          const streak  = habitStreak(item.id);
          const week7   = habitWeek7(item.id);
          const score   = habitScore30(item.id);
          return (
            <div key={item.id} onClick={()=>toggle(item.id)}
              style={{ display:"flex", alignItems:"center", gap:8, padding:"9px 12px", borderRadius:8, cursor:"pointer",
                background:isDone?"#22C55E0D":"transparent", marginBottom:4,
                border:`1px solid ${isDone?"#22C55E44":BORDER}` }}>
              <div style={{ width:20, height:20, borderRadius:5, border:`2px solid ${isDone?"#22C55E":BORDER}`,
                background:isDone?"#22C55E":"transparent", display:"flex", alignItems:"center",
                justifyContent:"center", flexShrink:0 }}>
                {isDone&&<span style={{color:"#141414",fontSize:11,fontWeight:800}}>✓</span>}
              </div>
              <span style={{ color:isDone?WHITE:GRAY, fontSize:13, flex:1 }}>{item.label}</span>
              {/* Mini 7-day dots per habit */}
              <div style={{ display:"flex", gap:2 }}>
                {week7.map(w=>(
                  <div key={w.ds} style={{ width:7, height:7, borderRadius:2,
                    background:w.done?(w.isToday?"#22C55E":"#22C55E66"):(w.isToday?GOLD+"44":"#1A1A1D"),
                    border:w.isToday?`1px solid ${w.done?"#22C55E":GOLD}`:"none" }} />
                ))}
              </div>
              {/* Streak badge */}
              {streak>0&&(
                <div style={{ display:"flex", alignItems:"center", gap:2, background:"#F59E0B0D", borderRadius:6, padding:"2px 6px", flexShrink:0 }}>
                  <span style={{fontSize:9}}>🔥</span>
                  <span style={{color:"#F59E0B",fontSize:10,fontWeight:700}}>{streak}</span>
                </div>
              )}
              {/* Weak alert: < 40% over last 30d */}
              {!isDone&&score<40&&score>0&&(
                <div style={{ background:"#EF444411", borderRadius:6, padding:"2px 6px", flexShrink:0 }}>
                  <span style={{color:"#EF4444",fontSize:9,fontWeight:600}}>{score}%</span>
                </div>
              )}
              <button onClick={e=>{e.stopPropagation();removeItem(item.id);}}
                style={{background:"none",border:"none",color:GRAY,cursor:"pointer",fontSize:14,opacity:0.4,padding:0}}>×</button>
            </div>
          );
        })}
        {/* Add habit */}
        <div style={{ display:"flex", gap:8, marginTop:10 }}>
          <input value={newItem} onChange={e=>setNewItem(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addItem()}
            placeholder="+ Nuevo hábito..."
            style={{ flex:1, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8,
              padding:"7px 12px", color:WHITE, fontSize:12, outline:"none" }} />
          <button onClick={addItem}
            style={{ padding:"7px 14px", background:GOLD, color:"#141414", border:"none", borderRadius:8,
              cursor:"pointer", fontWeight:700, fontSize:12 }}>+</button>
        </div>
      </div>

      {/* ── METAS DEL AÑO (fuente de las categorías del War Map) ── */}
      <div style={{ background:CARD, borderRadius:12, padding:18, border:`1px solid ${BORDER}`, marginBottom:16 }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
          <div>
            <div style={{ color:WHITE, fontWeight:700, fontSize:14 }}>Metas del año</div>
            <div style={{ color:GRAY, fontSize:11 }}>Cada meta crea un color en el War Map</div>
          </div>
          <button onClick={()=>setEditGoals(g=>!g)} style={{ background:"none", border:"none", color:GOLD_DIM, cursor:"pointer", fontSize:12 }}>
            {editGoals?"Listo":"Editar"}
          </button>
        </div>
        {goals.map((g,i)=>{
          const cat = catForGoal(g);
          return (
            <div key={i} style={{ display:"flex", alignItems:"center", gap:10, marginBottom:8, padding:"6px 10px", borderRadius:8,
              background: cat ? cat.color+"11" : "transparent", border:`1px solid ${cat ? cat.color+"33" : BORDER}` }}>
              <div style={{ width:14, height:14, borderRadius:3, background:cat?.color||GOLD, flexShrink:0,
                boxShadow: cat ? `0 0 6px ${cat.color}66` : "none" }} />
              {editGoals ? (
                <>
                  <input value={g} onChange={e=>editGoalLabel(i,e.target.value)}
                    style={{ flex:1, background:"transparent", border:"none", borderBottom:`1px solid ${BORDER}`, color:WHITE, fontSize:13, outline:"none", padding:"2px 0" }} />
                  <button onClick={()=>removeGoalAndCat(i)}
                    style={{ background:"none", border:"none", color:GRAY, cursor:"pointer", fontSize:14 }}>×</button>
                </>
              ) : (
                <span style={{ color:WHITE, fontSize:13 }}>{g}</span>
              )}
            </div>
          );
        })}
        <div style={{ display:"flex", gap:8, marginTop:10 }}>
          <input value={newGoal} onChange={e=>setNewGoal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addGoal()} placeholder="+ Nueva meta..."
            style={{ flex:1, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8, padding:"7px 12px", color:WHITE, fontSize:12, outline:"none" }} />
          <button onClick={addGoal}
            style={{ padding:"7px 14px", background:GOLD, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:12 }}>+</button>
        </div>
      </div>

      {/* ── WAR MAP ── */}
      <div style={{ background:CARD, borderRadius:12, padding:18, border:`1px solid ${BORDER}`, marginBottom:16 }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
          <div>
            <div style={{ color:WHITE, fontWeight:700, fontSize:14 }}>War Map {wmYear}</div>
            <div style={{ color:GRAY, fontSize:11 }}>
              {paintCatId
                ? <span style={{ color: warMapCategories.find(c=>c.id===paintCatId)?.color||GOLD }}>Modo pintura — arrastrá para marcar varios días</span>
                : "Seleccioná una meta para pintar · Click en un día para detalles"}
            </div>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:6 }}>
            <button onClick={()=>setWmYear(y=>y-1)} style={{ background:"transparent", border:`1px solid ${BORDER}`, color:WHITE, borderRadius:6, padding:"3px 10px", cursor:"pointer", fontSize:13 }}>←</button>
            <button onClick={()=>setWmYear(y=>y+1)} style={{ background:"transparent", border:`1px solid ${BORDER}`, color:WHITE, borderRadius:6, padding:"3px 10px", cursor:"pointer", fontSize:13 }}>→</button>
          </div>
        </div>

        {/* Selector de meta para pintar */}
        <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:14 }}>
          {warMapCategories.map(cat=>(
            <button key={cat.id} onClick={()=>setPaintCatId(paintCatId===cat.id?null:cat.id)}
              style={{ display:"flex", alignItems:"center", gap:5, padding:"5px 10px", borderRadius:8,
                border:`2px solid ${paintCatId===cat.id ? cat.color : BORDER}`,
                background: paintCatId===cat.id ? cat.color+"22" : "transparent",
                cursor:"pointer", color: paintCatId===cat.id ? cat.color : GRAY, fontSize:11, fontWeight: paintCatId===cat.id?700:400 }}>
              <span style={{ width:10, height:10, borderRadius:2, background:cat.color, display:"inline-block", flexShrink:0 }} />
              {cat.label||"Sin nombre"}
            </button>
          ))}
          {paintCatId && (
            <button onClick={()=>setPaintCatId(null)}
              style={{ padding:"5px 10px", background:"#EF444411", border:`1px solid #EF444433`, color:"#EF4444", borderRadius:8, cursor:"pointer", fontSize:11 }}>
              ✕ Salir
            </button>
          )}
        </div>

        {/* 12-month grid */}
        <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:8, userSelect:"none" }}>
          {Array.from({length:12},(_,mi)=>renderMonth(wmYear,mi))}
        </div>
        <div style={{ color:GRAY, fontSize:10, marginTop:8 }}>
          {paintCatId ? "Arrastrá el mouse para pintar días · Click derecho o click sin soltar = modal de detalle" : "● = tiene título · Click = ver/editar · Seleccioná una meta arriba para pintar en masa"}
        </div>
      </div>

      {/* MODAL día */}
      {selDay && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.7)", zIndex:1000, display:"flex", alignItems:"center", justifyContent:"center" }}
          onClick={e=>{ if(e.target===e.currentTarget) closeModal(); }}>
          <div style={{ background:"#1a1a1d", border:`1px solid ${BORDER}`, borderRadius:14, padding:24, width:360, boxShadow:"0 20px 60px rgba(0,0,0,0.8)" }}>
            <div style={{ marginBottom:18 }}>
              <div style={{ color:GOLD, fontWeight:800, fontSize:13, letterSpacing:1 }}>
                {(()=>{
                  const d = new Date(selDay+"T12:00:00");
                  const dias = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
                  return `${dias[d.getDay()]} ${d.getDate()} de ${MONTHS_FULL[d.getMonth()]} ${d.getFullYear()}`;
                })()}
              </div>
              {getEntry(selDay)?.title && <div style={{ color:GRAY, fontSize:11, marginTop:2 }}>Guardado: {getEntry(selDay).title}</div>}
            </div>
            <div style={{ marginBottom:12 }}>
              <div style={{ color:GRAY, fontSize:11, marginBottom:5 }}>Título del evento</div>
              <input value={modalTitle} onChange={e=>setModalTitle(e.target.value)}
                placeholder="Ej: Reunión con Felipe, Carrera 10K..."
                autoFocus onKeyDown={e=>e.key==="Enter"&&saveDay()}
                style={{ width:"100%", background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8, padding:"9px 12px", color:WHITE, fontSize:13, outline:"none", boxSizing:"border-box" }} />
            </div>
            <div style={{ marginBottom:12 }}>
              <div style={{ color:GRAY, fontSize:11, marginBottom:5 }}>Meta / Categoría</div>
              <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                {warMapCategories.map(cat=>(
                  <button key={cat.id} onClick={()=>setModalCatId(cat.id)}
                    style={{ display:"flex", alignItems:"center", gap:5, padding:"5px 10px", borderRadius:8,
                      border:`2px solid ${modalCatId===cat.id?cat.color:BORDER}`,
                      background: modalCatId===cat.id?cat.color+"22":"transparent",
                      cursor:"pointer", color:WHITE, fontSize:11 }}>
                    <span style={{ width:10, height:10, borderRadius:2, background:cat.color, display:"inline-block" }} />
                    {cat.label||cat.color}
                  </button>
                ))}
              </div>
            </div>
            <div style={{ marginBottom:16 }}>
              <div style={{ color:GRAY, fontSize:11, marginBottom:6 }}>Horario Google Calendar</div>
              <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                <label style={{ display:"flex", alignItems:"center", gap:6, color:GRAY, fontSize:11, cursor:"pointer" }}>
                  <input type="checkbox" checked={modalAllDay} onChange={e=>setModalAllDay(e.target.checked)} style={{ accentColor:GOLD }} />
                  Todo el día
                </label>
                {!modalAllDay && (
                  <input type="time" value={modalTime} onChange={e=>setModalTime(e.target.value)}
                    style={{ background:"#111113", border:`1px solid ${BORDER}`, borderRadius:6, padding:"4px 8px", color:WHITE, fontSize:12, outline:"none" }} />
                )}
              </div>
            </div>
            <div style={{ display:"flex", gap:8 }}>
              <button onClick={saveDay} style={{ flex:1, padding:"9px 14px", background:GOLD, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13 }}>Guardar</button>
              <button onClick={openGCal} style={{ flex:1, padding:"9px 14px", background:"#1a73e822", color:"#4285F4", border:`1px solid #4285F444`, borderRadius:8, cursor:"pointer", fontWeight:600, fontSize:12 }}>📅 Google Cal</button>
            </div>
            <div style={{ display:"flex", gap:8, marginTop:8 }}>
              {getEntry(selDay) && (
                <button onClick={deleteDay} style={{ flex:1, padding:"7px 14px", background:"#EF444411", color:"#EF4444", border:`1px solid #EF444433`, borderRadius:8, cursor:"pointer", fontSize:12 }}>Eliminar</button>
              )}
              <button onClick={closeModal} style={{ flex:1, padding:"7px 14px", background:"transparent", color:GRAY, border:`1px solid ${BORDER}`, borderRadius:8, cursor:"pointer", fontSize:12 }}>Cancelar</button>
            </div>
          </div>
        </div>
      )}

      {/* ── HEATMAP 30 DÍAS ── */}
      <div style={{ background:CARD, borderRadius:12, padding:18, border:`1px solid ${BORDER}` }}>
        <div style={{ color:WHITE, fontWeight:600, fontSize:13, marginBottom:12 }}>Consistencia — Últimos 30 días</div>
        <div style={{ display:"flex", gap:4, flexWrap:"wrap" }}>
          {days30.map(d=>(
            <div key={d.ds} title={`${d.ds}: ${Math.round(d.pct*100)}%`}
              style={{ width:18, height:18, borderRadius:3,
                background: d.pct===0 ? "#222225" : d.pct<0.5 ? "#D4AF3788" : d.pct<1 ? GOLD_DIM : "#22C55E" }} />
          ))}
        </div>
        <div style={{ display:"flex", gap:10, marginTop:8, fontSize:10, color:GRAY }}>
          <span style={{ display:"flex",gap:4,alignItems:"center" }}><span style={{width:10,height:10,background:"#222225",borderRadius:2,display:"inline-block"}} /> 0%</span>
          <span style={{ display:"flex",gap:4,alignItems:"center" }}><span style={{width:10,height:10,background:GOLD_DIM,borderRadius:2,display:"inline-block"}} /> parcial</span>
          <span style={{ display:"flex",gap:4,alignItems:"center" }}><span style={{width:10,height:10,background:"#22C55E",borderRadius:2,display:"inline-block"}} /> 100%</span>
        </div>

}

// ─── FINANZAS SECTION ─────────────────────────────────────────────────────────
function FinanzasSection({ personal, onUpdate }) {
  const { useState: us } = React;
  const finance         = personal.finance || {};
  const monthlyData     = finance.monthlyData     || {};
  const gastoCategories = finance.gastoCategories || { personales:["Hija","Casa","Juan","Tarjeta"], profesionales:["Softwares","Equipo","Impuestos","Anuncios"], otros:["Vuelos","Muebles"] };
  const assets      = finance.assets      || [];
  const liabilities = finance.liabilities || [];
  const debts       = finance.debts       || [];
  const visionUSD   = finance.visionUSD   !== undefined ? finance.visionUSD : 250000;
  const fxRate      = finance.fxRate      !== undefined ? finance.fxRate    : 4200;
  const salesConfig = finance.salesConfig || {
    monthlyTarget:    15000000,
    avgFee:           4500000,
    channelPct:       10,
    avgClientSales:   25000000,
    commissionFloor:  0,
    upsellPrice:      2000000,
    meetingsPerClose: 3,
    currentClients:   0,
    cacUSD:           100,
    adsPct:           50,
    usdRate:          4200,
  };
  const updateSC = (patch) => onUpdate({ finance:{ ...finance, salesConfig:{ ...salesConfig, ...patch } } });

  const [year,      setYear]      = us(new Date().getFullYear());
  const [expandedM, setExpandedM] = us(null);
  const [tab,       setTab]       = us("mensual");
  // Per-month form state (avoids cross-month interference)
  const [ingForms, setIngForms] = us({});
  const [egForms,  setEgForms]  = us({});
  const ingF = (m) => ingForms[m] || {client:"",concept:"",amount:"",currency:"USD"};
  const egF  = (m) => egForms[m]  || {cat:"",desc:"",amount:""};
  const setIngF = (m,k,v) => setIngForms(p=>{ const c=p[m]||{client:"",concept:"",amount:"",currency:"USD"}; return {...p,[m]:{...c,[k]:v}}; });
  const setEgF  = (m,k,v) => setEgForms(p=>{ const c=p[m]||{cat:"",desc:"",amount:""}; return {...p,[m]:{...c,[k]:v}}; });
  const [assetName, setAssetName] = us(""); const [assetVal,  setAssetVal]  = us("");
  const [liabName,  setLiabName]  = us(""); const [liabVal,   setLiabVal]   = us("");
  const [debtName,  setDebtName]  = us(""); const [debtBal,   setDebtBal]   = us("");
  const [debtRate,  setDebtRate]  = us(""); const [debtPmt,   setDebtPmt]   = us(""); const [debtTarget, setDebtTarget] = us("");
  const [abonoInputs, setAbonoInputs] = us({});
  const [abonoDate,   setAbonoDate]   = us({});
  const [expandedDebt, setExpandedDebt] = us(null);
  const [simExtras,   setSimExtras]   = us({});
  const [showCatEditor, setShowCatEditor] = us(false);
  const [newCatInputs, setNewCatInputs] = us({ personales:"", profesionales:"", otros:"" });

  const MONTHS = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const fmtCOP = (v) => v ? "$"+Number(Math.round(v)).toLocaleString("es-CO") : "—";
  const fmtUSD = (v) => v !== null && v !== undefined ? "$"+Number(Math.round(v)).toLocaleString("en-US") : "—";
  const fmt    = (v) => v ? "$"+(Math.round(Math.abs(v)/1000)+"K") : "—";

  const egCats = [
    ...(gastoCategories.personales||[]).map(c=>`Personales · ${c}`),
    ...(gastoCategories.profesionales||[]).map(c=>`Profesionales · ${c}`),
    ...(gastoCategories.otros||[]).map(c=>`Otros · ${c}`),
  ];
  const CAT_COLORS = { "Personales":"#F59E0B", "Profesionales":"#3B82F6", "Otros":"#8B5CF6" };

  const getMD  = (m) => monthlyData[`${year}-${String(m+1).padStart(2,"0")}`] || {};
  const setMD  = (m, updater) => {
    const key = `${year}-${String(m+1).padStart(2,"0")}`;
    const md  = monthlyData[key] || {};
    const upd = typeof updater==="function" ? updater(md) : {...md,...updater};
    onUpdate({ finance:{ ...finance, monthlyData:{ ...monthlyData, [key]:upd } } });
  };

  const trm = salesConfig.usdRate || 4200;
  const toCOP = (i) => {
    const amt = parseFloat(i.amount)||0;
    return i.currency==="USD" ? amt * trm : amt;
  };
  const getCashCollected = (m) => {
    const md = getMD(m);
    const ingresos = md.ingresos||[];
    if (ingresos.length>0) return ingresos.reduce((s,i)=>s+toCOP(i),0);
    return md.cashCollected||0;
  };
  const getTotalGastos = (m) => {
    const md = getMD(m);
    const ledger = (md.egresos||[]).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
    if (md.egresos !== undefined) return ledger;
    const allCats = [...(gastoCategories.personales||[]).map(c=>`personales_${c}`),...(gastoCategories.profesionales||[]).map(c=>`profesionales_${c}`),...(gastoCategories.otros||[]).map(c=>`otros_${c}`)];
    const gi = md.gastoItems || {};
    const cat = allCats.reduce((s,k)=>s+(gi[k]||0),0);
    return cat > 0 ? cat : (md.gastos||0);
  };

  const addIngreso = (m) => {
    const f = ingF(m);
    if (!f.amount) return;
    const ing = { id:"ing_"+Date.now(), client:f.client.trim(), concept:f.concept.trim(), amount:parseFloat(f.amount)||0, currency:f.currency||"USD" };
    setMD(m, md=>({...md, ingresos:[...(md.ingresos||[]),ing]}));
    setIngForms(p=>({...p,[m]:{client:"",concept:"",amount:"",currency:"USD"}}));
  };
  // Convierte gastoItems (formato legacy) a array egresos — pura, sin side effects
  const giToEgresos = (gi) => {
    const out = [];
    [["personales","Personales"],["profesionales","Profesionales"],["otros","Otros"]].forEach(([g,l]) => {
      (gastoCategories[g]||[]).forEach(c => {
        const v = gi[`${g}_${c}`];
        if (v > 0) out.push({ id:`eg_m_${uid()}`, category:`${l} · ${c}`, description:c, amount:v });
      });
    });
    return out;
  };

  // Devuelve egresos para display: usa md.egresos si existe, sino convierte gastoItems
  const getEgresosDisplay = (m) => {
    const md = getMD(m);
    if (md.egresos !== undefined) return md.egresos;
    const gi = md.gastoItems || {};
    return giToEgresos(gi).map(e => ({ ...e, id: `_leg_${e.id}` }));
  };

  const addEgreso = (m) => {
    const f = egF(m);
    if (!f.amount) return;
    const eg = { id:"eg_"+Date.now(), category:f.cat, description:f.desc.trim(), amount:parseFloat(f.amount)||0 };
    setMD(m, md => {
      if (md.egresos !== undefined) return { ...md, egresos:[...md.egresos, eg] };
      // Auto-migrar gastoItems y agregar nuevo gasto en un solo update
      const migrated = giToEgresos(md.gastoItems || {});
      const { gastoItems:_, ...rest } = md;
      return { ...rest, egresos:[...migrated, eg] };
    });
    setEgForms(p=>({...p,[m]:{cat:"",desc:"",amount:""}}));
  };

  const migrateGastoItems = (m) => {
    const md = getMD(m);
    if (md.egresos !== undefined || !md.gastoItems) return;
    const migrated = giToEgresos(md.gastoItems);
    const { gastoItems:_, ...rest } = md;
    setMD(m, () => ({ ...rest, egresos: migrated }));
  };

  const updateGastoCats = (newCats) => onUpdate({ finance:{ ...finance, gastoCategories: newCats } });

  const yearTotals = Array.from({length:12},(_,m)=>{
    const cc=getCashCollected(m), g=getTotalGastos(m), md=getMD(m);
    return { cc, g, cp:md.cashPropio||0, div:md.dividends||0 };
  });
  const totCC    = yearTotals.reduce((s,r)=>s+r.cc,0);
  const totG     = yearTotals.reduce((s,r)=>s+r.g,0);
  const totCP    = yearTotals.reduce((s,r)=>s+r.cp,0);
  const totDiv   = yearTotals.reduce((s,r)=>s+r.div,0);
  const totFlujo = totCC - totG;

  const totalAssets = assets.reduce((s,a)=>s+(parseFloat(a.value)||0),0);
  const totalDebts  = debts.reduce((s,d)=>s+(parseFloat(d.balance)||0),0);
  const totalLiabs  = liabilities.reduce((s,l)=>s+(parseFloat(l.value)||0),0)+totalDebts;
  const netWorth    = totalAssets - totalLiabs;
  const netWorthUSD = netWorth / fxRate;

  const activeMths = yearTotals.filter(r=>r.cc>0||r.g>0);
  const recent     = activeMths.slice(-3);
  const avgCC      = recent.length ? recent.reduce((s,r)=>s+r.cc,0)/recent.length : 0;
  const avgG       = recent.length ? recent.reduce((s,r)=>s+r.g,0)/recent.length  : 0;
  const avgNet     = avgCC - avgG;
  const avgNetUSD  = avgNet / fxRate;
  const gap        = visionUSD - netWorthUSD;
  const monthsToGoal  = avgNetUSD>0 ? Math.ceil(gap/avgNetUSD) : null;
  const pctProgress   = Math.min(100,Math.max(0,netWorthUSD/visionUSD*100));

  const calcDebt = (balance,ratePct,payment) => {
    if (!payment||payment<=0) return {months:null,totalPaid:null,totalInterest:null};
    const r=(ratePct||0)/100;
    if (r===0){ const m=Math.ceil(balance/payment); return {months:m,totalPaid:payment*m,totalInterest:0}; }
    if (payment<=balance*r) return {months:null,totalPaid:null,totalInterest:null};
    let bal=balance,months=0,totalPaid=0;
    while(bal>0&&months<600){ const interest=bal*r; const principal=Math.min(payment-interest,bal); totalPaid+=interest+principal; bal-=principal; months++; }
    return {months,totalPaid,totalInterest:totalPaid-balance};
  };

  return (
    <div>
      <div style={{ display:"flex", borderBottom:`1px solid ${BORDER}`, marginBottom:20 }}>
        {[["mensual","Mensual"],["patrimonio","Patrimonio & Deudas"],["vision","Visión $250K"]].map(([id,label])=>(
          <button key={id} className={`gp-nav-tab${tab===id?" active":""}`} onClick={()=>setTab(id)}>{label}</button>
        ))}
      </div>

      {/* ══ MENSUAL ══ */}
      {tab==="mensual" && (
        <div>
          <div style={{ display:"flex",alignItems:"center",gap:10,marginBottom:16 }}>
            <button onClick={()=>setYear(y=>y-1)} style={{ background:CARD,border:`1px solid ${BORDER}`,color:WHITE,borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:13 }}>←</button>
            <span style={{ color:WHITE,fontWeight:700,fontSize:16 }}>{year}</span>
            <button onClick={()=>setYear(y=>y+1)} style={{ background:CARD,border:`1px solid ${BORDER}`,color:WHITE,borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:13 }}>→</button>
          </div>

          {/* Config ventas — Card estilo Cuerpo */}
          {(()=>{
            const fee      = salesConfig.avgFee || 0;
            const cFloor   = salesConfig.commissionFloor || 0;
            const canal    = Math.max(0, (salesConfig.avgClientSales||0) - cFloor) * (salesConfig.channelPct||10) / 100;
            const revPC    = fee + canal;
            const target   = salesConfig.monthlyTarget || 0;
            const cltsN    = revPC > 0 ? Math.ceil(target/revPC) : null;
            const meetN    = cltsN ? cltsN * (salesConfig.meetingsPerClose||3) : null;
            const convRate = Math.round(100/(salesConfig.meetingsPerClose||3));
            // Stats por mes (clientes únicos + revenue real)
            const MONTHS_SHORT = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
            const monthStats = Array.from({length:12},(_,m)=>{
              const md = getMD(m);
              const ingresos = md.ingresos||[];
              const uniqueClients = [...new Set(ingresos.map(i=>i.client||"").filter(Boolean))].length;
              const rev = getCashCollected(m);
              const gap = cltsN ? Math.max(0, cltsN - uniqueClients) : null;
              const hasData = rev>0||uniqueClients>0;
              return { m, label:MONTHS_SHORT[m], clients:uniqueClients, rev, gap, hasData };
            });
            const todayM = new Date().getMonth();
            const curStats = monthStats[todayM];
            return (
              <div style={{ background:"#0a0a0b", border:`1px solid ${GOLD}33`, borderRadius:12, padding:18, marginBottom:16, borderLeft:`4px solid ${GOLD}` }}>
                {/* Header */}
                <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", marginBottom:14, gap:12 }}>
                  <div>
                    <div style={{ color:GOLD_DIM, fontSize:9, fontWeight:700, letterSpacing:2.5, textTransform:"uppercase", marginBottom:4 }}>Escalera de valor</div>
                    <div style={{ color:WHITE, fontWeight:900, fontSize:17, lineHeight:1, letterSpacing:-0.3 }}>Pipeline de Ventas</div>
                  </div>
                  <div style={{ textAlign:"right", flexShrink:0 }}>
                    <div style={{ color:GRAY, fontSize:9, marginBottom:2 }}>Meta mensual</div>
                    <div style={{ color:GOLD, fontWeight:900, fontSize:22, lineHeight:1 }}>{fmtCOP(target)}</div>
                  </div>
                </div>

                {/* Metric chips */}
                <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:8, marginBottom:12 }}>
                  {[
                    { label:"Fee base",         val:fmtCOP(fee),                          color:GOLD,      sub:"por cliente/mes" },
                    { label:"+ Comisión canal",  val:fmtCOP(canal),                        color:"#22C55E", sub: cFloor>0 ? `${salesConfig.channelPct||10}% sobre >${fmtCOP(cFloor)}` : `${salesConfig.channelPct||10}% de ventas` },
                    { label:"= Total/cliente",   val:fmtCOP(revPC),                        color:"#60A5FA", sub:"ingreso mensual" },
                    { label:"Upsell / Adicional",val:fmtCOP(salesConfig.upsellPrice||0),   color:"#8B5CF6", sub:"servicio extra por cliente" },
                  ].map(chip=>(
                    <div key={chip.label} style={{ background:"#111113", borderRadius:8, padding:"10px 10px", border:`1px solid ${chip.color}18` }}>
                      <div style={{ color:GRAY, fontSize:9, marginBottom:5 }}>{chip.label}</div>
                      <div style={{ color:chip.color, fontWeight:900, fontSize:14, lineHeight:1, marginBottom:3 }}>{chip.val}</div>
                      <div style={{ color:GRAY, fontSize:9 }}>{chip.sub}</div>
                    </div>
                  ))}
                </div>

                {/* Pipeline summary */}
                {meetN && (
                  <div style={{ display:"flex", gap:20, marginBottom:12, background:"#111113", borderRadius:8, padding:"10px 14px", alignItems:"center", flexWrap:"wrap", border:`1px solid #F59E0B22` }}>
                    <div style={{ display:"flex", flexDirection:"column", alignItems:"center" }}>
                      <div style={{ color:"#F59E0B", fontWeight:900, fontSize:26, lineHeight:1 }}>{meetN}</div>
                      <div style={{ color:GRAY, fontSize:9, marginTop:2 }}>reuniones / mes</div>
                    </div>
                    <div style={{ color:BORDER, fontSize:18 }}>→</div>
                    <div style={{ display:"flex", flexDirection:"column", alignItems:"center" }}>
                      <div style={{ color:WHITE, fontWeight:900, fontSize:26, lineHeight:1 }}>{cltsN}</div>
                      <div style={{ color:GRAY, fontSize:9, marginTop:2 }}>clientes a cerrar</div>
                    </div>
                    <div style={{ color:BORDER, fontSize:18 }}>·</div>
                    <div style={{ display:"flex", flexDirection:"column", alignItems:"center" }}>
                      <div style={{ color:"#22C55E", fontWeight:900, fontSize:20, lineHeight:1 }}>{convRate}%</div>
                      <div style={{ color:GRAY, fontSize:9, marginTop:2 }}>tasa de cierre</div>
                    </div>
                    <div style={{ flex:1, minWidth:120, textAlign:"right" }}>
                      <div style={{ color:GRAY, fontSize:10 }}>Para llegar a la meta <span style={{ color:GOLD, fontWeight:700 }}>sin upsell</span></div>
                    </div>
                  </div>
                )}

                {/* ── Estado mes actual + CAC ── */}
                {(()=>{
                  const cacUSD= salesConfig.cacUSD  || 100;
                  const adsPct= salesConfig.adsPct  || 50;
                  const usdR  = salesConfig.usdRate || 4200;

                  const gapMt = gap ? gap * (salesConfig.meetingsPerClose||3) : 0;
                  const prog  = cltsN ? Math.min(100, Math.round(cc/cltsN*100)) : 0;
                  const byAds = gap ? Math.round(gap * adsPct/100) : 0;
                  const byOrg = gap ? gap - byAds : 0;
                  const adsBudget    = byAds * cacUSD;
                  const adsBudgetCOP = adsBudget * usdR;
                  const paybackDays  = revPC>0 ? Math.round(cacCOP/(revPC/30)) : null;
                  const roi12        = revPC>0 ? (revPC*12/cacCOP).toFixed(1) : null;
                  return (
                  <div style={{ marginBottom:12 }}>
                    {/* Barra progreso mes actual */}
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:5 }}>
                      <div style={{ fontSize:10, color:GRAY }}>

                        <span> / </span>
                        <span style={{ color:GOLD, fontWeight:700 }}>{cltsN||"?"}</span>
                        <span> clientes · {MONTHS_SHORT[todayM]}</span>
                      </div>
                      <div style={{ fontSize:10, color:GRAY }}>
                        Revenue: <span style={{ color:"#22C55E", fontWeight:700 }}>{fmtCOP(curRev)}</span>
                        {gap>0&&<span style={{ color:"#EF4444" }}> · faltan {gap}</span>}
                        {gap===0&&cc>0&&<span style={{ color:"#22C55E" }}> · ¡Meta!</span>}
                      </div>
                    </div>
                    <div style={{ background:"#111113", borderRadius:20, height:5, marginBottom:10 }}>

                    {gap>0 && (

                          <div style={{ color:GRAY, fontSize:9, marginBottom:3 }}>Reuniones pendientes</div>

                          <div style={{ color:GRAY, fontSize:9 }}>para cerrar</div>
                        </div>
                      </div>
                      {paybackDays && (

                      ["CAC (USD / cliente)",              "cacUSD",           salesConfig.cacUSD||100,       1],
                      ["% clientes por ads",               "adsPct",           salesConfig.adsPct||50,        1],

                          onChange={e=>updateSC({[key]:parseFloat(e.target.value)||0})}
                          style={{ width:"100%", background:"#0e0e10", border:`1px solid ${key==="currentClients"?`#22C55E44`:key==="avgClientSales"&&!val?`${GOLD}55`:BORDER}`, borderRadius:6, padding:"5px 8px", color:key==="currentClients"?"#22C55E":GOLD, fontSize:12, outline:"none", fontWeight:700, boxSizing:"border-box" }} />
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            );
          })()}

          {/* Resumen año */}
          <div style={{ display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:20 }}>

                <div style={{ color:color+"88", fontSize:9, fontWeight:700, letterSpacing:2, textTransform:"uppercase", marginBottom:6 }}>{overline}</div>
