            <button onClick={()=>onChange({...client,customMvpSteps:null,mvpChecks:{}})}
              style={{ padding:"5px 12px", background:"transparent", color:GRAY, border:`1px solid ${BORDER}`, borderRadius:6, cursor:"pointer", fontSize:11 }}>↺ Restaurar defaults</button>
          </div>
        </div>
      )}

      <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
        {mvpSteps.map(step => {
          const isDone = !!checks[step.n];
          return (
            <div key={step.n} onClick={()=>toggleMvp(step.n)}
              style={{ display:"flex", alignItems:"flex-start", gap:12, padding:"12px 14px", borderRadius:10, cursor:"pointer",
                background: isDone ? "rgba(212,175,55,0.06)" : CARD,
                border:`1px solid ${isDone ? GOLD_DIM : BORDER}`,
                opacity: isDone ? 0.7 : 1, transition:"all 0.15s" }}>
              <div style={{ width:24, height:24, borderRadius:6, border:`2px solid ${isDone ? GOLD : BORDER}`,

                flexShrink:0, marginTop:1, transition:"all 0.15s" }}>
                {isDone && <span style={{ color:"#141414", fontSize:13, fontWeight:800 }}>✓</span>}
              </div>
              <div>
                <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                  <span style={{ fontSize:10, fontFamily:"monospace", color:GRAY }}>#{step.n}</span>
                  <span style={{ fontSize:13, fontWeight:600, color: isDone ? GRAY : WHITE, textDecoration: isDone ? "line-through" : "none" }}>{step.title}</span>
                </div>
                <div style={{ fontSize:11, color:GRAY, marginTop:2 }}>{step.desc}</div>
              </div>
            </div>

      </div>

      {/* Full launch checklist */}
      <div style={{ marginTop:28 }}>
        <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:14 }}>
          <span style={{ color:"#22C55E", fontWeight:700, fontSize:14 }}>🚀 Pasos Full Launch — Semana 3</span>

          <div style={{ flex:1, height:4, background:"#222", borderRadius:2, overflow:"hidden" }}>
            <div style={{ height:"100%", width:fpct+"%", background:"#22C55E", borderRadius:2, transition:"width 0.3s" }} />
          </div>
          <span style={{ fontSize:11, color:"#22C55E" }}>{fpct}%</span>
          <button onClick={()=>setShowFullEditor(s=>!s)} style={{ padding:"2px 10px", borderRadius:5, fontSize:10, cursor:"pointer", border:`1px solid ${showFullEditor ? GREEN : BORDER}`, background:showFullEditor?"rgba(76,175,125,0.1)":"transparent", color:showFullEditor?GREEN:GRAY }}>
            {showFullEditor ? "✕ Cerrar" : "✎ Editar"}
          </button>
        </div>

        {/* Full Editor panel */}
        {showFullEditor && (
          <div style={{ background:"#1A1A1D", border:`1px solid ${BORDER}`, borderRadius:8, padding:14, marginBottom:14 }}>
            {fullSteps.map((step, idx) => (
              <div key={step.n || idx} style={{ display:"flex", gap:8, alignItems:"flex-start", marginBottom:8 }}>
                <span style={{ color:GRAY, fontSize:11, minWidth:22, paddingTop:6 }}>#{step.n||idx+1}</span>
                <div style={{ flex:1, display:"flex", flexDirection:"column", gap:4 }}>
                  <input value={step.title} onChange={e => {
                    const updated = fullSteps.map((s,i)=>i===idx?{...s,title:e.target.value}:s);
                    onChange({...client, customFullSteps:updated});
                  }} style={{ background:"#111113", border:`1px solid ${BORDER}`, borderRadius:5, padding:"4px 8px", color:WHITE, fontSize:12, outline:"none" }} />
                  <input value={step.desc} onChange={e => {
                    const updated = fullSteps.map((s,i)=>i===idx?{...s,desc:e.target.value}:s);
                    onChange({...client, customFullSteps:updated});
                  }} style={{ background:"#111113", border:`1px solid ${BORDER}`, borderRadius:5, padding:"4px 8px", color:GRAY, fontSize:11, outline:"none" }} placeholder="Descripción..." />
                </div>
                <button onClick={()=>{ const updated=fullSteps.filter((_,i)=>i!==idx); onChange({...client,customFullSteps:updated}); }}
                  style={{ padding:"4px 8px", borderRadius:5, border:`1px solid ${RED}`, color:RED, background:"transparent", fontSize:11, cursor:"pointer", flexShrink:0, marginTop:2 }}>✕</button>
              </div>
            ))}
            <div style={{ display:"flex", gap:8, marginTop:8 }}>
              <button onClick={()=>{ const n=(fullSteps[fullSteps.length-1]?.n||0)+1; onChange({...client,customFullSteps:[...fullSteps,{n,title:"Nuevo paso",desc:""}]}); }}
                style={{ padding:"5px 12px", background:"#222225", color:WHITE, border:`1px solid ${BORDER}`, borderRadius:6, cursor:"pointer", fontSize:11 }}>+ Añadir paso</button>
              <button onClick={()=>onChange({...client,customFullSteps:null,fullChecks:{}})}
                style={{ padding:"5px 12px", background:"transparent", color:GRAY, border:`1px solid ${BORDER}`, borderRadius:6, cursor:"pointer", fontSize:11 }}>↺ Restaurar defaults</button>
            </div>
          </div>
        )}

        <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
          {fullSteps.map(step => {
            const isDone = !!fchecks[step.n];
            return (
              <div key={step.n} onClick={()=>toggleFull(step.n)}
                style={{ display:"flex", alignItems:"flex-start", gap:12, padding:"12px 14px", borderRadius:10, cursor:"pointer",
                  background: isDone ? "rgba(34,197,94,0.05)" : CARD,
                  border:`1px solid ${isDone ? "#22C55E55" : BORDER}`,
                  opacity: isDone ? 0.7 : 1, transition:"all 0.15s" }}>
                <div style={{ width:24, height:24, borderRadius:6, border:`2px solid ${isDone ? "#22C55E" : BORDER}`,

                  flexShrink:0, marginTop:1, transition:"all 0.15s" }}>
                  {isDone && <span style={{ color:"#141414", fontSize:13, fontWeight:800 }}>✓</span>}
                </div>
                <div>
                  <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                    <span style={{ fontSize:10, fontFamily:"monospace", color:GRAY }}>#{step.n}</span>

                  </div>
                  <div style={{ fontSize:11, color:GRAY, marginTop:2 }}>{step.desc}</div>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

        {[["perfil","Perfil"],["lanzamiento","🎯 Lanzamiento"],["ejecucion","Ejecución"],["proceso","Proceso Comercial"]].map(([id,label]) => (
          <button key={id} onClick={()=>setSubTab(id)}
            style={{ padding:"8px 16px", background:"none", border:"none", borderBottom:`2px solid ${subTab===id ? GOLD : "transparent"}`, color: subTab===id ? GOLD : GRAY, cursor:"pointer", fontSize:13, fontWeight: subTab===id ? 600 : 400, transition:"all 0.15s" }}>
            {label}
          </button>
        ))}
      </div>

      {subTab === "perfil" && <PerfilTab client={client} onChange={onChange} />}
      {subTab === "lanzamiento" && <LaunchTab client={client} onChange={onChange} globalMvpSteps={globalMvpSteps} globalFullSteps={globalFullSteps} />}
      {subTab === "ejecucion" && <EjecucionTab client={client} team={team} onChange={onChange} />}
      {subTab === "proceso" && <ProcesoComercialTab client={client} onChange={onChange} apiKey={apiKey} flowTemplates={flowTemplates} onSaveTemplate={onSaveTemplate} onDeleteTemplate={onDeleteTemplate} />}
    </div>
  );
}

// ─── CLIENTS LIST ─────────────────────────────────────────────────────────────
function ClientsList({ clients, onSelect, onCreate }) {
  const [search, setSearch] = useState("");
  const [showModal, setShowModal] = useState(false);
  const [newName, setNewName] = useState("");
  const [newChannel, setNewChannel] = useState("Meta Ads");
  const [view, setView] = useState("cards");

  const filtered = clients.filter(c => c.name.toLowerCase().includes(search.toLowerCase()));

  const handleCreate = () => {
    if (!newName.trim()) return;
    onCreate(newName.trim(), newChannel);
    setNewName(""); setNewChannel("Meta Ads"); setShowModal(false);
  };

  const getStage = (pct) => {
    if (pct === 0)   return { label:"Por iniciar", color:"#60A5FA" };
    if (pct < 50)    return { label:"En proceso",  color:GOLD };
    if (pct < 100)   return { label:"En cierre",   color:"#A78BFA" };
    return               { label:"Completado",  color:GREEN };
  };

  const nextMeeting = (c) => {
    const now = new Date();
    const m = (c.meetings||[]).filter(m=>new Date(m.date)>=now).sort((a,b)=>a.date.localeCompare(b.date))[0];
    return m ? new Date(m.date).toLocaleDateString("es-CO",{day:"2-digit",month:"short"}) : "—";
  };

  const KANBAN_STAGES = ["Por iniciar","En proceso","En cierre","Completado"];

  return (
    <div>
      <div style={{ display:"flex", gap:10, marginBottom:20, alignItems:"center" }}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar cliente..."
          style={{ flex:1, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8, padding:"9px 12px", color:WHITE, fontSize:13, outline:"none" }} />
        {/* View toggle */}
        <div style={{ display:"flex", gap:2, background:"#111113", borderRadius:8, padding:3, border:`1px solid ${BORDER}` }}>
          {[["cards","▦ Cards"],["tabla","≡ Tabla"],["kanban","⬜ Kanban"]].map(([v,l])=>(
            <button key={v} onClick={()=>setView(v)}
              style={{ padding:"5px 12px", borderRadius:6, fontSize:12, cursor:"pointer", fontWeight:600,
                background:view===v?GOLD:"transparent", color:view===v?"#141414":GRAY, border:"none" }}>
              {l}
            </button>
          ))}
        </div>
        <button onClick={()=>setShowModal(true)}
          style={{ padding:"9px 18px", background:GOLD, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13 }}>
          + Nuevo cliente
        </button>
      </div>

      {filtered.length === 0 && (
        <div style={{ textAlign:"center", padding:"60px 0", color:GRAY }}>
          {clients.length === 0 ? "No hay clientes. Crea el primero." : "Sin resultados."}
        </div>
      )}

      {/* ── CARDS VIEW ── */}
      {view === "cards" && (
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))", gap:14 }}>
          {filtered.map(c => {
            const pct = overallPct(c.tasks);
            const isDone = pct === 100;
            const stage = getStage(pct);
            return (
              <div key={c.id} onClick={()=>onSelect(c.id)}
                style={{ background:CARD, border:`1px solid ${isDone?GREEN:BORDER}`, borderRadius:12, padding:16, cursor:"pointer", transition:"all 0.15s" }}
                onMouseEnter={e=>e.currentTarget.style.borderColor=GOLD}
                onMouseLeave={e=>e.currentTarget.style.borderColor=isDone?GREEN:BORDER}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:10 }}>
                  <div>
                    <div style={{ color:WHITE, fontWeight:600, fontSize:15 }}>{c.name}</div>
                    <div style={{ color:GRAY, fontSize:11, marginTop:2 }}>{c.profile.channel||"Meta Ads"}</div>
                  </div>
                  <span style={{ fontSize:11, fontWeight:700, color:stage.color, background:stage.color+"18", padding:"2px 8px", borderRadius:10 }}>{stage.label}</span>
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:6 }}>
                  {WEEKS.map(w => {
                    const s = weekStats(c.tasks, w);
                    const wp = s.total ? Math.round(s.done/s.total*100) : 0;
                    return (
                      <div key={w}>
                        <div style={{ fontSize:9, color:GRAY, marginBottom:3 }}>{w.replace("Semana ","S")}</div>
                        <ProgressBar pct={wp} height={3} />
                        <div style={{ fontSize:9, color:GRAY, marginTop:2 }}>{s.done}/{s.total}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* ── TABLA VIEW ── */}
      {view === "tabla" && filtered.length > 0 && (
        <div style={{ background:CARD, border:`1px solid ${BORDER}`, borderRadius:12, overflow:"hidden" }}>
          <table style={{ width:"100%", borderCollapse:"collapse" }}>
            <thead>
              <tr style={{ borderBottom:`1px solid ${BORDER}` }}>
                {["Cliente","Canal","Contrato","Inicio","Progreso","Etapa","Próx. reunión"].map(h=>(
                  <th key={h} style={{ padding:"10px 14px", textAlign:"left", fontSize:11, color:GRAY, fontWeight:600, whiteSpace:"nowrap" }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.map((c,i) => {
                const pct = overallPct(c.tasks);
                const stage = getStage(pct);
                return (
                  <tr key={c.id} onClick={()=>onSelect(c.id)}
                    style={{ borderBottom:`1px solid ${BORDER}`, cursor:"pointer", transition:"background 0.1s" }}
                    onMouseEnter={e=>e.currentTarget.style.background="#1E1E22"}
                    onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                    <td style={{ padding:"10px 14px", color:WHITE, fontWeight:600, fontSize:13 }}>{c.name}</td>
                    <td style={{ padding:"10px 14px", color:GRAY, fontSize:12 }}>{c.profile.channel||"Meta Ads"}</td>
                    <td style={{ padding:"10px 14px", color:GRAY, fontSize:12 }}>{c.profile.contractValue ? `$${Number(c.profile.contractValue).toLocaleString("es-CO")}` : "—"}</td>
                    <td style={{ padding:"10px 14px", color:GRAY, fontSize:12 }}>{c.profile.startDate ? new Date(c.profile.startDate).toLocaleDateString("es-CO",{day:"2-digit",month:"short"}) : "—"}</td>
                    <td style={{ padding:"10px 14px" }}>
                      <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                        <div style={{ flex:1, height:6, background:BORDER, borderRadius:3 }}>
                          <div style={{ height:6, width:`${pct}%`, background:stage.color, borderRadius:3 }} />
                        </div>
                        <span style={{ fontSize:11, color:stage.color, fontWeight:700, minWidth:32 }}>{pct}%</span>
                      </div>
                    </td>
                    <td style={{ padding:"10px 14px" }}>
                      <span style={{ fontSize:11, color:stage.color, background:stage.color+"18", padding:"2px 8px", borderRadius:10, fontWeight:600 }}>{stage.label}</span>
                    </td>
                    <td style={{ padding:"10px 14px", color:GRAY, fontSize:12 }}>{nextMeeting(c)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {/* ── KANBAN VIEW ── */}
      {view === "kanban" && (
        <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:14, alignItems:"start" }}>
          {KANBAN_STAGES.map(stage => {
            const stagePcts = { "Por iniciar":[0,0], "En proceso":[1,49], "En cierre":[50,99], "Completado":[100,100] };
            const [min,max] = stagePcts[stage];
            const stageClients = filtered.filter(c=>{ const p=overallPct(c.tasks); return p>=min&&p<=max; });
            const stageColor = getStage(min===0&&max===0?0:min===1?1:min===50?50:100).color;
            return (
              <div key={stage}>
                <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:10 }}>
                  <span style={{ width:8, height:8, borderRadius:"50%", background:stageColor, display:"inline-block" }} />
                  <span style={{ color:WHITE, fontWeight:600, fontSize:13 }}>{stage}</span>
                  <span style={{ color:GRAY, fontSize:11, marginLeft:"auto" }}>{stageClients.length}</span>
                </div>
                <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                  {stageClients.map(c => {
                    const pct = overallPct(c.tasks);
                    return (
                      <div key={c.id} onClick={()=>onSelect(c.id)}
                        style={{ background:CARD, border:`1px solid ${BORDER}`, borderRadius:10, padding:"12px 14px", cursor:"pointer", transition:"border-color 0.15s" }}
                        onMouseEnter={e=>e.currentTarget.style.borderColor=stageColor}
                        onMouseLeave={e=>e.currentTarget.style.borderColor=BORDER}>
                        <div style={{ color:WHITE, fontWeight:600, fontSize:13, marginBottom:4 }}>{c.name}</div>
                        <div style={{ color:GRAY, fontSize:11, marginBottom:8 }}>{c.profile.channel||"Meta Ads"}</div>
                        <div style={{ height:4, background:BORDER, borderRadius:2 }}>
                          <div style={{ height:4, width:`${pct}%`, background:stageColor, borderRadius:2 }} />
                        </div>
                        <div style={{ display:"flex", justifyContent:"space-between", marginTop:4 }}>
                          <span style={{ fontSize:10, color:GRAY }}>{nextMeeting(c)}</span>
                          <span style={{ fontSize:10, color:stageColor, fontWeight:700 }}>{pct}%</span>
                        </div>
                      </div>
                    );
                  })}
                  {stageClients.length === 0 && (
                    <div style={{ border:`1px dashed ${BORDER}`, borderRadius:10, padding:"20px 0", textAlign:"center", color:GRAY, fontSize:11 }}>Sin clientes</div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {showModal && (
        <Modal title="Nuevo cliente" onClose={()=>setShowModal(false)}>
          <Input label="Nombre del cliente / empresa" value={newName} onChange={setNewName} placeholder="Empresa S.A.S." />
          <div style={{ marginBottom:16 }}>
            <label style={{ display:"block", color:GRAY, fontSize:12, marginBottom:4 }}>Canal de adquisición</label>
            <select value={newChannel} onChange={e=>setNewChannel(e.target.value)}
              style={{ width:"100%", background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8, padding:"8px 10px", color:WHITE, fontSize:13, outline:"none" }}>
              {CHANNELS.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <button onClick={handleCreate} style={{ width:"100%", padding:"10px", background:GOLD, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:14 }}>
            Crear cliente
          </button>
        </Modal>
      )}
    </div>
  );
}

// ─── TEAM TAB ─────────────────────────────────────────────────────────────────
function TeamTab({ data, onChange }) {
  const [newMember, setNewMember] = useState("");
  const [newRole, setNewRole] = useState("");
  const [showDiagram, setShowDiagram] = useState(false);

  const addMember = () => {
    if (!newMember.trim()) return;
    onChange({ ...data, team: [...data.team, { id:uid(), name:newMember.trim() }] });
    setNewMember("");
  };
  const removeMember = (id) => onChange({ ...data, team: data.team.filter(m=>m.id!==id) });

  const addRole = () => {
    if (!newRole.trim()) return;
    onChange({ ...data, roles: [...data.roles, { id:uid(), name:newRole.trim() }] });
    setNewRole("");
  };
  const removeRole = (id) => onChange({ ...data, roles: data.roles.filter(r=>r.id!==id) });

  const teamFlow = data.teamFlow || { id: "team_flow", name: "Organigrama del equipo", nodes: [], edges: [] };
  const updateTeamFlow = (updated) => onChange({ ...data, teamFlow: updated });
  const apiKey = data.settings?.apiKey || "";

  return (
    <div style={{ maxWidth:900 }}>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:24, maxWidth:700, marginBottom:28 }}>
        <div>
          <h3 style={{ color:WHITE, fontSize:15, fontWeight:600, marginBottom:14 }}>Equipo</h3>
          <div style={{ display:"flex", gap:8, marginBottom:12 }}>
            <input value={newMember} onChange={e=>setNewMember(e.target.value)} placeholder="Nombre"
              onKeyDown={e=>e.key==="Enter"&&addMember()}
              style={{ flex:1, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8, padding:"7px 10px", color:WHITE, fontSize:13, outline:"none" }} />
            <button onClick={addMember} style={{ padding:"7px 14px", background:GOLD, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700 }}>+</button>
          </div>
          {data.team.map(m => (
            <div key={m.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"7px 10px", background:CARD, border:`1px solid ${BORDER}`, borderRadius:8, marginBottom:6 }}>
              <span style={{ color:WHITE, fontSize:13 }}>{m.name}</span>
              <button onClick={()=>removeMember(m.id)} style={{ background:"none", border:"none", color:RED, cursor:"pointer", fontSize:13 }}>×</button>
            </div>
          ))}
        </div>
        <div>
          <h3 style={{ color:WHITE, fontSize:15, fontWeight:600, marginBottom:14 }}>Roles</h3>
          <div style={{ display:"flex", gap:8, marginBottom:12 }}>
            <input value={newRole} onChange={e=>setNewRole(e.target.value)} placeholder="Rol"
              onKeyDown={e=>e.key==="Enter"&&addRole()}
              style={{ flex:1, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8, padding:"7px 10px", color:WHITE, fontSize:13, outline:"none" }} />
            <button onClick={addRole} style={{ padding:"7px 14px", background:GOLD, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700 }}>+</button>
          </div>
          {data.roles.map(r => (
            <div key={r.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"7px 10px", background:CARD, border:`1px solid ${BORDER}`, borderRadius:8, marginBottom:6 }}>
              <span style={{ color:WHITE, fontSize:13 }}>{r.name}</span>
              <button onClick={()=>removeRole(r.id)} style={{ background:"none", border:"none", color:RED, cursor:"pointer", fontSize:13 }}>×</button>
            </div>
          ))}
        </div>
      </div>

      {/* Internal diagram */}
      <div style={{ borderTop:`1px solid ${BORDER}`, paddingTop:20 }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:14 }}>
          <div>
            <h3 style={{ color:WHITE, fontSize:15, fontWeight:600, margin:0 }}>Diagrama interno</h3>
            <div style={{ color:GRAY, fontSize:12, marginTop:3 }}>Organigrama, flujos de operación, estructura del equipo</div>
          </div>
          <button onClick={()=>setShowDiagram(s=>!s)}
            style={{ padding:"7px 16px", borderRadius:8, fontSize:12, cursor:"pointer", border:`1px solid ${showDiagram ? GOLD : BORDER}`, background:showDiagram?"rgba(212,175,55,0.1)":"transparent", color:showDiagram?GOLD:GRAY, fontWeight:600 }}>
            {showDiagram ? "✕ Cerrar" : "🗂 Abrir diagrama"}
          </button>
        </div>
        {showDiagram && (
          <div style={{ border:`1px solid ${BORDER}`, borderRadius:10, overflow:"hidden", height:520 }}>
            <FlowCanvas
              flow={teamFlow}
              clientName="Equipo GP"
              clientProfile={{}}
              clientTasks={[]}
              onUpdate={updateTeamFlow}
              apiKey={apiKey}
            />
          </div>
        )}
      </div>
    </div>
  );
}

// ─── SETTINGS TAB ─────────────────────────────────────────────────────────────
function SettingsTab({ data, onChange }) {
  const [key, setKey] = useState(data.settings?.apiKey || "");
  const [saved, setSaved] = useState(false);
  const [importMsg, setImportMsg] = useState("");
  const [pinInput, setPinInput] = useState("");
  const [pinCurrent, setPinCurrent] = useState("");
  const [pinSaved, setPinSaved] = useState(false);
  const [pinError, setPinError] = useState(false);
  const hasPin = !!data.settings?.teamPin;

  const savePin = () => {
    if (hasPin && pinCurrent !== data.settings.teamPin) {
      setPinError(true);
      setTimeout(()=>setPinError(false), 2000);
      return;
    }
    onChange({ ...data, settings: { ...(data.settings||{}), teamPin: pinInput.trim() } });
    setPinInput(""); setPinCurrent("");
    setPinSaved(true);
    setTimeout(()=>setPinSaved(false), 2000);
  };

  const removePin = () => {
    if (pinCurrent !== data.settings.teamPin) {
      setPinError(true);
      setTimeout(()=>setPinError(false), 2000);
      return;
    }
    onChange({ ...data, settings: { ...(data.settings||{}), teamPin: "" } });
    setPinInput(""); setPinCurrent("");
  };

  const saveKey = () => {
    onChange({ ...data, settings: { ...(data.settings||{}), apiKey: key.trim() } });
    setSaved(true);
    setTimeout(()=>setSaved(false), 2000);
  };

  const handleExport = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `gp_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (!parsed.clients) throw new Error("Archivo inválido");
        onChange(parsed);
        setImportMsg("✓ Datos importados correctamente.");
        setTimeout(()=>setImportMsg(""), 4000);
      } catch {
        setImportMsg("Error: archivo no válido.");
        setTimeout(()=>setImportMsg(""), 4000);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  return (
    <div style={{ maxWidth:600 }}>
      <div style={{ marginTop:0, padding:16, background:"rgba(212,175,55,0.06)", border:`1px solid ${GOLD_DIM}`, borderRadius:10 }}>
        <div style={{ color:GOLD, fontWeight:600, fontSize:13, marginBottom:6 }}>✦ Conexión con Claude IA</div>
        <div style={{ color:GRAY, fontSize:12, lineHeight:1.6, marginBottom:12 }}>
          Pega tu API key de Anthropic para que el botón "Analizar con IA" en el canvas llame directamente a Claude y muestre el análisis en el dashboard. La key se guarda localmente, nunca sale de tu dispositivo.
        </div>
        <div style={{ display:"flex", gap:8 }}>
          <input
            type="password"
            value={key}
            onChange={e=>setKey(e.target.value)}
            placeholder="sk-ant-api03-..."
            style={{ flex:1, background:BG, border:`1px solid ${BORDER}`, borderRadius:8, padding:"8px 12px", color:WHITE, fontSize:13, outline:"none" }}
          />
          <button onClick={saveKey}
            style={{ padding:"8px 18px", background:GOLD, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13 }}>
            {saved ? "✓ Guardado" : "Guardar"}
          </button>
        </div>
        {data.settings?.apiKey && (
          <div style={{ marginTop:8, color:GREEN, fontSize:11 }}>✓ API key activa — el análisis de IA está habilitado en los procesos comerciales.</div>
        )}
      </div>

      <div style={{ marginTop:20, padding:16, background:"rgba(76,175,125,0.06)", border:`1px solid ${GREEN}44`, borderRadius:10 }}>
        <div style={{ color:GREEN, fontWeight:600, fontSize:13, marginBottom:6 }}>Backup de datos</div>
        <div style={{ color:GRAY, fontSize:12, lineHeight:1.6, marginBottom:12 }}>
          Exportá todos tus clientes, tareas y procesos como archivo JSON. Antes de cualquier actualización del dashboard, hacé un backup.
        </div>
        <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
          <button onClick={handleExport}
            style={{ padding:"8px 18px", background:GREEN, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13 }}>
            ↓ Exportar datos
          </button>
          <label style={{ padding:"8px 18px", background:"transparent", color:WHITE, border:`1px solid ${BORDER}`, borderRadius:8, cursor:"pointer", fontWeight:600, fontSize:13 }}>
            ↑ Importar datos
            <input type="file" accept=".json" onChange={handleImport} style={{ display:"none" }} />
          </label>
        </div>
        {importMsg && <div style={{ marginTop:8, color:GREEN, fontSize:11 }}>{importMsg}</div>}
      </div>

      <div style={{ marginTop:20, padding:16, background:"rgba(239,68,68,0.05)", border:`1px solid rgba(239,68,68,0.25)`, borderRadius:10 }}>
        <div style={{ color:"#EF4444", fontWeight:600, fontSize:13, marginBottom:6 }}>🔒 PIN — Equipo y Roles</div>
        <div style={{ color:GRAY, fontSize:12, lineHeight:1.6, marginBottom:12 }}>
          {hasPin ? "Para cambiar o quitar el PIN debés ingresar el PIN actual primero." : "Configurá un PIN para proteger la pestaña Equipo y Roles. Solo quien lo conozca puede acceder."}
        </div>
        {pinError && <div style={{ color:"#EF4444", fontSize:12, marginBottom:8, fontWeight:600 }}>PIN actual incorrecto.</div>}
        {hasPin && (
          <div style={{ display:"flex", gap:8, marginBottom:10 }}>
            <input type="password" value={pinCurrent} onChange={e=>setPinCurrent(e.target.value)}
              placeholder="PIN actual"
              style={{ width:140, background:BG, border:`1px solid ${pinError?"#EF4444":BORDER}`, borderRadius:8, padding:"8px 12px", color:WHITE, fontSize:13, outline:"none", letterSpacing:4 }} />
            <span style={{ color:GRAY, fontSize:12, alignSelf:"center" }}>→ ingresá el PIN actual para continuar</span>
          </div>
        )}
        <div style={{ display:"flex", gap:8 }}>
          <input type="password" value={pinInput} onChange={e=>setPinInput(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&savePin()}
            placeholder={hasPin ? "Nuevo PIN" : "Nuevo PIN (ej: 1234)"}
            style={{ flex:1, background:BG, border:`1px solid ${BORDER}`, borderRadius:8, padding:"8px 12px", color:WHITE, fontSize:13, outline:"none", letterSpacing:4 }} />
          <button onClick={savePin}
            style={{ padding:"8px 18px", background:"#EF4444", color:"#fff", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13 }}>
            {pinSaved ? "✓ Guardado" : hasPin ? "Cambiar PIN" : "Activar PIN"}
          </button>
          {hasPin && (
            <button onClick={removePin}
              style={{ padding:"8px 14px", background:"transparent", color:GRAY, border:`1px solid ${BORDER}`, borderRadius:8, cursor:"pointer", fontSize:13 }}>
              Quitar PIN
            </button>
          )}
        </div>
        {hasPin && !pinError && !pinSaved && (
          <div style={{ marginTop:8, color:"#EF4444", fontSize:11 }}>✓ Equipo y Roles está protegido con PIN.</div>
        )}
      </div>
    </div>
  );
}

    <div>
      {steps.map((step, idx) => (

          <span style={{ color:GOLD_DIM, fontSize:12, minWidth:26, paddingTop:8, fontWeight:700 }}>#{step.n||idx+1}</span>
          <div style={{ flex:1, display:"flex", flexDirection:"column", gap:4 }}>

            <input value={step.desc||""} onChange={e=>onUpdate(idx,{desc:e.target.value})}

function MetodoTab({ data, onChange }) {
  const gMvp  = data.globalMvpSteps  || MVP_STEPS.map(s=>({...s, id:"mvp_"+s.n}));
  const gFull = data.globalFullSteps || FULL_STEPS.map(s=>({...s, id:"full_"+s.n}));
  const gTasks = data.globalTasks    || GEMA_TASKS.map(t=>({...t, id:"gt_"+t.n}));

  const [localMvp,   setLocalMvp]   = useState(() => gMvp);
  const [localFull,  setLocalFull]  = useState(() => gFull);
  const [localTasks, setLocalTasks] = useState(() => gTasks);
  const [section, setSection] = useState("launch");
  const [dirty, setDirty] = useState(false);
  const [taskSearch, setTaskSearch] = useState("");

  const mark = fn => (...args) => { fn(...args); setDirty(true); };

  const applyChanges = () => {
    const syncedClients = syncTasksToClients(data.clients, localTasks);
    onChange({ ...data, globalTasks: localTasks, globalMvpSteps: localMvp, globalFullSteps: localFull, clients: syncedClients });
    setDirty(false);
  };

  // MVP steps handlers
  const mvpUpdate = mark((idx, patch) => setLocalMvp(s => s.map((x,i)=>i===idx?{...x,...patch}:x)));
  const mvpDelete = mark((idx)        => setLocalMvp(s => s.filter((_,i)=>i!==idx)));
  const mvpAdd    = mark(()           => { const n=Math.max(...localMvp.map(s=>s.n||0),0)+1; setLocalMvp(s=>[...s,{n,id:uid(),title:"Nuevo paso MVP",desc:""}]); });
  const mvpReset  = ()                => { setLocalMvp(MVP_STEPS.map(s=>({...s,id:"mvp_"+s.n}))); setDirty(true); };

  // Full steps handlers
  const fullUpdate = mark((idx, patch) => setLocalFull(s => s.map((x,i)=>i===idx?{...x,...patch}:x)));
  const fullDelete = mark((idx)        => setLocalFull(s => s.filter((_,i)=>i!==idx)));
  const fullAdd    = mark(()           => { const n=Math.max(...localFull.map(s=>s.n||0),0)+1; setLocalFull(s=>[...s,{n,id:uid(),title:"Nuevo paso Full",desc:""}]); });
  const fullReset  = ()                => { setLocalFull(FULL_STEPS.map(s=>({...s,id:"full_"+s.n}))); setDirty(true); };

  // Task handlers
  const taskAdd    = mark((area, week) => { const n=Math.max(...localTasks.map(t=>t.n||0),0)+1; setLocalTasks(ts=>[...ts,{n,id:uid(),area,week,title:"Nueva tarea",owner:"TUYO"}]); });
  const taskDelete = mark((id)         => setLocalTasks(ts=>ts.filter(t=>t.id!==id)));
  const taskUpdate = mark((id, patch)  => setLocalTasks(ts=>ts.map(t=>t.id===id?{...t,...patch}:t)));
  const taskReset  = ()                => { setLocalTasks(GEMA_TASKS.map(t=>({...t,id:"gt_"+t.n}))); setDirty(true); };

  const filteredTasks = taskSearch
    ? localTasks.filter(t => t.title?.toLowerCase().includes(taskSearch.toLowerCase()) || String(t.n).includes(taskSearch))
    : localTasks;

  return (
    <div>
      {/* Header */}
      <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", marginBottom:24, flexWrap:"wrap", gap:12 }}>
        <div>
          <h2 style={{ color:WHITE, fontSize:20, fontWeight:700, margin:0 }}>Método Growth Partner AI</h2>
          <div style={{ color:GRAY, fontSize:12, marginTop:4 }}>
            Cambios aquí se aplican a todos los clientes · {data.clients.length} cliente(s) activo(s)
          </div>
        </div>
        <div style={{ display:"flex", gap:8, alignItems:"center" }}>
          {dirty && (
            <span style={{ fontSize:11, color:GOLD, opacity:0.8 }}>Cambios sin aplicar</span>
          )}
          <button onClick={applyChanges}
            style={{ padding:"10px 20px", background: dirty ? GOLD : "#222225", color: dirty ? "#141414" : GRAY, border:`1px solid ${dirty ? GOLD : BORDER}`, borderRadius:8, cursor: dirty ? "pointer" : "default", fontWeight:700, fontSize:13, transition:"all 0.2s" }}>
            ⚡ Aplicar a todos los clientes
          </button>
        </div>
      </div>

      {/* Section tabs */}
      <div style={{ display:"flex", gap:2, marginBottom:24, borderBottom:`1px solid ${BORDER}` }}>
        {[["launch","🎯 Lanzamiento (15 pasos)"],["tasks","📋 Tareas del Método ("+localTasks.length+")"]].map(([id,label]) => (
          <button key={id} onClick={()=>setSection(id)}
            style={{ padding:"8px 18px", background:"none", border:"none", borderBottom:`2px solid ${section===id ? GOLD : "transparent"}`, color: section===id ? GOLD : GRAY, cursor:"pointer", fontSize:13, fontWeight: section===id ? 600 : 400 }}>
            {label}
          </button>
        ))}
      </div>

      {section === "launch" && (
        <div style={{ maxWidth:720 }}>
          <div style={{ marginBottom:28 }}>
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:14 }}>
              <span style={{ color:GOLD, fontWeight:700, fontSize:15 }}>🎯 Mínimo Viable</span>
              <span style={{ fontSize:11, color:GRAY }}>{localMvp.length} pasos · Semana 2</span>
            </div>
            <StepsEditor steps={localMvp} onUpdate={mvpUpdate} onDelete={mvpDelete} onAdd={mvpAdd} onReset={mvpReset} />
          </div>
          <div style={{ borderTop:`1px solid ${BORDER}`, paddingTop:24 }}>
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:14 }}>
              <span style={{ color:GREEN, fontWeight:700, fontSize:15 }}>🚀 Full Launch</span>
              <span style={{ fontSize:11, color:GRAY }}>{localFull.length} pasos · Semana 3</span>
            </div>
            <StepsEditor steps={localFull} onUpdate={fullUpdate} onDelete={fullDelete} onAdd={fullAdd} onReset={fullReset} />
          </div>
        </div>
      )}

      {section === "tasks" && (
        <div>
          <div style={{ display:"flex", gap:10, alignItems:"center", marginBottom:16, flexWrap:"wrap" }}>
            <input value={taskSearch} onChange={e=>setTaskSearch(e.target.value)}
              placeholder="Buscar tarea..."
              style={{ flex:1, minWidth:180, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8, padding:"7px 12px", color:WHITE, fontSize:12, outline:"none" }} />
            <button onClick={taskReset}
              style={{ padding:"7px 14px", background:"transparent", color:GRAY, border:`1px solid ${BORDER}`, borderRadius:8, cursor:"pointer", fontSize:12 }}>
              ↺ Restaurar defaults ({GEMA_TASKS.length} tareas)
            </button>
          </div>
          {AREAS.map(area => {
            const areaTasks = filteredTasks.filter(t=>t.area===area);
            return (
              <div key={area} style={{ marginBottom:24 }}>
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                    <span style={{ color:GOLD, fontWeight:700, fontSize:13, textTransform:"uppercase", letterSpacing:1 }}>{area}</span>
                    <span style={{ fontSize:11, color:GRAY }}>({areaTasks.length} tareas)</span>
                    {AREA_AGENT[area] && (
                      <span style={{ fontSize:10, padding:"2px 7px", borderRadius:4, background:`${AREA_AGENT[area].color}20`, color:AREA_AGENT[area].color, border:`1px solid ${AREA_AGENT[area].color}55`, fontWeight:600 }}>
                        🤖 {AREA_AGENT[area].label}
                      </span>
                    )}
                  </div>
                  <div style={{ display:"flex", gap:6 }}>
                    {WEEKS.map(w => (
                      <button key={w} onClick={()=>taskAdd(area, w)}
                        style={{ padding:"3px 8px", borderRadius:5, fontSize:10, cursor:"pointer", background:"transparent", color:GOLD, border:`1px dashed ${GOLD_DIM}` }}>
                        + {w.replace("Semana ","")}
                      </button>
                    ))}
                  </div>
                </div>
                {WEEKS.map(week => {
                  const wt = areaTasks.filter(t=>t.week===week);
                  if (!wt.length) return null;
                  return (
                    <div key={week} style={{ marginBottom:10 }}>
                      <div style={{ fontSize:10, color:GOLD_DIM, fontWeight:700, marginBottom:6, textTransform:"uppercase", letterSpacing:0.5 }}>{week}</div>
                      {wt.map(task => (
                        <div key={task.id} style={{ display:"flex", gap:8, alignItems:"center", marginBottom:3, padding:"6px 10px", background:CARD, borderRadius:6, border:`1px solid ${BORDER}` }}>
                          <span style={{ fontSize:10, color:GRAY, minWidth:26, fontFamily:"monospace" }}>#{task.n}</span>
                          <input value={task.title} onChange={e=>taskUpdate(task.id,{title:e.target.value})}
                            style={{ flex:1, background:"transparent", border:"none", color:WHITE, fontSize:12, outline:"none" }} />
                          <select value={task.owner||"TUYO"} onChange={e=>taskUpdate(task.id,{owner:e.target.value})}
                            style={{ background:"#222225", border:`1px solid ${BORDER}`, color:GRAY, fontSize:10, borderRadius:4, padding:"2px 6px" }}>
                            <option value="TUYO">TUYO</option>
                            <option value="GEMA V4">GEMA V4</option>
                          </select>
                          <button onClick={()=>taskDelete(task.id)}
                            style={{ background:"none", border:"none", color:RED, cursor:"pointer", fontSize:14, padding:"0 3px", opacity:0.6 }}>×</button>
                        </div>
                      ))}
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ─── HOME TAB ─────────────────────────────────────────────────────────────────
function HomeTab({ data, onGoToClients, onSelectClient }) {
  const allTasks = data.clients.flatMap(c => c.tasks || []);
  const doneTasks = allTasks.filter(t => t.done);
  const pct = allTasks.length ? Math.round(doneTasks.length / allTasks.length * 100) : 0;

  const now = new Date();
  const upcoming = data.clients.flatMap(c =>
    (c.meetings || [])
      .filter(m => m.date && new Date(m.date) >= now)
      .map(m => ({ client: c, meeting: m, date: new Date(m.date) }))
  ).sort((a, b) => a.date - b.date).slice(0, 6);

  const byOwner = {};
  data.clients.forEach(c => {
    (c.tasks || []).filter(t => !t.done).forEach(t => {
      const key = t.owner || "Sin asignar";
      if (!byOwner[key]) byOwner[key] = { pending: 0, clients: new Set() };
      byOwner[key].pending++;
      byOwner[key].clients.add(c.name);
    });
  });

  const recentlyDone = data.clients.flatMap(c =>
    (c.tasks || [])
      .filter(t => t.done && t.doneAt && (Date.now() - t.doneAt) < 7 * 24 * 60 * 60 * 1000)
      .map(t => ({ ...t, clientName: c.name }))
  ).sort((a, b) => b.doneAt - a.doneAt).slice(0, 8);

  const fmtDate = d => d.toLocaleDateString("es-CO", { weekday:"short", day:"2-digit", month:"short" });
  const today = new Date().toLocaleDateString("es-CO", { weekday:"long", day:"2-digit", month:"long", year:"numeric" });

  const statCards = [
    { label:"Clientes activos",    value: data.clients.length,              color: GOLD,      icon:"👥", action: onGoToClients },
    { label:"Tareas completadas",  value: `${doneTasks.length}/${allTasks.length}`, color: GREEN, icon:"✓" },
    { label:"Progreso global",     value: `${pct}%`,                        color: pct>70?GREEN:pct>40?GOLD:RED, icon:"📈" },
    { label:"Próximas reuniones",  value: upcoming.length,                  color: "#60A5FA", icon:"📅" },
  ];

  return (
    <div style={{ maxWidth:1100 }}>
      <div style={{ marginBottom:28 }}>
        <h2 style={{ color:WHITE, fontSize:22, fontWeight:700 }}>Centro de comando</h2>
        <div style={{ color:GRAY, fontSize:12, marginTop:4, textTransform:"capitalize" }}>{today}</div>
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:14, marginBottom:28 }}>
        {statCards.map(card => (
          <div key={card.label} onClick={card.action}
            style={{ padding:"18px 20px", background:CARD, border:`1px solid ${BORDER}`, borderRadius:12,
              cursor:card.action?"pointer":"default", transition:"border-color 0.15s" }}
            onMouseEnter={e=>{ if(card.action) e.currentTarget.style.borderColor=GOLD; }}
            onMouseLeave={e=>{ e.currentTarget.style.borderColor=BORDER; }}>
            <div style={{ fontSize:18, marginBottom:8 }}>{card.icon}</div>
            <div style={{ fontSize:28, fontWeight:800, color:card.color, lineHeight:1 }}>{card.value}</div>
            <div style={{ fontSize:11, color:GRAY, marginTop:6 }}>{card.label}</div>
          </div>
        ))}
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:20 }}>
        <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
          <div style={{ padding:18, background:CARD, border:`1px solid ${BORDER}`, borderRadius:12 }}>
            <div style={{ color:WHITE, fontWeight:600, fontSize:13, marginBottom:14 }}>📅 Próximas reuniones</div>
            {upcoming.length === 0
              ? <div style={{ color:GRAY, fontSize:12 }}>No hay reuniones agendadas próximas.</div>
              : upcoming.map(({ client, meeting, date }) => (
                <div key={meeting.id} onClick={()=>onSelectClient(client.id)}
                  style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start",
                    padding:"9px 0", borderBottom:`1px solid ${BORDER}`, cursor:"pointer" }}
                  onMouseEnter={e=>e.currentTarget.style.opacity="0.7"}
                  onMouseLeave={e=>e.currentTarget.style.opacity="1"}>
                  <div>
                    <div style={{ color:WHITE, fontSize:13 }}>{meeting.title}</div>
                    <div style={{ color:GRAY, fontSize:10, marginTop:2 }}>{client.name}</div>
                  </div>
                  <span style={{ color:"#60A5FA", fontSize:11, fontWeight:600, whiteSpace:"nowrap", marginLeft:12 }}>{fmtDate(date)}</span>
                </div>
              ))
            }
          </div>

          <div style={{ padding:18, background:CARD, border:`1px solid ${BORDER}`, borderRadius:12 }}>
            <div style={{ color:WHITE, fontWeight:600, fontSize:13, marginBottom:14 }}>✓ Completado últimos 7 días</div>
            {recentlyDone.length === 0
              ? <div style={{ color:GRAY, fontSize:12 }}>No hay tareas completadas esta semana.</div>
              : recentlyDone.map(t => (
                <div key={t.id} style={{ padding:"6px 0", borderBottom:`1px solid ${BORDER}` }}>
                  <div style={{ color:WHITE, fontSize:12, lineHeight:1.4 }}>{t.title}</div>
                  <div style={{ color:GRAY, fontSize:10, marginTop:2 }}>{t.clientName} · {t.week}</div>
                </div>
              ))
            }
          </div>
        </div>

        <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
          <div style={{ padding:18, background:CARD, border:`1px solid ${BORDER}`, borderRadius:12 }}>
            <div style={{ color:WHITE, fontWeight:600, fontSize:13, marginBottom:14 }}>👤 Pendientes por responsable</div>
            {Object.keys(byOwner).length === 0
              ? <div style={{ color:GREEN, fontSize:12 }}>Todo al día — no hay tareas pendientes.</div>
              : Object.entries(byOwner).sort((a,b)=>b[1].pending-a[1].pending).map(([owner, info]) => (
                <div key={owner} style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                  padding:"9px 0", borderBottom:`1px solid ${BORDER}` }}>
                  <div>
                    <span style={{ color:WHITE, fontSize:13 }}>{owner}</span>
                    <span style={{ color:GRAY, fontSize:10, marginLeft:8 }}>
                      {[...info.clients].slice(0,2).join(", ")}{info.clients.size>2?` +${info.clients.size-2}`:""}
                    </span>
                  </div>
                  <span style={{ background:"rgba(212,175,55,0.12)", color:GOLD, fontSize:11, fontWeight:700,
                    padding:"2px 10px", borderRadius:20 }}>{info.pending}</span>
                </div>
              ))
            }
          </div>

          <div style={{ padding:18, background:CARD, border:`1px solid ${BORDER}`, borderRadius:12 }}>
            <div style={{ color:WHITE, fontWeight:600, fontSize:13, marginBottom:14 }}>📊 Progreso por cliente</div>
            {data.clients.length === 0
              ? <div style={{ color:GRAY, fontSize:12 }}>
                  No hay clientes.{" "}
                  <button onClick={onGoToClients}
                    style={{ background:"none", border:"none", color:GOLD, cursor:"pointer", fontSize:12, textDecoration:"underline" }}>
                    Crear primer cliente
                  </button>
                </div>
              : data.clients.map(c => {
                const ct = c.tasks || [];
                const cd = ct.filter(t => t.done).length;
                const cp = ct.length ? Math.round(cd / ct.length * 100) : 0;
                return (
                  <div key={c.id} onClick={()=>onSelectClient(c.id)}
                    style={{ padding:"9px 0", borderBottom:`1px solid ${BORDER}`, cursor:"pointer" }}
                    onMouseEnter={e=>e.currentTarget.style.opacity="0.7"}
                    onMouseLeave={e=>e.currentTarget.style.opacity="1"}>
                    <div style={{ display:"flex", justifyContent:"space-between", marginBottom:5 }}>
                      <span style={{ color:WHITE, fontSize:12 }}>{c.name}</span>
                      <span style={{ color:GRAY, fontSize:11 }}>{cd}/{ct.length} · {cp}%</span>
                    </div>
                    <div style={{ height:4, background:BORDER, borderRadius:2 }}>
                      <div style={{ height:4, width:`${cp}%`, background:cp>70?GREEN:cp>40?GOLD:RED,
                        borderRadius:2, transition:"width 0.3s" }} />
                    </div>
                  </div>
                );
              })
            }
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── ROOT COMPONENT ───────────────────────────────────────────────────────────
function MetodoGrowthPartner() {
  const [data, setData] = useState(getInitialData);
  const [tab, setTab] = useState("inicio");
  const [selectedClientId, setSelectedClientId] = useState(null);
  const [saved, setSaved] = useState(true);
  const saveTimer = useRef(null);
  const [teamUnlocked, setTeamUnlocked] = useState(false);
  const [teamPinInput, setTeamPinInput] = useState("");
  const [teamPinError, setTeamPinError] = useState(false);

  // Auto-save
  useEffect(() => {
    clearTimeout(saveTimer.current);
    setSaved(false);
    saveTimer.current = setTimeout(() => { storageSet(data); setSaved(true); }, 800);
    return () => clearTimeout(saveTimer.current);
  }, [data]);

  const updateData = (newData) => setData(newData);

  const createClient = (name, channel) => {
    const c = makeClient(name, channel, data.globalTasks);
    setData(d => ({ ...d, clients: [...d.clients, c] }));
    setSelectedClientId(c.id);
  };

  const updateClient = (updatedClient) => {
    setData(d => ({ ...d, clients: d.clients.map(c => c.id === updatedClient.id ? updatedClient : c) }));
  };

  const saveTemplate = (name, flow) => {
    setData(d => ({ ...d, flowTemplates: [...(d.flowTemplates||[]), { id:uid(), name, createdAt:Date.now(), nodes:flow.nodes, edges:flow.edges }] }));
  };
  const deleteTemplate = (templateId) => {
    setData(d => ({ ...d, flowTemplates: (d.flowTemplates||[]).filter(t=>t.id!==templateId) }));
  };

  const selectedClient = data.clients.find(c=>c.id===selectedClientId);

  return (
    <div style={{ minHeight:"100vh", background:BG, color:WHITE, fontFamily:"-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" }}>
      {/* Header */}
      <div style={{ background:CARD, borderBottom:`1px solid ${BORDER}`, padding:"0 24px", position:"sticky", top:0, zIndex:100 }}>
        <div style={{ maxWidth:1200, margin:"0 auto", display:"flex", alignItems:"center", gap:0 }}>
          <div style={{ padding:"14px 0", marginRight:24 }}>
            <span style={{ color:GOLD, fontWeight:800, fontSize:16, letterSpacing:0.5 }}>GP</span>
            <span style={{ color:GRAY, fontWeight:400, fontSize:13, marginLeft:8 }}>GROWTH PARTNER AI</span>
          </div>
          <div style={{ display:"flex", gap:0 }}>
            {[["inicio","Inicio"],["clientes","Clientes"],["metodo","Método"],["equipo","Equipo y roles"],["configuracion","Configuración"]].map(([id,label]) => (
              <button key={id} onClick={()=>{ setTab(id); setSelectedClientId(null); }}
                style={{ padding:"16px 16px", background:"none", border:"none", borderBottom:`2px solid ${tab===id&&!selectedClientId ? GOLD : "transparent"}`, color: tab===id&&!selectedClientId ? GOLD : GRAY, cursor:"pointer", fontSize:13, fontWeight: tab===id ? 600 : 400, transition:"all 0.15s" }}>
                {label}
              </button>
            ))}
          </div>
          <div style={{ flex:1 }} />
          <div style={{ fontSize:11, color: saved ? GREEN : GOLD_DIM }}>
            {saved ? "Guardado" : "Guardando..."}
          </div>
        </div>
      </div>

      {/* Content */}
      <div style={{ maxWidth:1200, margin:"0 auto", padding:"28px 24px" }}>
        {/* Client detail takes precedence */}
        {selectedClientId && selectedClient ? (
          <ClientDetail
            client={selectedClient} team={data.team}
            onBack={()=>setSelectedClientId(null)} onChange={updateClient}
            apiKey={data.settings?.apiKey || ""}
            flowTemplates={data.flowTemplates||[]}
            onSaveTemplate={saveTemplate} onDeleteTemplate={deleteTemplate}
            globalMvpSteps={data.globalMvpSteps} globalFullSteps={data.globalFullSteps}
          />
        ) : (
          <>
            {tab === "inicio" && (
              <HomeTab
                data={data}
                onGoToClients={()=>setTab("clientes")}
                onSelectClient={(id)=>{ setSelectedClientId(id); setTab("clientes"); }}
              />
            )}
            {tab === "clientes" && (
              <ClientsList clients={data.clients} onSelect={setSelectedClientId} onCreate={createClient} />
            )}
            {tab === "metodo" && (
              <MetodoTab data={data} onChange={updateData} />
            )}
            {tab === "equipo" && (
              (!data.settings?.teamPin || teamUnlocked) ? (
                <TeamTab data={data} onChange={updateData} />
              ) : (
                <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", minHeight:340, gap:14 }}>
                  <div style={{ fontSize:32 }}>🔒</div>
                  <div style={{ color:WHITE, fontSize:16, fontWeight:700 }}>Área privada</div>
                  <div style={{ color:GRAY, fontSize:13 }}>Ingresá el PIN para acceder a Equipo y Roles</div>
                  <input
                    type="password"
                    value={teamPinInput}
                    onChange={e=>{ setTeamPinInput(e.target.value); setTeamPinError(false); }}
                    onKeyDown={e=>{
                      if (e.key==="Enter") {
                        if (teamPinInput === data.settings.teamPin) { setTeamUnlocked(true); setTeamPinInput(""); }
                        else { setTeamPinError(true); setTeamPinInput(""); }
                      }
                    }}
                    placeholder="PIN"
                    style={{ background:"#111113", border:`2px solid ${teamPinError?"#EF4444":BORDER}`, borderRadius:10, padding:"12px 20px", color:WHITE, fontSize:18, textAlign:"center", outline:"none", width:180, letterSpacing:8 }}
                  />
                  {teamPinError && <div style={{ color:"#EF4444", fontSize:12 }}>PIN incorrecto</div>}
                  <button
                    onClick={()=>{
                      if (teamPinInput === data.settings.teamPin) { setTeamUnlocked(true); setTeamPinInput(""); }
                      else { setTeamPinError(true); setTeamPinInput(""); }
                    }}
                    style={{ padding:"10px 32px", background:GOLD, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:14 }}>
                    Acceder
                  </button>
                </div>
              )
            )}
            {tab === "configuracion" && (
              <SettingsTab data={data} onChange={updateData} />
            )}
          </>
        )}
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MetodoGrowthPartner />);
  </script>
</body>
</html>
