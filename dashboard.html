                <input value={assetVal} onChange={e=>setAssetVal(e.target.value)} placeholder="$ COP" type="number"
                  style={{ width:90,background:"#111113",border:`1px solid ${BORDER}`,borderRadius:6,padding:"6px 8px",color:WHITE,fontSize:11,outline:"none" }} />
                <button onClick={()=>{ if(!assetName.trim()||!assetVal)return; onUpdate({finance:{...finance,assets:[...assets,{id:"a_"+Date.now(),name:assetName.trim(),value:parseFloat(assetVal)}]}}); setAssetName("");setAssetVal(""); }}
                  style={{ padding:"6px 12px",background:"#22C55E",color:"#141414",border:"none",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:13 }}>+</button>
              </div>
            </div>

            {/* Deudas */}
            <div style={{ background:CARD,borderRadius:12,padding:16,border:`1px solid #EF444433` }}>
              <div style={{ display:"flex",justifyContent:"space-between",marginBottom:12 }}>
                <span style={{ color:WHITE,fontWeight:700,fontSize:13 }}>Deudas</span>
                <span style={{ color:totalDebts>0?"#EF4444":"#22C55E",fontWeight:700,fontSize:13 }}>
                  {totalDebts>0?fmtCOP(totalDebts):"Sin deudas ✓"}
                </span>
              </div>
              {debts.map(d=>{
                const {months,totalPaid,totalInterest}=calcDebt(d.balance,d.rate,d.payment);
                const noAlcanza=d.payment>0&&d.rate>0&&months===null;
                const payments = d.payments||[];
                const totalAbonado = payments.reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
                const expD = expandedDebt===d.id;
                const doAbono = () => {
                  const amt=parseFloat(abonoInputs[d.id]); if(!amt||amt<=0) return;
                  const fecha = abonoDate[d.id] || new Date().toISOString().slice(0,10);
                  const nb = Math.max(0, d.balance-amt);
                  const newPmt = { id:"ab_"+Date.now(), date:fecha, amount:amt };
                  const updD = { ...d, balance:nb, payments:[...payments,newPmt] };
                  onUpdate({finance:{...finance, debts: nb===0 ? debts.filter(x=>x.id!==d.id) : debts.map(x=>x.id===d.id?updD:x)}});
                  setAbonoInputs(p=>({...p,[d.id]:""}));
                };

                // ── Proyección ──
                const today = new Date();
                let payoffStr=null, targetStatus=null, aceleracion=null;
                if (months) {
                  const pd = new Date(today.getFullYear(), today.getMonth()+months, 1);
                  payoffStr = pd.toLocaleDateString("es-CO",{month:"long",year:"numeric"});
                  const r=(d.rate||0)/100;
                  // 6 meses antes
                  const fn=Math.max(1,months-6);
                  const fp=r>0 ? d.balance*r*Math.pow(1+r,fn)/(Math.pow(1+r,fn)-1) : d.balance/fn;
                  const extra6=Math.round(Math.max(0,fp-(d.payment||0)));
                  aceleracion=extra6>500?extra6:null;
                  // Fecha objetivo
                  if (d.targetDate) {
                    const tgt=new Date(d.targetDate+"T00:00:00");
                    const tgtM=Math.max(1,Math.round((tgt-today)/(30.44*24*60*60*1000)));
                    const tp=r>0 ? d.balance*r*Math.pow(1+r,tgtM)/(Math.pow(1+r,tgtM)-1) : d.balance/tgtM;
                    const extra=Math.round(tp-(d.payment||0));
                    targetStatus={ onTrack:months<=tgtM, extra };
                  }
                }
                const creditCap = (d.payment||0)*30;

                return (
                  <div key={d.id} style={{ marginBottom:10,background:"#EF444408",borderRadius:8,border:`1px solid #EF444422`,overflow:"hidden" }}>

                    {/* Info principal */}
                    <div style={{ padding:"10px 12px" }}>
                      <div style={{ display:"flex",justifyContent:"space-between",marginBottom:5 }}>
                        <span style={{ color:WHITE,fontSize:12,fontWeight:700 }}>{d.name}</span>
                        <button onClick={()=>onUpdate({finance:{...finance,debts:debts.filter(x=>x.id!==d.id)}})}
                          style={{ background:"none",border:"none",color:GRAY,cursor:"pointer",fontSize:14,opacity:0.5 }}>×</button>
                      </div>
                      <div style={{ display:"flex",gap:10,fontSize:11,color:GRAY,flexWrap:"wrap",marginBottom:6 }}>
                        <span>Saldo: <span style={{ color:"#EF4444",fontWeight:700 }}>{fmtCOP(d.balance)}</span></span>
                        {d.rate>0 && <span>Tasa: <span style={{ color:"#F59E0B" }}>{d.rate}%/mes</span></span>}
                        {d.payment>0 && <span>Cuota: <span style={{ color:WHITE }}>{fmtCOP(d.payment)}</span></span>}
                        {totalAbonado>0 && <span>Abonado: <span style={{ color:"#22C55E",fontWeight:700 }}>{fmtCOP(totalAbonado)}</span></span>}
                      </div>

                      {noAlcanza && <div style={{ color:"#EF4444",fontSize:11,fontWeight:700,marginBottom:6 }}>⚠ La cuota no cubre los intereses — nunca termina</div>}

                      {/* Abono rápido */}
                      <div style={{ display:"flex",gap:5 }}>
                        <input type="date" value={abonoDate[d.id]||new Date().toISOString().slice(0,10)}
                          onChange={e=>setAbonoDate(p=>({...p,[d.id]:e.target.value}))}
                          style={{ background:"#0e0e10",border:`1px solid ${BORDER}`,borderRadius:5,padding:"5px 7px",color:GRAY,fontSize:10,outline:"none",width:115 }} />
                        <input value={abonoInputs[d.id]||""} type="number" placeholder="Monto a abonar..."
                          onChange={e=>setAbonoInputs(p=>({...p,[d.id]:e.target.value}))}
                          onKeyDown={e=>e.key==="Enter"&&doAbono()}
                          style={{ flex:1,background:"#0e0e10",border:`1px solid #22C55E44`,borderRadius:5,padding:"5px 8px",color:WHITE,fontSize:11,outline:"none" }} />
                        <button onClick={doAbono}
                          style={{ padding:"5px 12px",background:"#22C55E",color:"#111",border:"none",borderRadius:5,cursor:"pointer",fontWeight:800,fontSize:12,whiteSpace:"nowrap" }}>↓ Abonar</button>
                      </div>
                    </div>

                    {/* ── Proyección & crédito ── */}
                    {payoffStr && (()=>{
                      const simExtra = parseFloat(simExtras[d.id])||0;
                      const simPmt   = (d.payment||0) + simExtra;
                      const sim      = simExtra>0 ? calcDebt(d.balance, d.rate, simPmt) : null;
                      const simDate  = sim?.months ? new Date(today.getFullYear(), today.getMonth()+sim.months, 1) : null;
                      const simStr   = simDate ? simDate.toLocaleDateString("es-CO",{month:"long",year:"numeric"}) : null;
                      const msSaved  = sim?.months ? months - sim.months : 0;
                      const intSaved = (sim?.totalInterest!=null&&totalInterest!=null) ? Math.max(0,totalInterest-sim.totalInterest) : 0;
                      const simCreditDate = simDate ? simDate.toLocaleDateString("es-CO",{month:"short",year:"numeric"}) : null;
                      const baseCreditDate= new Date(today.getFullYear(),today.getMonth()+months,1).toLocaleDateString("es-CO",{month:"short",year:"numeric"});
                      const simCredit = simPmt * 30;
                      return (
                      <div style={{ borderTop:`1px solid #22C55E22`,padding:"10px 12px",background:"#22C55E05" }}>
                        <div style={{ color:"#22C55E",fontSize:9,fontWeight:700,letterSpacing:1.5,marginBottom:8 }}>PROYECCIÓN & ACCESO A CRÉDITO</div>

                        {/* Fecha objetivo */}
                        <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:10 }}>
                          <span style={{ color:GRAY,fontSize:11,whiteSpace:"nowrap" }}>Fecha objetivo:</span>
                          <input type="date" value={d.targetDate||""}
                            onChange={e=>onUpdate({finance:{...finance,debts:debts.map(x=>x.id===d.id?{...x,targetDate:e.target.value}:x)}})}
                            style={{ background:"#0e0e10",border:`1px solid ${BORDER}`,borderRadius:4,padding:"3px 6px",color:WHITE,fontSize:11,outline:"none" }} />
                        </div>

                        {/* Chips base */}
                        <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:10 }}>
                          <div style={{ background:"#111113",borderRadius:6,padding:"7px 9px" }}>
                            <div style={{ color:GRAY,fontSize:9,marginBottom:3 }}>Liquidación actual</div>
                            <div style={{ color:simExtra>0?"#9B9B9F":WHITE,fontSize:12,fontWeight:700,lineHeight:1.2,textDecoration:simExtra>0?"line-through":"none" }}>{payoffStr}</div>
                            <div style={{ color:GRAY,fontSize:10,marginTop:2 }}>{months} cuotas · {(months/12).toFixed(1)}a</div>
                          </div>
                          <div style={{ background:"#111113",borderRadius:6,padding:"7px 9px" }}>
                            <div style={{ color:GRAY,fontSize:9,marginBottom:3 }}>Flujo liberado/mes</div>
                            <div style={{ color:"#22C55E",fontSize:12,fontWeight:700 }}>{fmtCOP(d.payment||0)}</div>
                            <div style={{ color:GRAY,fontSize:10,marginTop:2 }}>al terminar</div>
                          </div>
                          <div style={{ background:"#111113",borderRadius:6,padding:"7px 9px" }}>
                            <div style={{ color:GRAY,fontSize:9,marginBottom:3 }}>Crédito accesible est.</div>
                            <div style={{ color:simExtra>0?"#9B9B9F":GOLD,fontSize:12,fontWeight:700,textDecoration:simExtra>0?"line-through":"none" }}>{fmtCOP(creditCap)}</div>
                            <div style={{ color:GRAY,fontSize:10,marginTop:2 }}>en {baseCreditDate}</div>
                          </div>
                        </div>

                        {/* ── Simulador ── */}
                        <div style={{ background:"#111113",borderRadius:7,padding:"9px 10px",marginBottom:8 }}>
                          <div style={{ color:GOLD,fontSize:9,fontWeight:700,letterSpacing:1.5,marginBottom:7 }}>SIMULAR PAGO EXTRA</div>
                          <div style={{ display:"flex",gap:6,alignItems:"center",marginBottom: simExtra>0?8:0 }}>
                            <span style={{ color:GRAY,fontSize:11,whiteSpace:"nowrap" }}>+ Extra/mes:</span>
                            <input type="number" value={simExtras[d.id]||""} placeholder="0"
                              onChange={e=>setSimExtras(p=>({...p,[d.id]:e.target.value}))}
                              style={{ flex:1,background:"#0e0e10",border:`1px solid ${GOLD}55`,borderRadius:5,padding:"4px 8px",color:GOLD,fontSize:12,fontWeight:700,outline:"none" }} />
                            {simExtra>0&&<button onClick={()=>setSimExtras(p=>({...p,[d.id]:""}))}
                              style={{ background:"none",border:"none",color:GRAY,cursor:"pointer",fontSize:12,opacity:0.5 }}>×</button>}
                          </div>

                          {/* Resultado simulación */}
                          {simExtra>0 && simStr && (
                            <div>
                              <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:6 }}>
                                <div style={{ background:"#0a0a0b",borderRadius:5,padding:"6px 8px",border:`1px solid ${GOLD}33` }}>
                                  <div style={{ color:GRAY,fontSize:9,marginBottom:2 }}>Nueva liquidación</div>
                                  <div style={{ color:GOLD,fontSize:12,fontWeight:800 }}>{simStr}</div>
                                  <div style={{ color:"#22C55E",fontSize:10,marginTop:1 }}>-{msSaved} meses antes</div>
                                </div>
                                <div style={{ background:"#0a0a0b",borderRadius:5,padding:"6px 8px",border:`1px solid #22C55E33` }}>
                                  <div style={{ color:GRAY,fontSize:9,marginBottom:2 }}>Intereses ahorrados</div>
                                  <div style={{ color:"#22C55E",fontSize:12,fontWeight:800 }}>{fmtCOP(Math.round(intSaved))}</div>
                                  <div style={{ color:GRAY,fontSize:10,marginTop:1 }}>{sim.months} cuotas</div>
                                </div>
                                <div style={{ background:"#0a0a0b",borderRadius:5,padding:"6px 8px",border:`1px solid ${GOLD}33` }}>
                                  <div style={{ color:GRAY,fontSize:9,marginBottom:2 }}>Crédito accesible</div>
                                  <div style={{ color:GOLD,fontSize:12,fontWeight:800 }}>{fmtCOP(Math.round(simCredit))}</div>
                                  <div style={{ color:GRAY,fontSize:10,marginTop:1 }}>en {simCreditDate}</div>
                                </div>
                              </div>
                              <div style={{ padding:"5px 8px",borderRadius:5,background:"#22C55E10",border:`1px solid #22C55E22`,fontSize:10,color:"#22C55E" }}>
                                Pagando <span style={{ fontWeight:700 }}>{fmtCOP(simPmt)}/mes</span> ({fmtCOP(simExtra)} extra) accedes a ~<span style={{ fontWeight:700 }}>{fmtCOP(Math.round(simCredit))}</span> en crédito nuevo <span style={{ fontWeight:700 }}>{msSaved} meses antes</span>
                              </div>
                            </div>
                          )}
                          {simExtra>0 && !simStr && (
                            <div style={{ color:"#F59E0B",fontSize:10 }}>Calcula agregando tasa mensual para ver proyección</div>
                          )}
                        </div>

                        {/* Estado vs fecha objetivo */}
                        {targetStatus && (
                          <div style={{ padding:"6px 9px",borderRadius:5,marginBottom:6,
                            background:targetStatus.onTrack?"#22C55E15":"#EF444415",
                            border:`1px solid ${targetStatus.onTrack?"#22C55E33":"#EF444433"}` }}>
                            {targetStatus.onTrack
                              ? <span style={{ color:"#22C55E",fontSize:11,fontWeight:600 }}>✓ Vas en ritmo — terminas antes de la fecha objetivo</span>
                              : <span style={{ color:"#EF4444",fontSize:11 }}>Para tu fecha objetivo necesitas <span style={{ fontWeight:700 }}>{fmtCOP(targetStatus.extra)}/mes extra</span></span>
                            }
                          </div>
                        )}

                        {/* Intereses base */}
                        {totalPaid && (
                          <div style={{ display:"flex",gap:16,fontSize:10 }}>
                            <span style={{ color:GRAY }}>Intereses totales: <span style={{ color:"#EF4444",fontWeight:600 }}>{fmtCOP(totalInterest)}</span></span>
                            <span style={{ color:GRAY }}>Costo total: <span style={{ color:WHITE,fontWeight:600 }}>{fmtCOP(totalPaid)}</span></span>
                          </div>
                        )}
                      </div>
                      );
                    })()}

                    {/* ── Historial de abonos ── */}
                    {payments.length>0 && (
                      <div style={{ borderTop:`1px solid #EF444422` }}>
                        <div onClick={()=>setExpandedDebt(expD?null:d.id)}
                          style={{ display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 12px",cursor:"pointer",userSelect:"none" }}>
                          <span style={{ color:GRAY,fontSize:10,fontWeight:700,letterSpacing:1 }}>HISTORIAL · {payments.length} abonos · {fmtCOP(totalAbonado)} total</span>
                          <span style={{ color:GRAY,fontSize:10 }}>{expD?"▲":"▼"}</span>
                        </div>
                        {expD && (
                          <div style={{ padding:"0 12px 10px" }}>
                            {[...payments].reverse().map(p=>(
                              <div key={p.id} style={{ display:"flex",alignItems:"center",gap:8,padding:"4px 0",borderBottom:`1px solid #EF444411` }}>
                                <span style={{ color:GRAY,fontSize:11,flex:1 }}>{p.date}</span>
                                <span style={{ color:"#22C55E",fontSize:11,fontWeight:700 }}>-{fmtCOP(p.amount)}</span>
                                <button onClick={()=>{
                                  const restored = d.balance+parseFloat(p.amount);
                                  onUpdate({finance:{...finance,debts:debts.map(x=>x.id===d.id?{...x,balance:restored,payments:payments.filter(pp=>pp.id!==p.id)}:x)}});
                                }} style={{ background:"none",border:"none",color:GRAY,cursor:"pointer",fontSize:12,opacity:0.4,padding:0 }}>×</button>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
              <div style={{ display:"grid",gridTemplateColumns:"1fr 80px 50px 80px 110px 36px",gap:4,marginTop:8,alignItems:"center" }}>
                <input value={debtName} onChange={e=>setDebtName(e.target.value)} placeholder="Acreedor..."
                  style={{ background:"#111113",border:`1px solid ${BORDER}`,borderRadius:6,padding:"5px 7px",color:WHITE,fontSize:11,outline:"none" }} />
                <input value={debtBal} onChange={e=>setDebtBal(e.target.value)} placeholder="Saldo" type="number"
                  style={{ background:"#111113",border:`1px solid ${BORDER}`,borderRadius:6,padding:"5px 7px",color:WHITE,fontSize:11,outline:"none" }} />
                <input value={debtRate} onChange={e=>setDebtRate(e.target.value)} placeholder="%" type="number"
                  style={{ background:"#111113",border:`1px solid ${BORDER}`,borderRadius:6,padding:"5px 7px",color:WHITE,fontSize:11,outline:"none" }} />
                <input value={debtPmt} onChange={e=>setDebtPmt(e.target.value)} placeholder="Cuota" type="number"
                  style={{ background:"#111113",border:`1px solid ${BORDER}`,borderRadius:6,padding:"5px 7px",color:WHITE,fontSize:11,outline:"none" }} />
                <input value={debtTarget||""} onChange={e=>setDebtTarget(e.target.value)} type="date" title="Fecha objetivo de pago"
                  style={{ background:"#111113",border:`1px solid ${BORDER}`,borderRadius:6,padding:"5px 7px",color:GRAY,fontSize:10,outline:"none" }} />
                <button onClick={()=>{ if(!debtName.trim()||!debtBal)return; onUpdate({finance:{...finance,debts:[...debts,{id:"d_"+Date.now(),name:debtName.trim(),balance:parseFloat(debtBal),rate:parseFloat(debtRate)||0,payment:parseFloat(debtPmt)||0,targetDate:debtTarget||""}]}}); setDebtName("");setDebtBal("");setDebtRate("");setDebtPmt("");setDebtTarget(""); }}
                  style={{ padding:"5px 8px",background:"#EF4444",color:"#fff",border:"none",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:13 }}>+</button>
              </div>
              <div style={{ color:GRAY,fontSize:10,marginTop:5 }}>Acreedor · Saldo · % tasa mensual · Cuota mensual · Fecha objetivo (opcional)</div>
            </div>
          </div>

          {/* Otros pasivos */}
          <div style={{ background:CARD,borderRadius:12,padding:16,border:`1px solid ${BORDER}`,marginBottom:16 }}>
            <div style={{ display:"flex",justifyContent:"space-between",marginBottom:10 }}>
              <span style={{ color:WHITE,fontWeight:700,fontSize:13 }}>Otros Pasivos</span>
              <span style={{ color:"#EF4444",fontWeight:700,fontSize:13 }}>{fmtCOP(liabilities.reduce((s,l)=>s+(parseFloat(l.value)||0),0))}</span>
            </div>
            {liabilities.length===0 && <div style={{ color:GRAY,fontSize:11,marginBottom:8 }}>Ej: impuestos pendientes, obligaciones sin cuota fija...</div>}
            {liabilities.map(item=>(
              <div key={item.id} style={{ display:"flex",alignItems:"center",gap:8,marginBottom:6 }}>
                <span style={{ flex:1,color:WHITE,fontSize:12 }}>{item.name}</span>
                <span style={{ color:GRAY,fontSize:12 }}>{fmtCOP(item.value)}</span>
                <button onClick={()=>onUpdate({finance:{...finance,liabilities:liabilities.filter(l=>l.id!==item.id)}})}
                  style={{ background:"none",border:"none",color:GRAY,cursor:"pointer",fontSize:14,opacity:0.5 }}>×</button>
              </div>
            ))}
            <div style={{ display:"flex",gap:6,marginTop:8 }}>
              <input value={liabName} onChange={e=>setLiabName(e.target.value)} placeholder="Nombre..."
                style={{ flex:1,background:"#111113",border:`1px solid ${BORDER}`,borderRadius:6,padding:"5px 8px",color:WHITE,fontSize:11,outline:"none" }} />
              <input value={liabVal} onChange={e=>setLiabVal(e.target.value)} placeholder="$ COP" type="number"
                style={{ width:90,background:"#111113",border:`1px solid ${BORDER}`,borderRadius:6,padding:"5px 8px",color:WHITE,fontSize:11,outline:"none" }} />
              <button onClick={()=>{ if(!liabName.trim()||!liabVal)return; onUpdate({finance:{...finance,liabilities:[...liabilities,{id:"l_"+Date.now(),name:liabName.trim(),value:parseFloat(liabVal)}]}}); setLiabName("");setLiabVal(""); }}
                style={{ padding:"5px 10px",background:GOLD,color:"#141414",border:"none",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:12 }}>+</button>
            </div>
          </div>
        </div>
      )}

      {/* ══ VISIÓN $250K ══ */}
      {tab==="vision" && (
        <div>
          <div style={{ display:"flex",gap:12,alignItems:"center",marginBottom:20,padding:"10px 14px",background:CARD,borderRadius:10,border:`1px solid ${BORDER}`,flexWrap:"wrap" }}>
            <span style={{ color:GRAY,fontSize:11 }}>Meta:</span>
            <span style={{ color:GOLD,fontWeight:700 }}>$</span>
            <input value={visionUSD} onChange={e=>onUpdate({finance:{...finance,visionUSD:parseFloat(e.target.value)||250000}})} type="number"
              style={{ width:100,background:"#111113",border:`1px solid ${BORDER}`,borderRadius:6,padding:"5px 8px",color:GOLD,fontSize:13,fontWeight:700,outline:"none" }} />
            <span style={{ color:GOLD,fontWeight:700 }}>USD</span>
            <span style={{ color:GRAY,fontSize:11,marginLeft:8 }}>TRM:</span>
            <input value={fxRate} onChange={e=>onUpdate({finance:{...finance,fxRate:parseFloat(e.target.value)||4200}})} type="number"
              style={{ width:76,background:"#111113",border:`1px solid ${BORDER}`,borderRadius:6,padding:"5px 8px",color:WHITE,fontSize:12,outline:"none" }} />
            <span style={{ color:GRAY,fontSize:11 }}>COP/USD</span>
          </div>

          <div style={{ background:"#0a0a0b", borderRadius:14, padding:"22px 24px", border:`1px solid ${GOLD}33`, borderLeft:`4px solid ${GOLD}`, marginBottom:20 }}>
            <div style={{ display:"flex", alignItems:"flex-start", gap:24, marginBottom:20, flexWrap:"wrap" }}>
              <div>
                <div style={{ color:GOLD_DIM, fontSize:9, fontWeight:700, letterSpacing:2.5, textTransform:"uppercase", marginBottom:6 }}>Posición actual</div>
                <div style={{ color:WHITE, fontWeight:900, fontSize:36, lineHeight:1, letterSpacing:-1 }}>{fmtUSD(netWorthUSD)}</div>
                <div style={{ color:GRAY, fontSize:12, marginTop:5 }}>de <span style={{ color:GOLD, fontWeight:700 }}>{fmtUSD(visionUSD)} USD</span> objetivo</div>

                  <div style={{ color:"#22C55E", fontWeight:900, fontSize:20, lineHeight:1 }}>{monthsToGoal} meses</div>
                  <div style={{ color:GRAY, fontSize:10, marginTop:5 }}>
                    Ahorro neto: <span style={{ color:"#22C55E", fontWeight:700 }}>{fmtCOP(avgNet)}/mes</span>
                  </div>
                  <div style={{ color:GRAY, fontSize:10, marginTop:2 }}>
                    CC {fmtCOP(avgCC)} · Gastos {fmtCOP(avgG)}
                  </div>
                </div>

            </div>

            </div>

              <span>$0</span>
              <span style={{ color:GOLD, fontWeight:700 }}>{pctProgress.toFixed(1)}% completado</span>
              <span>{fmtUSD(visionUSD)}</span>

          <div style={{ display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:20 }}>
            {[
              { overline:"Escenario 24 meses", sub:"necesitás ganar/mes",
                val: gap>0 ? fmtCOP(gap/24*fxRate + avgG) : "¡Meta alcanzada!",

                color:"#3B82F6" },
              { overline:"Escenario 36 meses", sub:"necesitás ganar/mes",
                val: gap>0 ? fmtCOP(gap/36*fxRate + avgG) : "¡Meta alcanzada!",
                detail: gap>0 ? `${fmtUSD(gap/36)} ahorro + gastos` : null,
                color:"#8B5CF6" },
              { overline:"Brecha restante", sub: gap>0 ? `≈ ${fmtCOP(gap*fxRate)}` : "Objetivo superado",
                val: gap>0 ? fmtUSD(gap)+" USD" : "¡Ya llegaste!",
                detail: null,
                color: gap<=0?"#22C55E":GOLD },
            ].map(({overline,sub,val,detail,color})=>(
              <div key={overline} style={{ background:"#0a0a0b", borderRadius:12, padding:"16px", border:`1px solid ${BORDER}`, borderTop:`2px solid ${color}55` }}>
                <div style={{ color:color+"88", fontSize:9, fontWeight:700, letterSpacing:2, textTransform:"uppercase", marginBottom:6 }}>{overline}</div>
                <div style={{ color, fontWeight:900, fontSize:16, lineHeight:1.2, marginBottom:4 }}>{val}</div>
                {sub && <div style={{ color:GRAY, fontSize:10, marginBottom:2 }}>{sub}</div>}
                {detail && <div style={{ color:GRAY, fontSize:9 }}>{detail}</div>}
              </div>
            ))}
          </div>

          <div style={{ background:CARD,borderRadius:12,padding:16,border:`1px solid ${BORDER}` }}>
            <div style={{ color:WHITE,fontWeight:700,fontSize:13,marginBottom:4 }}>Proyección 24 meses</div>
            <div style={{ color:GRAY,fontSize:10,marginBottom:14 }}>
              Basado en ahorro neto de <span style={{ color:"#22C55E" }}>{fmtUSD(avgNetUSD)}/mes</span>
              {recent.length>0&&` · promedio últimos ${recent.length} meses con datos`}
            </div>
            <div style={{ display:"flex",gap:2,alignItems:"flex-end",overflowX:"auto",paddingBottom:4 }}>
              {Array.from({length:24},(_,i)=>{
                const proj  = netWorthUSD+(i+1)*avgNetUSD;
                const pct   = Math.min(100,Math.max(0,proj/visionUSD*100));
                const hit   = proj>=visionUSD;
                const now   = new Date();
                const dt    = new Date(now.getFullYear(),now.getMonth()+i+1,1);
                const label = `${MONTHS[dt.getMonth()]} ${String(dt.getFullYear()).slice(2)}`;
                return (
                  <div key={i} title={`${label}: ${fmtUSD(proj)} (${pct.toFixed(0)}%)`}
                    style={{ display:"flex",flexDirection:"column",alignItems:"center",minWidth:26 }}>
                    <div style={{ height:90,width:18,background:"#222225",borderRadius:4,overflow:"hidden",position:"relative" }}>
                      <div style={{ position:"absolute",bottom:0,width:"100%",borderRadius:4,background:hit?"#22C55E":i<11?GOLD_DIM:GOLD,height:`${pct}%` }} />
                    </div>
                    <span style={{ color:GRAY,fontSize:8,marginTop:3,textAlign:"center",lineHeight:1.2 }}>{label}</span>
                  </div>
                );
              })}
            </div>
            <div style={{ display:"flex",gap:14,marginTop:10,fontSize:10,color:GRAY }}>
              <span style={{display:"flex",gap:4,alignItems:"center"}}><span style={{width:10,height:10,background:GOLD_DIM,borderRadius:2,display:"inline-block"}}/>Año 1</span>
              <span style={{display:"flex",gap:4,alignItems:"center"}}><span style={{width:10,height:10,background:GOLD,borderRadius:2,display:"inline-block"}}/>Año 2</span>
              <span style={{display:"flex",gap:4,alignItems:"center"}}><span style={{width:10,height:10,background:"#22C55E",borderRadius:2,display:"inline-block"}}/>Meta</span>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

      <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", minHeight:340, gap:14 }}>

// ─── SETTINGS TAB ─────────────────────────────────────────────────────────────
function SettingsTab({ data, onChange }) {
  const [key, setKey] = useState(data.settings?.apiKey || "");
  const [saved, setSaved] = useState(false);
  const [testStatus, setTestStatus] = useState(null);
  const [testMsg, setTestMsg] = useState("");
  const [importMsg, setImportMsg] = useState("");
  const [pinInput, setPinInput] = useState("");
  const [pinCurrent, setPinCurrent] = useState("");
  const [pinSaved, setPinSaved] = useState(false);
  const [pinError, setPinError] = useState(false);
  const hasPin = !!data.settings?.teamPin;

  const savePin = () => {
    if (hasPin && pinCurrent !== data.settings.teamPin) {
      setPinError(true);
      setTimeout(()=>setPinError(false), 2000);
      return;
    }
    onChange({ ...data, settings: { ...(data.settings||{}), teamPin: pinInput.trim() } });
    setPinInput(""); setPinCurrent("");
    setPinSaved(true);
    setTimeout(()=>setPinSaved(false), 2000);
  };

  const removePin = () => {
    if (pinCurrent !== data.settings.teamPin) {
      setPinError(true);
      setTimeout(()=>setPinError(false), 2000);
      return;
    }
    onChange({ ...data, settings: { ...(data.settings||{}), teamPin: "" } });
    setPinInput(""); setPinCurrent("");
  };

  const saveKey = () => {
    onChange({ ...data, settings: { ...(data.settings||{}), apiKey: key.trim() } });
    setSaved(true);
    setTimeout(()=>setSaved(false), 2000);
  };

  const testConnection = async () => {
    if (!key.trim()) return;
    setTestStatus("loading"); setTestMsg("");
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "x-api-key": key.trim(),
          "anthropic-version":"2023-06-01",
          "anthropic-dangerous-direct-browser-access":"true",
        },
        body: JSON.stringify({ model:"claude-haiku-4-5-20251001", max_tokens:10, messages:[{ role:"user", content:"Responde solo: OK" }] }),
      });
      const json = await res.json();
      if (json.error) throw new Error(json.error.message);
      setTestStatus("ok"); setTestMsg("Conexión exitosa — Claude responde correctamente.");
    } catch(e) {
      setTestStatus("error"); setTestMsg(e.message || "API key inválida o error de red.");
    }
  };

  const handleExport = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `gp_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (!parsed.clients) throw new Error("Archivo inválido");
        onChange(parsed);
        setImportMsg("✓ Datos importados correctamente.");
        setTimeout(()=>setImportMsg(""), 4000);
      } catch {
        setImportMsg("Error: archivo no válido.");
        setTimeout(()=>setImportMsg(""), 4000);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  return (
    <div style={{ maxWidth:600 }}>
      <div style={{ marginTop:0, padding:16, background:"rgba(212,175,55,0.06)", border:`1px solid ${GOLD_DIM}`, borderRadius:10 }}>
        <div style={{ color:GOLD, fontWeight:600, fontSize:13, marginBottom:6 }}>✦ Conexión con Claude IA</div>
        <div style={{ color:GRAY, fontSize:12, lineHeight:1.6, marginBottom:12 }}>
          Pega tu API key de Anthropic para que el botón "Analizar con IA" en el canvas llame directamente a Claude y muestre el análisis en el dashboard. La key se guarda localmente, nunca sale de tu dispositivo.
        </div>
        <div style={{ display:"flex", gap:8 }}>
          <input
            type="password"
            value={key}
            onChange={e=>{ setKey(e.target.value); setTestStatus(null); setTestMsg(""); }}
            placeholder="sk-ant-api03-..."
            style={{ flex:1, background:BG, border:`1px solid ${BORDER}`, borderRadius:8, padding:"8px 12px", color:WHITE, fontSize:13, outline:"none" }}
          />
          <button onClick={testConnection} disabled={!key.trim() || testStatus==="loading"}
            style={{ padding:"8px 14px", background:"transparent", color:testStatus==="ok"?GREEN:testStatus==="error"?"#EF4444":GRAY, border:`1px solid ${testStatus==="ok"?GREEN:testStatus==="error"?"#EF4444":BORDER}`, borderRadius:8, cursor:"pointer", fontSize:13, fontWeight:600, opacity: testStatus==="loading"?0.7:1 }}>
            {testStatus==="loading" ? "Probando…" : testStatus==="ok" ? "✓ OK" : testStatus==="error" ? "✕ Error" : "Probar"}
          </button>
          <button onClick={saveKey}
            style={{ padding:"8px 18px", background:GOLD, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13 }}>
            {saved ? "✓ Guardado" : "Guardar"}
          </button>
        </div>
        {testMsg && (
          <div style={{ marginTop:8, fontSize:11, color: testStatus==="ok" ? GREEN : "#EF4444" }}>{testMsg}</div>
        )}
        {!testMsg && data.settings?.apiKey && (
          <div style={{ marginTop:8, color:GREEN, fontSize:11 }}>✓ API key activa — el análisis de IA y la importación de imágenes están habilitados.</div>
        )}
      </div>

      <div style={{ marginTop:20, padding:16, background:"rgba(76,175,125,0.06)", border:`1px solid ${GREEN}44`, borderRadius:10 }}>
        <div style={{ color:GREEN, fontWeight:600, fontSize:13, marginBottom:6 }}>Backup de datos</div>
        <div style={{ color:GRAY, fontSize:12, lineHeight:1.6, marginBottom:12 }}>
          Exportá todos tus clientes, tareas y procesos como archivo JSON. Antes de cualquier actualización del dashboard, hacé un backup.
        </div>
        <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
          <button onClick={handleExport}
            style={{ padding:"8px 18px", background:GREEN, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13 }}>
            ↓ Exportar datos
          </button>
          <label style={{ padding:"8px 18px", background:"transparent", color:WHITE, border:`1px solid ${BORDER}`, borderRadius:8, cursor:"pointer", fontWeight:600, fontSize:13 }}>
            ↑ Importar datos
            <input type="file" accept=".json" onChange={handleImport} style={{ display:"none" }} />
          </label>
        </div>
        {importMsg && <div style={{ marginTop:8, color:GREEN, fontSize:11 }}>{importMsg}</div>}
      </div>

      {/* PIN Personal */}
      {(()=>{
        const [pp, setPp]       = React.useState("");
        const [ppCur, setPpCur] = React.useState("");
        const [ppSaved, setPpSaved] = React.useState(false);
        const [ppErr, setPpErr] = React.useState(false);
        const haspp = !!data.settings?.personalPin;
        const savepp = () => {
          if (haspp && ppCur !== data.settings.personalPin) { setPpErr(true); setTimeout(()=>setPpErr(false),2000); return; }
          onChange({ ...data, settings: { ...(data.settings||{}), personalPin: pp.trim() } });
          setPp(""); setPpCur(""); setPpSaved(true); setTimeout(()=>setPpSaved(false),2000);
        };
        const removepp = () => {
          if (ppCur !== data.settings.personalPin) { setPpErr(true); setTimeout(()=>setPpErr(false),2000); return; }
          onChange({ ...data, settings: { ...(data.settings||{}), personalPin: "" } });
          setPp(""); setPpCur("");
        };
        return (
          <div style={{ marginTop:20, padding:16, background:"rgba(139,92,246,0.05)", border:`1px solid rgba(139,92,246,0.25)`, borderRadius:10 }}>
            <div style={{ color:"#8B5CF6", fontWeight:600, fontSize:13, marginBottom:6 }}>🔒 PIN — Área Personal</div>
            <div style={{ color:GRAY, fontSize:12, lineHeight:1.6, marginBottom:12 }}>
              {haspp ? "Para cambiar o quitar el PIN debés ingresar el PIN actual." : "Configurá un PIN para proteger tu sección Personal."}
            </div>
            {ppErr && <div style={{ color:"#EF4444", fontSize:12, marginBottom:8 }}>PIN actual incorrecto.</div>}
            {haspp && (
              <div style={{ display:"flex", gap:8, marginBottom:10 }}>
                <input type="password" value={ppCur} onChange={e=>setPpCur(e.target.value)} placeholder="PIN actual"
                  style={{ width:140, background:BG, border:`1px solid ${ppErr?"#EF4444":BORDER}`, borderRadius:8, padding:"8px 12px", color:WHITE, fontSize:13, outline:"none", letterSpacing:4 }} />
              </div>
            )}
            <div style={{ display:"flex", gap:8 }}>
              <input type="password" value={pp} onChange={e=>setPp(e.target.value)} onKeyDown={e=>e.key==="Enter"&&savepp()}
                placeholder={haspp ? "Nuevo PIN" : "Nuevo PIN (ej: 1234)"}
                style={{ flex:1, background:BG, border:`1px solid ${BORDER}`, borderRadius:8, padding:"8px 12px", color:WHITE, fontSize:13, outline:"none", letterSpacing:4 }} />
              <button onClick={savepp}
                style={{ padding:"8px 18px", background:"#8B5CF6", color:"#fff", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13 }}>

      <div style={{ marginTop:20, padding:16, background:"rgba(239,68,68,0.05)", border:`1px solid rgba(239,68,68,0.25)`, borderRadius:10 }}>

          {hasPin ? "Para cambiar o quitar el PIN debés ingresar el PIN actual primero." : "Configurá un PIN para proteger la pestaña Equipo y Roles. Solo quien lo conozca puede acceder."}
        </div>
        {pinError && <div style={{ color:"#EF4444", fontSize:12, marginBottom:8, fontWeight:600 }}>PIN actual incorrecto.</div>}
        {hasPin && (
          <div style={{ display:"flex", gap:8, marginBottom:10 }}>
            <input type="password" value={pinCurrent} onChange={e=>setPinCurrent(e.target.value)}
              placeholder="PIN actual"
              style={{ width:140, background:BG, border:`1px solid ${pinError?"#EF4444":BORDER}`, borderRadius:8, padding:"8px 12px", color:WHITE, fontSize:13, outline:"none", letterSpacing:4 }} />

            style={{ flex:1, background:BG, border:`1px solid ${BORDER}`, borderRadius:8, padding:"8px 12px", color:WHITE, fontSize:13, outline:"none", letterSpacing:4 }} />
          <button onClick={savePin}
            style={{ padding:"8px 18px", background:"#EF4444", color:"#fff", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13 }}>
            {pinSaved ? "✓ Guardado" : hasPin ? "Cambiar PIN" : "Activar PIN"}
          </button>
          {hasPin && (
            <button onClick={removePin}
              style={{ padding:"8px 14px", background:"transparent", color:GRAY, border:`1px solid ${BORDER}`, borderRadius:8, cursor:"pointer", fontSize:13 }}>
              Quitar PIN
            </button>
          )}
        </div>
        {hasPin && !pinError && !pinSaved && (
          <div style={{ marginTop:8, color:"#EF4444", fontSize:11 }}>✓ Equipo y Roles está protegido con PIN.</div>
        )}
      </div>
    </div>
  );
}

function MetodoTab({ data, onChange }) {
  const gMvp  = data.globalMvpSteps  || MVP_STEPS.map(s=>({...s, id:"mvp_"+s.n}));
  const gFull = data.globalFullSteps || FULL_STEPS.map(s=>({...s, id:"full_"+s.n}));
  const gTasks = data.globalTasks    || GEMA_TASKS.map(t=>({...t, id:"gt_"+t.n}));

  const [localMvp,   setLocalMvp]   = useState(() => gMvp);
  const [localFull,  setLocalFull]  = useState(() => gFull);
  const [localTasks, setLocalTasks] = useState(() => gTasks);
  const [section, setSection] = useState("launch");
  const [dirty, setDirty] = useState(false);
  const [taskSearch, setTaskSearch] = useState("");

  const mark = fn => (...args) => { fn(...args); setDirty(true); };

  const applyChanges = () => {
    const syncedClients = syncTasksToClients(data.clients, localTasks);
    onChange({ ...data, globalTasks: localTasks, globalMvpSteps: localMvp, globalFullSteps: localFull, clients: syncedClients });
    setDirty(false);
  };

  // MVP steps handlers
  const mvpUpdate = mark((idx, patch) => setLocalMvp(s => s.map((x,i)=>i===idx?{...x,...patch}:x)));
  const mvpDelete = mark((idx)        => setLocalMvp(s => s.filter((_,i)=>i!==idx)));
  const mvpAdd    = mark(()           => { const n=Math.max(...localMvp.map(s=>s.n||0),0)+1; setLocalMvp(s=>[...s,{n,id:uid(),title:"Nuevo paso MVP",desc:""}]); });
  const mvpReset  = ()                => { setLocalMvp(MVP_STEPS.map(s=>({...s,id:"mvp_"+s.n}))); setDirty(true); };

  // Full steps handlers
  const fullUpdate = mark((idx, patch) => setLocalFull(s => s.map((x,i)=>i===idx?{...x,...patch}:x)));
  const fullDelete = mark((idx)        => setLocalFull(s => s.filter((_,i)=>i!==idx)));
  const fullAdd    = mark(()           => { const n=Math.max(...localFull.map(s=>s.n||0),0)+1; setLocalFull(s=>[...s,{n,id:uid(),title:"Nuevo paso Full",desc:""}]); });
  const fullReset  = ()                => { setLocalFull(FULL_STEPS.map(s=>({...s,id:"full_"+s.n}))); setDirty(true); };

  // Task handlers
  const taskAdd    = mark((area, week) => { const n=Math.max(...localTasks.map(t=>t.n||0),0)+1; setLocalTasks(ts=>[...ts,{n,id:uid(),area,week,title:"Nueva tarea",owner:"TUYO"}]); });
  const taskDelete = mark((id)         => setLocalTasks(ts=>ts.filter(t=>t.id!==id)));
  const taskUpdate = mark((id, patch)  => setLocalTasks(ts=>ts.map(t=>t.id===id?{...t,...patch}:t)));
  const taskReset  = ()                => { setLocalTasks(GEMA_TASKS.map(t=>({...t,id:"gt_"+t.n}))); setDirty(true); };

            </div>

              <span style={{ fontSize:11, color:GRAY }}>{localFull.length} pasos · Semana 3</span>

      {section === "tasks" && (

          <div style={{ display:"flex", gap:10, alignItems:"center", marginBottom:16, flexWrap:"wrap" }}>

    if (!form.title.trim()) return;

                  <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:2 }}>
                    <select value={issue.status} onChange={e=>update(issue.id,{status:e.target.value})}

      </div>
    </div>
  );

function HomeTab({ data, onGoToClients, onSelectClient, onUpdateIssues }) {
  const allTasks = data.clients.flatMap(c => c.tasks || []);
  const doneTasks = allTasks.filter(t => t.done);
  const pct = allTasks.length ? Math.round(doneTasks.length / allTasks.length * 100) : 0;

  const now = new Date();
  const upcoming = data.clients.flatMap(c =>
    (c.meetings || [])
      .filter(m => m.date && new Date(m.date) >= now)
      .map(m => ({ client: c, meeting: m, date: new Date(m.date) }))
  ).sort((a, b) => a.date - b.date).slice(0, 6);

  const byOwner = {};
  data.clients.forEach(c => {
    (c.tasks || []).filter(t => !t.done).forEach(t => {
      const key = t.owner || "Sin asignar";
      if (!byOwner[key]) byOwner[key] = { pending: 0, clients: new Set() };
      byOwner[key].pending++;
      byOwner[key].clients.add(c.name);
    });
  });

  const recentlyDone = data.clients.flatMap(c =>
    (c.tasks || [])
      .filter(t => t.done && t.doneAt && (Date.now() - t.doneAt) < 7 * 24 * 60 * 60 * 1000)
      .map(t => ({ ...t, clientName: c.name }))
  ).sort((a, b) => b.doneAt - a.doneAt).slice(0, 8);

  const fmtDate = d => d.toLocaleDateString("es-CO", { weekday:"short", day:"2-digit", month:"short" });
  const today = new Date().toLocaleDateString("es-CO", { weekday:"long", day:"2-digit", month:"long", year:"numeric" });

  const openIssues = (data.issues||[]).filter(i=>i.status!=="listo");
  const urgentIssues = openIssues.filter(i=>i.priority==="rojo");

  const statCards = [
    { overline:"Portafolio",  label:"Clientes Activos",    value: data.clients.length,              color: GOLD,      icon:"👥", action: onGoToClients },
    { overline:"Ejecución",   label:"Tareas Completadas",  value: `${doneTasks.length}/${allTasks.length}`, color: GREEN, icon:"✓" },
    { overline:"Avance",      label:"Progreso Global",     value: `${pct}%`,                        color: pct>70?GREEN:pct>40?GOLD:RED, icon:"📈" },
    { overline:"Agenda",      label:"Reuniones Próximas",  value: upcoming.length,                  color: "#60A5FA", icon:"📅" },
    { overline:"Alertas",     label:"Tareas Abiertas",     value: openIssues.length,                color: urgentIssues.length>0?"#EF4444":urgentIssues.length===0&&openIssues.length===0?GREEN:GOLD, icon: urgentIssues.length>0?"🔴":"🚦" },
  ];

  return (
    <div style={{ maxWidth:1100 }}>
      <div style={{ marginBottom:28, display:"flex", alignItems:"flex-end", justifyContent:"space-between", flexWrap:"wrap", gap:8 }}>
        <div>
          <div style={{ color:GOLD_DIM, fontSize:10, fontWeight:700, letterSpacing:3, textTransform:"uppercase", marginBottom:6 }}>Dashboard</div>
          <h2 style={{ color:WHITE, fontSize:24, fontWeight:800, letterSpacing:-0.5, lineHeight:1 }}>Centro de Comando</h2>
        </div>
        <div style={{ color:GRAY, fontSize:12, textTransform:"capitalize", textAlign:"right" }}>{today}</div>
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:14, marginBottom:28 }}>
        {statCards.map(card => (
          <div key={card.label} onClick={card.action}
            style={{ padding:"20px 18px", background:CARD, borderRadius:14, cursor:card.action?"pointer":"default",
              border:`1px solid ${BORDER}`, borderTop:`2px solid ${card.color}55`,
              transition:"border-color 0.2s, transform 0.2s, box-shadow 0.2s",
              boxShadow:"0 2px 12px rgba(0,0,0,0.25)" }}
            onMouseEnter={e=>{ e.currentTarget.style.borderColor=card.color+"88"; e.currentTarget.style.transform="translateY(-2px)"; e.currentTarget.style.boxShadow=`0 6px 24px rgba(0,0,0,0.4), 0 0 0 1px ${card.color}22`; }}
            onMouseLeave={e=>{ e.currentTarget.style.borderColor=BORDER; e.currentTarget.style.transform=""; e.currentTarget.style.boxShadow="0 2px 12px rgba(0,0,0,0.25)"; }}>
            <div style={{ display:"inline-flex", alignItems:"center", justifyContent:"center", width:32, height:32, borderRadius:8, background:`${card.color}14`, marginBottom:14, fontSize:16 }}>{card.icon}</div>
            <div style={{ color:card.color+"88", fontSize:9, fontWeight:700, letterSpacing:2, textTransform:"uppercase", marginBottom:4 }}>{card.overline}</div>
            <div style={{ fontSize:29, fontWeight:900, color:card.color, lineHeight:1, letterSpacing:-1 }}>{card.value}</div>
            <div style={{ fontSize:11, color:GRAY, marginTop:6, fontWeight:500 }}>{card.label}</div>
          </div>
        ))}
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:20 }}>
        <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
          <div style={{ padding:20, background:CARD, border:`1px solid ${BORDER}`, borderRadius:14, boxShadow:"0 2px 12px rgba(0,0,0,0.2)" }}>
            <div style={{ marginBottom:16 }}>
              <div style={{ color:GOLD_DIM, fontSize:9, fontWeight:700, letterSpacing:2.5, textTransform:"uppercase", marginBottom:5 }}>Agenda</div>
              <div style={{ color:WHITE, fontWeight:800, fontSize:16, letterSpacing:-0.3 }}>Próximas Reuniones</div>
            </div>
            {upcoming.length === 0
              ? <div style={{ color:GRAY, fontSize:12, padding:"12px 0" }}>No hay reuniones agendadas próximas.</div>
              : <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                  {upcoming.map(({ client, meeting, date }) => (
                    <div key={meeting.id} onClick={()=>onSelectClient(client.id)}
                      style={{ background:"rgba(255,255,255,0.04)", border:`1px solid ${BORDER}`, borderLeft:`3px solid #60A5FA55`, borderRadius:9,
                        padding:"10px 13px", cursor:"pointer", display:"flex", justifyContent:"space-between",
                        alignItems:"center", transition:"all 0.15s" }}
                      onMouseEnter={e=>{ e.currentTarget.style.borderLeftColor="#60A5FA"; e.currentTarget.style.background="rgba(255,255,255,0.07)"; }}
                      onMouseLeave={e=>{ e.currentTarget.style.borderLeftColor="#60A5FA55"; e.currentTarget.style.background="rgba(255,255,255,0.04)"; }}>
                      <div style={{ minWidth:0 }}>
                        <div style={{ color:WHITE, fontWeight:600, fontSize:13, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
                          {meeting.title}
                        </div>
                        <div style={{ color:GRAY, fontSize:11, marginTop:2 }}>📌 {client.name}</div>
                      </div>
                      <div style={{ textAlign:"right", flexShrink:0, marginLeft:12 }}>
                        <div style={{ color:"#60A5FA", fontWeight:700, fontSize:12 }}>{fmtDate(date)}</div>
                        {meeting.desc && <div style={{ color:GRAY, fontSize:10, marginTop:1 }}>{meeting.desc.slice(0,30)}{meeting.desc.length>30?"…":""}</div>}
                      </div>
                    </div>
                  ))}
                </div>
            }
          </div>

          <div style={{ padding:20, background:CARD, border:`1px solid ${BORDER}`, borderRadius:14, boxShadow:"0 2px 12px rgba(0,0,0,0.2)" }}>
            <div style={{ marginBottom:16 }}>
              <div style={{ color:GREEN+"99", fontSize:9, fontWeight:700, letterSpacing:2.5, textTransform:"uppercase", marginBottom:5 }}>Esta semana</div>
              <div style={{ color:WHITE, fontWeight:800, fontSize:16, letterSpacing:-0.3 }}>Victorias Recientes</div>
            </div>
            {recentlyDone.length === 0
              ? <div style={{ color:GRAY, fontSize:12, padding:"12px 0" }}>No hay tareas completadas esta semana.</div>
              : recentlyDone.map(t => (
                <div key={t.id} style={{ padding:"7px 0", borderBottom:`1px solid rgba(42,42,46,0.6)`, display:"flex", alignItems:"flex-start", gap:8 }}>
                  <span style={{ color:GREEN, fontSize:11, marginTop:1, flexShrink:0 }}>✓</span>
                  <div>
                    <div style={{ color:WHITE, fontSize:12, lineHeight:1.4 }}>{t.title}</div>
                    <div style={{ color:GRAY, fontSize:10, marginTop:1 }}>{t.clientName} · {t.week}</div>
                  </div>
                </div>
              ))
            }
          </div>
        </div>

        <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
          <div style={{ padding:20, background:CARD, border:`1px solid ${BORDER}`, borderRadius:14, boxShadow:"0 2px 12px rgba(0,0,0,0.2)" }}>
            <div style={{ marginBottom:16 }}>
              <div style={{ color:GOLD_DIM, fontSize:9, fontWeight:700, letterSpacing:2.5, textTransform:"uppercase", marginBottom:5 }}>Equipo</div>
              <div style={{ color:WHITE, fontWeight:800, fontSize:16, letterSpacing:-0.3 }}>Carga de Trabajo</div>
            </div>
            {Object.keys(byOwner).length === 0
              ? <div style={{ color:GREEN, fontSize:12, padding:"12px 0", display:"flex", alignItems:"center", gap:6 }}>
                  <span style={{ color:GREEN }}>✓</span> Todo al día — sin tareas pendientes.
                </div>
              : Object.entries(byOwner).sort((a,b)=>b[1].pending-a[1].pending).map(([owner, info]) => (
                <div key={owner} style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                  padding:"9px 0", borderBottom:`1px solid rgba(42,42,46,0.6)` }}>
                  <div>
                    <span style={{ color:WHITE, fontSize:13, fontWeight:600 }}>{owner}</span>
                    <div style={{ color:GRAY, fontSize:10, marginTop:2 }}>
                      {[...info.clients].slice(0,2).join(", ")}{info.clients.size>2?` +${info.clients.size-2}`:""}
                    </div>
                  </div>
                  <span style={{ background:"rgba(212,175,55,0.1)", color:GOLD, fontSize:12, fontWeight:800,
                    padding:"3px 12px", borderRadius:20, border:"1px solid rgba(212,175,55,0.2)" }}>{info.pending}</span>
                </div>
              ))
            }
          </div>

          <div style={{ padding:20, background:CARD, border:`1px solid ${BORDER}`, borderRadius:14, boxShadow:"0 2px 12px rgba(0,0,0,0.2)" }}>
            <div style={{ marginBottom:16 }}>
              <div style={{ color:"#A78BFA99", fontSize:9, fontWeight:700, letterSpacing:2.5, textTransform:"uppercase", marginBottom:5 }}>Portafolio</div>
              <div style={{ color:WHITE, fontWeight:800, fontSize:16, letterSpacing:-0.3 }}>Estado de Clientes</div>
            </div>
            {data.clients.length === 0
              ? <div style={{ color:GRAY, fontSize:12, padding:"12px 0" }}>
                  No hay clientes.{" "}
                  <button onClick={onGoToClients}
                    style={{ background:"none", border:"none", color:GOLD, cursor:"pointer", fontSize:12, fontWeight:600, textDecoration:"none" }}>
                    Crear primer cliente →
                  </button>
                </div>
              : data.clients.map(c => {
                const ct = c.tasks || [];
                const cd = ct.filter(t => t.done).length;
                const cp = ct.length ? Math.round(cd / ct.length * 100) : 0;
                const barColor = cp>70?GREEN:cp>40?GOLD:RED;
                return (
                  <div key={c.id} onClick={()=>onSelectClient(c.id)}
                    style={{ padding:"9px 0", borderBottom:`1px solid rgba(42,42,46,0.6)`, cursor:"pointer", transition:"opacity 0.15s" }}
                    onMouseEnter={e=>e.currentTarget.style.opacity="0.7"}
                    onMouseLeave={e=>e.currentTarget.style.opacity="1"}>
                    <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6, alignItems:"baseline" }}>
                      <span style={{ color:WHITE, fontSize:12, fontWeight:600 }}>{c.name}</span>
                      <span style={{ color:barColor, fontSize:11, fontWeight:700 }}>{cp}%</span>
                    </div>
                    <ProgressBar pct={cp} color={barColor} height={3} />
                    <div style={{ color:GRAY, fontSize:10, marginTop:3 }}>{cd} de {ct.length} tareas</div>
                  </div>
                );
              })
            }
          </div>
        </div>
      </div>

      <div style={{ marginTop:20 }}>
        <IssuesPanel issues={data.issues||[]} team={data.team||[]} roles={data.roles||[]} onChange={onUpdateIssues} />
      </div>
    </div>
  );
}

// ─── ROOT COMPONENT ───────────────────────────────────────────────────────────
function MetodoGrowthPartner() {
  const [data, setData] = useState(getInitialData);
  const [tab, setTab] = useState("inicio");
  const [selectedClientId, setSelectedClientId] = useState(null);
  const [saved, setSaved] = useState(true);
  const [fbStatus, setFbStatus] = useState("sync"); // "sync" | "ok" | "error"
  const saveTimer = useRef(null);
  const lastSaveTs = useRef(0);
  const [teamUnlocked, setTeamUnlocked] = useState(false);
  const [teamPinInput, setTeamPinInput] = useState("");
  const [teamPinError, setTeamPinError] = useState(false);

  // Firebase: carga inicial + polling cada 30 segundos
  useEffect(() => {
    const ref = getFbRef();
    if (!ref) { setFbStatus("error"); return; }

    const syncFromFirebase = (isInitial = false) => {
      ref.once("value").then(snap => {
        const fbRaw = snap.val();
        const localTs = storageGetTs();

        if (fbRaw && fbRaw.clients) {
          const { _ts: fbTs, ...rest } = fbRaw;
          const fbTime = fbTs || 0;
          const clean = fbToJs(rest);

          if (fbTime > localTs + 2000) {
            // Firebase es más nuevo → usar Firebase
            setData(getInitialData(clean));
            storageSet(clean);
            storageSetTs(fbTime);
            lastSaveTs.current = fbTime;
          } else if (isInitial && localTs >= fbTime) {
            // Local es más nuevo o igual → mantener local y empujar a Firebase
            const localData = storageGet();
            if (localData && localData.clients) {
              const ts = localTs || Date.now();
              lastSaveTs.current = ts;
              ref.set({ ...localData, _ts: ts }).catch(() => {});
            }
          } else if (!isInitial && fbTime > lastSaveTs.current + 2000) {
            // Polling: Firebase tiene datos del socio
            setData(getInitialData(clean));
            storageSet(clean);
            storageSetTs(fbTime);
            lastSaveTs.current = fbTime;
          }
        } else if (isInitial) {
          // Firebase vacío → subir datos locales
          const localData = storageGet();
          if (localData && localData.clients) {
            const ts = localTs || Date.now();
            lastSaveTs.current = ts;
            ref.set({ ...localData, _ts: ts }).catch(() => {});
          }
        }
        setFbStatus("ok");
      }).catch(() => setFbStatus("error"));
    };

    syncFromFirebase(true);
    const interval = setInterval(() => syncFromFirebase(false), 30000);
    return () => clearInterval(interval);
  }, []);

  // Auto-save: localStorage + Firebase
  useEffect(() => {
    clearTimeout(saveTimer.current);
    setSaved(false);
    saveTimer.current = setTimeout(() => {
      const ts = Date.now();
      storageSet(data);
      storageSetTs(ts);
      const ref = getFbRef();
      if (ref) {
        lastSaveTs.current = ts;
        ref.set({ ...data, _ts: ts }).catch(() => setFbStatus("error"));
      }
      setSaved(true);
    }, 1000);
    return () => clearTimeout(saveTimer.current);
  }, [data]);

  const updateData = (newData) => setData(newData);

  const createClient = (name, channel) => {
    const c = makeClient(name, channel, data.globalTasks);
    setData(d => ({ ...d, clients: [...d.clients, c] }));
    setSelectedClientId(c.id);
  };

  const updateClient = (updatedClient) => {
    setData(d => ({ ...d, clients: d.clients.map(c => c.id === updatedClient.id ? updatedClient : c) }));
  };

  const deleteClient = (id) => {
    setData(d => ({ ...d, clients: d.clients.filter(c => c.id !== id) }));
    if (selectedClientId === id) setSelectedClientId(null);
  };

  const saveTemplate = (name, flow) => {
    setData(d => ({ ...d, flowTemplates: [...(d.flowTemplates||[]), { id:uid(), name, createdAt:Date.now(), nodes:flow.nodes, edges:flow.edges }] }));
  };
  const deleteTemplate = (templateId) => {
    setData(d => ({ ...d, flowTemplates: (d.flowTemplates||[]).filter(t=>t.id!==templateId) }));
  };

  const selectedClient = data.clients.find(c=>c.id===selectedClientId);

  return (
    <div style={{ minHeight:"100vh", background:"transparent", color:WHITE }}>
      {/* Header */}
      <div style={{ background:"rgba(23,23,26,0.88)", backdropFilter:"blur(14px)", WebkitBackdropFilter:"blur(14px)", borderBottom:"1px solid rgba(42,42,46,0.7)", padding:"0 24px", position:"sticky", top:0, zIndex:100, boxShadow:"0 1px 0 rgba(212,175,55,0.07), 0 4px 30px rgba(0,0,0,0.35)" }}>
        <div style={{ maxWidth:1200, margin:"0 auto", display:"flex", alignItems:"center", gap:0 }}>
          {/* Logo */}
          <div style={{ padding:"14px 0", marginRight:28, display:"flex", alignItems:"baseline", gap:0 }}>
            <span className="gp-logo-text" style={{ fontWeight:900, fontSize:19, letterSpacing:1.5 }}>GP</span>
            <span style={{ color:"rgba(155,155,159,0.55)", fontWeight:400, fontSize:10, marginLeft:10, letterSpacing:2.5, textTransform:"uppercase" }}>Growth Partner</span>
          </div>
          {/* Separator */}
          <div style={{ width:1, height:22, background:"rgba(42,42,46,0.8)", marginRight:4 }} />
          {/* Main nav */}
          <div style={{ display:"flex", gap:0 }}>
            {[["inicio","Inicio"],["clientes","Clientes"],["metodo","Método"]].map(([id,label]) => (
              <button key={id}
                className={`gp-nav-tab${tab===id&&!selectedClientId?" active":""}`}
                onClick={()=>{ setTab(id); setSelectedClientId(null); }}>
                {label}
              </button>
            ))}
          </div>
          <div style={{ flex:1 }} />
          {/* Tool icons */}
          <div style={{ display:"flex", gap:3, paddingRight:14, borderRight:`1px solid rgba(42,42,46,0.6)`, marginRight:14 }}>
            {[["equipo","👥","Equipo y Roles"],["personal","🔒","Área Personal"],["configuracion","⚙️","Configuración"]].map(([id,icon,label]) => {
              const isActive = tab===id && !selectedClientId;
              return (
                <button key={id} title={label}
                  className={`gp-tool-btn${isActive?" active":""}`}
                  onClick={()=>{ setTab(id); setSelectedClientId(null); }}>
                  {icon}
                  {isActive && <span style={{ position:"absolute", bottom:4, left:"50%", transform:"translateX(-50%)", width:4, height:4, borderRadius:2, background:GOLD, boxShadow:"0 0 4px "+GOLD }} />}
                </button>
              );
            })}
          </div>
          {/* Sync status */}
          <div style={{ display:"flex", alignItems:"center", fontSize:11 }}>
            <span className={`gp-status-dot ${!saved?"saving":fbStatus==="ok"?"online":fbStatus==="error"?"error":"sync"}`} />
            <span style={{ color: !saved ? GOLD_DIM : fbStatus==="ok" ? GREEN : fbStatus==="error" ? "#EF4444" : GRAY }}>
              {!saved ? "Guardando…" : fbStatus==="ok" ? "Sincronizado" : fbStatus==="error" ? "Sin conexión" : "Conectando…"}
            </span>
          </div>
        </div>
      </div>

      {/* Content */}
      <div key={tab} className="gp-fade-in" style={{ maxWidth:1200, margin:"0 auto", padding:"28px 24px" }}>
        {/* Client detail takes precedence */}
        {selectedClientId && selectedClient ? (
          <ClientDetail
            client={selectedClient} team={data.team}
            onBack={()=>setSelectedClientId(null)} onChange={updateClient}
            apiKey={data.settings?.apiKey || ""}
            flowTemplates={data.flowTemplates||[]}
            onSaveTemplate={saveTemplate} onDeleteTemplate={deleteTemplate}
            globalMvpSteps={data.globalMvpSteps} globalFullSteps={data.globalFullSteps}
          />
        ) : (
          <>
            {tab === "inicio" && (
              <HomeTab
                data={data}
                onGoToClients={()=>setTab("clientes")}
                onSelectClient={(id)=>{ setSelectedClientId(id); setTab("clientes"); }}
                onUpdateIssues={(issues)=>updateData({...data, issues})}
              />
            )}
            {tab === "clientes" && (
              <ClientsList clients={data.clients} onSelect={setSelectedClientId} onCreate={createClient} onDelete={deleteClient} teamPin={data.settings?.teamPin || ""} />
            )}
            {tab === "metodo" && (
              <MetodoTab data={data} onChange={updateData} />
            )}
            {tab === "equipo" && (
              (!data.settings?.teamPin || teamUnlocked) ? (
                <TeamTab data={data} onChange={updateData} />
              ) : (
                <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", minHeight:340, gap:14 }}>
                  <div style={{ fontSize:32 }}>🔒</div>
                  <div style={{ color:WHITE, fontSize:16, fontWeight:700 }}>Área privada</div>
                  <div style={{ color:GRAY, fontSize:13 }}>Ingresá el PIN para acceder a Equipo y Roles</div>
                  <input
                    type="password"
                    value={teamPinInput}
                    onChange={e=>{ setTeamPinInput(e.target.value); setTeamPinError(false); }}
                    onKeyDown={e=>{
                      if (e.key==="Enter") {
                        if (teamPinInput === data.settings.teamPin) { setTeamUnlocked(true); setTeamPinInput(""); }
                        else { setTeamPinError(true); setTeamPinInput(""); }
                      }
                    }}
                    placeholder="PIN"
                    style={{ background:"#111113", border:`2px solid ${teamPinError?"#EF4444":BORDER}`, borderRadius:10, padding:"12px 20px", color:WHITE, fontSize:18, textAlign:"center", outline:"none", width:180, letterSpacing:8 }}
                  />
                  {teamPinError && <div style={{ color:"#EF4444", fontSize:12 }}>PIN incorrecto</div>}
                  <button
                    onClick={()=>{
                      if (teamPinInput === data.settings.teamPin) { setTeamUnlocked(true); setTeamPinInput(""); }
                      else { setTeamPinError(true); setTeamPinInput(""); }
                    }}
                    style={{ padding:"10px 32px", background:GOLD, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:14 }}>
                    Acceder
                  </button>
                </div>
              )
            )}
            {tab === "personal" && (
              <PersonalTab data={data} onChange={updateData} />
            )}
            {tab === "configuracion" && (
              <SettingsTab data={data} onChange={updateData} />
            )}
          </>
        )}
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MetodoGrowthPartner />);
  </script>
</body>
</html>
