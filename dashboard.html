function TaskRow({ task, team, onToggle, onAssign, onDelete, onUrgent }) {
  const badge = ROLE_BADGE[task.owner] || { color:"#D4AF37", bg:"rgba(212,175,55,0.08)", border:"rgba(212,175,55,0.4)" };
  return (
    <div style={{
      display:"flex", alignItems:"center", gap:8, padding:"8px 10px", borderRadius:8, marginBottom:4,
      background: task.urgent ? "rgba(239,68,68,0.04)" : task.done ? "rgba(76,175,125,0.05)" : "transparent",
      border:`1px solid ${task.urgent ? "rgba(239,68,68,0.3)" : task.done ? "rgba(76,175,125,0.2)" : BORDER}`,
      opacity: task.done ? 0.6 : 1,
      transition:"all 0.15s",
    }}>
      <input type="checkbox" checked={task.done} onChange={()=>onToggle(task.id)}
        style={{ accentColor:GOLD, width:15, height:15, cursor:"pointer", flexShrink:0 }} />
      <button onClick={()=>onUrgent && onUrgent(task.id)} title={task.urgent?"Quitar prioridad":"Marcar como prioritaria"}
        style={{ background:"none", border:"none", cursor:"pointer", fontSize:13, padding:"0 1px", flexShrink:0, opacity: task.urgent ? 1 : 0.25, transition:"opacity 0.15s" }}>⚡</button>
      <span style={{ fontFamily:"monospace", fontSize:10, color:GRAY, minWidth:24, flexShrink:0 }}>#{task.n}</span>
      <span style={{ flex:1, fontSize:12, color:WHITE, textDecoration:task.done?"line-through":"none", lineHeight:1.4 }}>{task.title}</span>
      <span style={{
        fontSize:10, padding:"2px 6px", borderRadius:4, flexShrink:0,
        border:`1px solid ${badge.border}`,
        color: badge.color,
        background: badge.bg,
      }}>{task.owner}</span>
      <select value={task.assigneeId||""} onChange={e=>onAssign(task.id, e.target.value)}
        style={{ background:"#111113", border:`1px solid ${BORDER}`, borderRadius:6, padding:"3px 6px", color:GRAY, fontSize:11, outline:"none", maxWidth:90 }}>
        <option value="">--</option>
        {team.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
      </select>
      <button onClick={()=>onDelete(task.id)}
        style={{ background:"none", border:"none", color:GRAY, cursor:"pointer", fontSize:14, padding:"0 2px", flexShrink:0 }}>×</button>
    </div>
  );
}

// ─── FLOW CANVAS ──────────────────────────────────────────────────────────────
function FlowCanvas({ flow, clientName, clientProfile, clientTasks, onUpdate, apiKey }) {
  const outerRef = useRef(null);
  const [pan, setPan] = useState({ x:0, y:0 });
  const [zoom, setZoom] = useState(1);
  const [isPanning, setIsPanning] = useState(false);
  const [panStart, setPanStart] = useState(null);
  const [dragState, setDragState] = useState(null);
  const [connectMode, setConnectMode] = useState(false);
  const [connectFrom, setConnectFrom] = useState(null);
  const [editingNodeId, setEditingNodeId] = useState(null);
  const [editingEdgeId, setEditingEdgeId] = useState(null);
  const [snapGrid, setSnapGrid] = useState(false);
  const [showAnalysis, setShowAnalysis] = useState(false);
  const [aiResult, setAiResult] = useState(null);
  const [aiLoading, setAiLoading] = useState(false);
  const [aiError, setAiError] = useState(null);
  const [selectedIds, setSelectedIds] = useState(new Set());
  const [selectionRect, setSelectionRect] = useState(null);
  const [toolMode, setToolMode] = useState("select");
  const [selectedEdgeId, setSelectedEdgeId] = useState(null);
  const spacePanning = useRef(false);
  const importInputRef = useRef(null);
  const [history, setHistory] = useState([]);
  const [isFullscreen, setIsFullscreen] = useState(false);
  const [clipboard, setClipboard] = useState(null); // {nodes: [], edges: []}
  const [nodeSearch, setNodeSearch] = useState("");
  const [importLoading, setImportLoading] = useState(false);
  const [importError, setImportError] = useState(null);
  const [importPreview, setImportPreview] = useState(null);
  const [importPreviewEditing, setImportPreviewEditing] = useState([]);

  const NODE_COLORS = [
    { label:"Default",   bg:null },
    // Pasteles
    { label:"Blanco",    bg:"#FFFFFF" },
    { label:"Crema",     bg:"#FFFBEB" },
    { label:"Azul claro",bg:"#EFF6FF" },
    { label:"Verde claro",bg:"#ECFDF5" },
    { label:"Rosa claro",bg:"#FFF1F2" },
    { label:"Morado cl.",bg:"#F5F3FF" },
    // Vivos
    { label:"Amarillo",  bg:"#FACC15" },
    { label:"Naranja",   bg:"#F97316" },
    { label:"Rojo",      bg:"#EF4444" },
    { label:"Rosa",      bg:"#EC4899" },
    { label:"Morado",    bg:"#8B5CF6" },
    { label:"Azul",      bg:"#3B82F6" },
    { label:"Cyan",      bg:"#06B6D4" },
    { label:"Verde",     bg:"#22C55E" },
    { label:"Lima",      bg:"#84CC16" },
    // Oscuros
    { label:"Carbón",    bg:"#1E1E2E" },
    { label:"Navy",      bg:"#1E3A5F" },
    { label:"Bosque",    bg:"#14532D" },
  ];

  const nodes = Array.isArray(flow.nodes) ? flow.nodes : [];
  const edges = Array.isArray(flow.edges) ? flow.edges : [];

  const snap = (v) => snapGrid ? Math.round(v/20)*20 : v;

  const canvasPoint = (e) => {
    const rect = outerRef.current.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left - pan.x) / zoom,
      y: (e.clientY - rect.top - pan.y) / zoom,
    };
  };

  const saveHistory = useCallback((f) => {
    setHistory(h => [...h.slice(-20), JSON.stringify(f)]);
  }, []);

  const update = (f) => { saveHistory(flow); onUpdate(f); };

  // Wheel zoom
  useEffect(() => {
    const el = outerRef.current;
    if (!el) return;
    const handler = (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.1 : 0.1;
      setZoom(z => Math.min(2, Math.max(0.3, +(z + delta).toFixed(1))));
    };
    el.addEventListener("wheel", handler, { passive: false });
    return () => el.removeEventListener("wheel", handler);
  }, []);

  const onOuterPointerDown = (e) => {
    setSelectedEdgeId(null);
    if (e.button === 1) {
      e.preventDefault();
      setPanStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
      setIsPanning(true);
      return;
    }
    if (e.button !== 0) return;
    if (toolMode === "pan") {
      e.preventDefault();
      setPanStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
      setIsPanning(true);
    } else {
      const pt = canvasPoint(e);
      setSelectionRect({ x1: pt.x, y1: pt.y, x2: pt.x, y2: pt.y });
      setDragState({ type:"rubber" });
      if (!e.shiftKey) setSelectedIds(new Set());
    }
  };
  const onOuterPointerMove = (e) => {
    if (isPanning && panStart) {
      setPan({ x: e.clientX - panStart.x, y: e.clientY - panStart.y });
    }
    if (dragState?.type === "rubber") {
      const pt = canvasPoint(e);
      setSelectionRect(r => r ? { ...r, x2: pt.x, y2: pt.y } : r);
    }
    if (dragState?.type === "nodes") {
      const pt = canvasPoint(e);
      const newNodes = nodes.map(n => {
        const off = dragState.offsets.find(o=>o.id===n.id);
        if (!off) return n;
        return { ...n, x: snap(pt.x - off.ox), y: snap(pt.y - off.oy) };
      });
      onUpdate({ ...flow, nodes: newNodes });
    }
  };
  const onOuterPointerUp = () => {
    setIsPanning(false);
    if (dragState?.type === "rubber" && selectionRect) {
      const rx1 = Math.min(selectionRect.x1, selectionRect.x2);
      const ry1 = Math.min(selectionRect.y1, selectionRect.y2);
      const rx2 = Math.max(selectionRect.x1, selectionRect.x2);
      const ry2 = Math.max(selectionRect.y1, selectionRect.y2);
      const selected = nodes.filter(n => {
        const nw = n.w || 180, nh = 80;
        return n.x < rx2 && n.x + nw > rx1 && n.y < ry2 && n.y + nh > ry1;
      });
      if (selected.length > 0) {
        setSelectedIds(prev => {
          const next = new Set(prev);
          selected.forEach(n => next.add(n.id));
          return next;
        });
      }
      setSelectionRect(null);
    }
    setDragState(null);
  };

  const addNode = (type) => {
    const cfg = NODE_TYPES[type] || NODE_TYPES.speech;
    const newNode = {
      id: uid(), type, text: cfg.label,
      x: snap(200 - pan.x/zoom + Math.random()*40),
      y: snap(120 - pan.y/zoom + Math.random()*40),
      ...(cfg.defaultShape ? { shape: cfg.defaultShape } : {}),
    };
    update({ ...flow, nodes: [...nodes, newNode] });
  };

  const onNodePointerDown = (e, nodeId) => {
    e.stopPropagation();
    if (connectMode) {
      if (!connectFrom) { setConnectFrom(nodeId); return; }
      if (connectFrom !== nodeId) {
        update({ ...flow, edges: [...edges, { id:uid(), from:connectFrom, to:nodeId, label:"" }] });
      }
      setConnectFrom(null);
      setConnectMode(false);
      return;
    }
    let newSelectedIds;
    if (e.shiftKey) {
      newSelectedIds = new Set(selectedIds);
      if (newSelectedIds.has(nodeId)) newSelectedIds.delete(nodeId);
      else newSelectedIds.add(nodeId);
    } else if (!selectedIds.has(nodeId)) {
      newSelectedIds = new Set([nodeId]);
    } else {
      newSelectedIds = new Set(selectedIds);
    }
    setSelectedIds(newSelectedIds);
    setSelectedEdgeId(null);
    const dragIds = new Set(newSelectedIds);
    dragIds.add(nodeId);
    const pt = canvasPoint(e);
    const offsets = [...dragIds].map(id => {
      const n = nodes.find(x=>x.id===id);
      return { id, ox: pt.x - (n?.x||0), oy: pt.y - (n?.y||0) };
    });
    setDragState({ type:"nodes", offsets });
  };

  const updateNodeProp = (id, patch) => {
    update({ ...flow, nodes: nodes.map(n => n.id===id ? {...n,...patch} : n) });
  };

  const deleteNode = (id) => {
    update({ ...flow, nodes: nodes.filter(n=>n.id!==id), edges: edges.filter(e=>e.from!==id&&e.to!==id) });
    setSelectedIds(prev => { const next = new Set(prev); next.delete(id); return next; });
  };

  const deleteEdge = (id) => { update({ ...flow, edges: edges.filter(e=>e.id!==id) }); };

  const undo = () => {
    if (!history.length) return;
    const prev = JSON.parse(history[history.length-1]);
    setHistory(h => h.slice(0,-1));
    onUpdate(prev);
  };

  // Port-based connection points — exits from the correct edge of each node
  const getPortPt = (nodeId, otherId) => {
    const n = nodes.find(x=>x.id===nodeId);
    const o = nodes.find(x=>x.id===otherId);
    if (!n) return null;
    const cfg = NODE_TYPES[n.type] || NODE_TYPES.speech;
    if (cfg.swimlane) {
      return { x: n.x + (n.w||cfg.defaultW||680)/2, y: n.y + (n.h||cfg.defaultH||200)/2, side:"center" };
    }
    const nw = n.w || 180;
    const nh = 56 + Math.ceil(((n.text||"").length / 22)) * 17;
    const cx = n.x + nw / 2;
    const cy = n.y + nh / 2;
    if (n.shape === "circle") {
      if (!o) return { x: cx, y: cy, side:"bottom" };
      const ow = o.w||180, oh = 60;
      const angle = Math.atan2((o.y+oh/2)-cy, (o.x+ow/2)-cx);
      return { x: cx + Math.cos(angle)*60, y: cy + Math.sin(angle)*60, side:"edge" };
    }
    if (!o) return { x: cx, y: n.y + nh, side:"bottom" };
    const ow = o.w||180, oh = 60;
    const ocx = o.x + ow/2, ocy = o.y + oh/2;
    const dx = ocx - cx, dy = ocy - cy;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if (adx > ady * 1.4) {
      return dx > 0 ? { x: n.x + nw, y: cy, side:"right" } : { x: n.x, y: cy, side:"left" };
    }
    return dy > 0 ? { x: cx, y: n.y + nh, side:"bottom" } : { x: cx, y: n.y, side:"top" };
  };
  // Compat shim for any callers still using getNodeCenter
  const getNodeCenter = (id) => getPortPt(id, null);

  const getShapeStyle = (shape) => {
    switch(shape) {
      case "rounded":       return { borderRadius: 28 };
      case "pill":          return { borderRadius: 100 };
      case "circle":        return { borderRadius:"50%", width:120, minHeight:120, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center" };
      case "diamond":       return { clipPath:"polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)", minHeight:120, width:180, border:"none" };
      case "hexagon":       return { clipPath:"polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%)", minHeight:100, border:"none" };
      case "parallelogram": return { clipPath:"polygon(12% 0%, 100% 0%, 88% 100%, 0% 100%)", minHeight:70, border:"none" };
      default:              return { borderRadius: 10 };
    }
  };

  // Keyboard shortcuts
  useEffect(() => {
    const handler = (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      // Ctrl+C — copy selected nodes
      if ((e.ctrlKey || e.metaKey) && e.key === "c") {
        if (selectedIds.size > 0) {
          const copiedNodes = nodes.filter(n=>selectedIds.has(n.id));
          const copiedEdges = edges.filter(ed=>selectedIds.has(ed.from)&&selectedIds.has(ed.to));
          setClipboard({ nodes:copiedNodes, edges:copiedEdges });
        }
        return;
      }
      // Ctrl+V — paste at +40,+40 offset
      if ((e.ctrlKey || e.metaKey) && e.key === "v") {
        if (clipboard) {
          const idMap = {};
          const newNodes = clipboard.nodes.map(n => {
            const newId = uid();
            idMap[n.id] = newId;
            return { ...n, id:newId, x:n.x+40, y:n.y+40 };
          });
          const newEdges = clipboard.edges.map(ed => ({
            ...ed, id:uid(), from:idMap[ed.from]||ed.from, to:idMap[ed.to]||ed.to
          }));
          update({ ...flow, nodes:[...nodes,...newNodes], edges:[...edges,...newEdges] });
          setSelectedIds(new Set(newNodes.map(n=>n.id)));
        }
        return;
      }
      // Ctrl+D — duplicate selected
      if ((e.ctrlKey || e.metaKey) && e.key === "d") {
        e.preventDefault();
        if (selectedIds.size > 0) {
          const toDup = nodes.filter(n=>selectedIds.has(n.id));
          const idMap = {};
          const newNodes = toDup.map(n=>{ const newId=uid(); idMap[n.id]=newId; return {...n,id:newId,x:n.x+40,y:n.y+40}; });
          const newEdges = edges.filter(ed=>selectedIds.has(ed.from)&&selectedIds.has(ed.to)).map(ed=>({...ed,id:uid(),from:idMap[ed.from],to:idMap[ed.to]}));
          update({ ...flow, nodes:[...nodes,...newNodes], edges:[...edges,...newEdges] });
          setSelectedIds(new Set(newNodes.map(n=>n.id)));
        }
        return;
      }
      if (e.key === "Delete" || e.key === "Backspace") {
        if (selectedIds.size > 0) {
          const ids = selectedIds;
          update({
            ...flow,
            nodes: nodes.filter(n=>!ids.has(n.id)),
            edges: edges.filter(ed=>!ids.has(ed.from)&&!ids.has(ed.to))
          });
          setSelectedIds(new Set());
        } else if (selectedEdgeId) {
          update({ ...flow, edges: edges.filter(ed=>ed.id!==selectedEdgeId) });
          setSelectedEdgeId(null);
        }
      }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [selectedIds, selectedEdgeId, nodes, edges, flow, clipboard]);

  // Space key = temporary pan mode
  useEffect(() => {
    const onDown = (e) => {
      if (e.code !== "Space" || e.repeat) return;
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      e.preventDefault();
      spacePanning.current = true;
      setToolMode("pan");
    };
    const onUp = (e) => {
      if (e.code !== "Space") return;
      if (spacePanning.current) {
        spacePanning.current = false;
        setToolMode("select");
      }
    };
    window.addEventListener("keydown", onDown);
    window.addEventListener("keyup", onUp);
    return () => { window.removeEventListener("keydown", onDown); window.removeEventListener("keyup", onUp); };
  }, []);

  // Analysis block
  const buildAnalysis = () => {
    const lines = [];
    lines.push(`═══════════════════════════════════════════`);
    lines.push(`ANÁLISIS DE PROCESO COMERCIAL — ${clientName}`);
    lines.push(`═══════════════════════════════════════════`);
    lines.push(``);
    lines.push(`DATOS DEL CLIENTE:`);
    lines.push(`  Canal de adquisición: ${clientProfile.channel||"—"}`);
    lines.push(`  Valor de contrato: ${clientProfile.contractValue||"—"}`);
    lines.push(`  Fecha inicio: ${clientProfile.startDate||"—"}`);
    if (clientProfile.notes) lines.push(`  Notas: ${clientProfile.notes}`);
    lines.push(``);
    lines.push(`PROGRESO GROWTH PARTNER AI:`);
    WEEKS.forEach(w => {
      const s = weekStats(clientTasks, w);
      lines.push(`  ${w}: ${s.done}/${s.total} tareas completadas (${s.total ? Math.round(s.done/s.total*100) : 0}%)`);
    });
    lines.push(``);
    lines.push(`PROCESO: ${flow.name}`);
    lines.push(`  Nodos: ${nodes.length}  |  Conexiones: ${edges.length}`);
    lines.push(``);
    if (!nodes.length) { lines.push("  (Canvas vacío — aún no se han definido pasos)"); }
    else {
      lines.push(`NODOS:`);
      nodes.forEach((n,i) => {
        lines.push(`  ${i+1}. [${NODE_TYPES[n.type]?.label||n.type}] ${n.text}`);
      });
      lines.push(``);
      lines.push(`CONEXIONES:`);
      if (!edges.length) { lines.push("  (Sin conexiones definidas)"); }
      else {
        edges.forEach(e => {
          const f = nodes.find(n=>n.id===e.from);
          const t = nodes.find(n=>n.id===e.to);
          lines.push(`  ${f?.text||"?"} --> ${t?.text||"?"} ${e.label ? `[${e.label}]` : ""}`);
        });
      }
      // Flag orphans
      const connected = new Set([...edges.map(e=>e.from), ...edges.map(e=>e.to)]);
      const orphans = nodes.filter(n=>!connected.has(n.id));
      if (orphans.length) {
        lines.push(``);
        lines.push(`ALERTAS:`);
        orphans.forEach(n => lines.push(`  ⚠ Nodo huérfano (sin conexiones): "${n.text}"`));
      }
      const decisions = nodes.filter(n=>n.type==="decision");
      decisions.forEach(d => {
        const outgoing = edges.filter(e=>e.from===d.id);
        if (outgoing.some(e=>!e.label)) lines.push(`  ⚠ Decisión sin etiqueta en ramas: "${d.text}"`);
      });
    }
    lines.push(``);
    lines.push(`═══════════════════════════════════════════`);
    lines.push(`Pega este bloque en Claude para obtener retroalimentación`);
    lines.push(`detallada del proceso comercial.`);
    lines.push(`═══════════════════════════════════════════`);
    return lines.join("\n");
  };

  const analysisText = showAnalysis ? buildAnalysis() : "";

  const handleImportImage = (e) => {
    const file = e.target.files[0];
    if (!file || !apiKey) return;
    setImportLoading(true);
    setImportError(null);
    setImportPreview(null);
    const reader = new FileReader();
    reader.onload = async (ev) => {
      const base64 = ev.target.result.split(",")[1];
      const mediaType = file.type || "image/png";
      try {
        const res = await fetch("https://api.anthropic.com/v1/messages", {
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "x-api-key": apiKey,
            "anthropic-version":"2023-06-01",
            "anthropic-dangerous-direct-browser-access":"true",
          },
          body: JSON.stringify({
            model:"claude-sonnet-4-6",
            max_tokens:4096,
            messages:[{
              role:"user",
              content:[
                { type:"image", source:{ type:"base64", media_type:mediaType, data:base64 } },
                { type:"text", text:`Analizá este diagrama de flujo y extraé todos los nodos y conexiones en JSON.

Devolvé ÚNICAMENTE un objeto JSON válido sin texto extra ni bloques de código:
{
  "nodes": [
    { "id": "1", "type": "speech", "text": "texto del nodo", "x": 100, "y": 100 }
  ],
  "edges": [
    { "id": "e1", "from": "1", "to": "2", "label": "" }
  ]
}

Tipos de nodo disponibles:
- "bpmn_start": evento de inicio del flujo (círculo verde)
- "bpmn_end": evento de fin (círculo rojo)
- "decision": rombo de decisión / pregunta con bifurcación
- "accion": acción, tarea o paso del proceso
- "alerta": alerta, objeción o punto de atención
- "speech": mensaje, texto o paso genérico

Posiciones x (50–1200), y (50–2000). Mantené el layout visual original. Mínimo 150px vertical entre nodos, 200px horizontal entre columnas.
Edges: label "Sí", "No" o "" si no tiene texto.
Extraé TODOS los nodos visibles. Texto máx 100 caracteres.` }
              ]
            }]
          }),
        });
        const json = await res.json();
        if (json.error) throw new Error(json.error.message);
        const content = (json.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
        const jsonMatch = content.match(/\{[\s\S]*\}/);
        if (!jsonMatch) throw new Error("No se pudo extraer el diagrama.");
        const parsed = JSON.parse(jsonMatch[0]);
        if (!parsed.nodes || !Array.isArray(parsed.nodes)) throw new Error("Formato inválido.");
        setImportPreview(parsed);
        setImportPreviewEditing(parsed.nodes.map(n=>({...n})));
      } catch(e) {
        setImportError("Error: " + (e.message || "verificá tu API key."));
      } finally {
        setImportLoading(false);
        e.target.value = "";
      }
    };
    reader.readAsDataURL(file);
  };

  const confirmImport = () => {
    if (!importPreview) return;
    const idMap = {};
    const newNodes = importPreviewEditing.map(n => {
      const newId = uid();
      idMap[n.id] = newId;
      return {
        id: newId,
        type: NODE_TYPES[n.type] ? n.type : "speech",
        text: n.text || "",
        x: Math.max(50, Math.min(1200, Number(n.x) || 100)),
        y: Math.max(50, Math.min(2000, Number(n.y) || 100)),
      };
    });
    const newEdges = (importPreview.edges||[]).map(e=>({
      id: uid(),
      from: idMap[e.from] || e.from,
      to: idMap[e.to] || e.to,
      label: e.label || "",
    })).filter(e=>e.from && e.to);
    const offsetY = nodes.length > 0 ? Math.max(...nodes.map(n=>n.y)) + 120 : 0;
    const shifted = newNodes.map(n=>({...n, y: n.y + offsetY}));
    update({ ...flow, nodes:[...nodes,...shifted], edges:[...edges,...newEdges] });
    setImportPreview(null);
    setImportPreviewEditing([]);
  };

  const runAiAnalysis = async () => {
    if (!apiKey) return;
    setAiLoading(true);
    setAiError(null);
    setAiResult(null);
    setShowAnalysis(true);
    const text = buildAnalysis();
    const prompt = `Eres un consultor senior en procesos comerciales para agencias de adquisición de clientes (Meta Ads + CRM + agentes IA, mercado LATAM). Analiza el siguiente proceso comercial del cliente y devuelve un análisis en español colombiano directo, sin rodeos, estructurado exactamente así:

FORTALEZAS: (máx 2, una línea cada una)
CUELLOS DE BOTELLA: (dónde se muere la conversión y por qué)
LO QUE FALTA: (pasos, objeciones no cubiertas, seguimientos ausentes, ramas de decisión incompletas)
CAMBIO DE MAYOR IMPACTO: (una sola acción concreta, la más importante)

Sé específico con los textos reales de los nodos. Máximo 250 palabras.

${text}`;
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "x-api-key": apiKey,
          "anthropic-version":"2023-06-01",
          "anthropic-dangerous-direct-browser-access":"true",
        },
        body: JSON.stringify({
          model:"claude-sonnet-4-6",
          max_tokens:1024,
          messages:[{ role:"user", content: prompt }]
        }),
      });
      const json = await res.json();
      if (json.error) throw new Error(json.error.message);
      const content = (json.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
      setAiResult(content);
    } catch(e) {
      setAiError("Error al conectar con Claude: " + (e.message || "verifica tu API key en Configuración."));
    } finally {
      setAiLoading(false);
    }
  };

  const wrapperStyle = isFullscreen ? {
    position:"fixed", inset:0, zIndex:9999, background:BG,
    display:"flex", flexDirection:"column", padding:12,
  } : { display:"flex", flexDirection:"column", height:"100%" };

  const _pn = selectedIds.size === 1 ? (nodes.find(n => n.id === [...selectedIds][0]) || null) : null;
  const _pc = _pn ? (NODE_TYPES[_pn.type] || NODE_TYPES.speech) : null;

  return (
    <div style={wrapperStyle}>
      {/* Import preview modal */}
      {importPreview && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.75)", zIndex:10000, display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
          <div style={{ background:"#1A1A1D", border:`1px solid ${BORDER}`, borderRadius:12, padding:24, width:"100%", maxWidth:640, maxHeight:"82vh", overflow:"auto", display:"flex", flexDirection:"column", gap:0 }}>
            <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", marginBottom:14 }}>
              <div>
                <div style={{ color:WHITE, fontWeight:700, fontSize:16 }}>📷 Diagrama detectado</div>
                <div style={{ color:GRAY, fontSize:12, marginTop:3 }}>
                  {importPreviewEditing.length} nodos · {importPreview.edges?.length || 0} conexiones — Revisá y editá los textos antes de cargar al canvas
                </div>
              </div>
              <button onClick={()=>{ setImportPreview(null); setImportPreviewEditing([]); }}
                style={{ background:"none", border:"none", color:GRAY, cursor:"pointer", fontSize:22, lineHeight:1, padding:0, marginLeft:12 }}>✕</button>
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:7, marginBottom:16 }}>
              {importPreviewEditing.map((n, i) => {
                const cfg = NODE_TYPES[n.type] || NODE_TYPES.speech;
                return (
                  <div key={n.id} style={{ display:"flex", alignItems:"center", gap:8 }}>
                    <span style={{ color:GRAY, fontSize:11, minWidth:22, textAlign:"right", flexShrink:0 }}>{i+1}.</span>
                    <span style={{ background:cfg.bg, color:cfg.color, border:`1px solid ${cfg.border}`, borderRadius:cfg.defaultShape==="circle"?20:6, padding:"3px 9px", fontSize:10, fontWeight:700, minWidth:82, textAlign:"center", flexShrink:0 }}>
                      {cfg.label}
                    </span>
                    <input
                      value={n.text}
                      onChange={e=>{ const c=[...importPreviewEditing]; c[i]={...c[i],text:e.target.value}; setImportPreviewEditing(c); }}
                      style={{ flex:1, background:"#222225", border:`1px solid ${BORDER}`, borderRadius:6, padding:"5px 9px", color:WHITE, fontSize:12, outline:"none" }}
                    />
                    <select value={n.type} onChange={e=>{ const c=[...importPreviewEditing]; c[i]={...c[i],type:e.target.value}; setImportPreviewEditing(c); }}
                      style={{ background:"#222225", border:`1px solid ${BORDER}`, borderRadius:6, color:GRAY, fontSize:11, padding:"4px 6px", cursor:"pointer" }}>
                      {Object.entries(NODE_TYPES).filter(([,cfg])=>!cfg.swimlane).map(([t,cfg])=>(
                        <option key={t} value={t}>{cfg.label}</option>
                      ))}
                    </select>
                  </div>
                );
              })}
            </div>
            {importPreview.edges && importPreview.edges.length > 0 && (
              <div style={{ marginBottom:16 }}>
                <div style={{ color:GRAY, fontSize:11, marginBottom:6, fontWeight:600 }}>CONEXIONES DETECTADAS</div>
                <div style={{ display:"flex", flexWrap:"wrap", gap:4 }}>
                  {importPreview.edges.map((e,i)=>(
                    <span key={i} style={{ background:"#222225", border:`1px solid ${BORDER}`, borderRadius:4, padding:"2px 7px", fontSize:10, color:GRAY }}>
                      {e.from}→{e.to}{e.label ? ` · ${e.label}` : ""}
                    </span>
                  ))}
                </div>
              </div>
            )}
            <div style={{ display:"flex", gap:8, justifyContent:"flex-end", paddingTop:4 }}>
              <button onClick={()=>{ setImportPreview(null); setImportPreviewEditing([]); }}
                style={{ padding:"8px 18px", borderRadius:7, fontSize:13, cursor:"pointer", background:"#222225", color:WHITE, border:`1px solid ${BORDER}` }}>
                Cancelar
              </button>
              <button onClick={confirmImport}
                style={{ padding:"8px 22px", borderRadius:7, fontSize:13, cursor:"pointer", background:GOLD, color:"#141414", border:"none", fontWeight:700 }}>
                Cargar al canvas →
              </button>
            </div>
          </div>
        </div>
      )}
      {/* Toolbar */}
      <div style={{ display:"flex", flexWrap:"wrap", gap:6, padding:"8px 0", borderBottom:`1px solid ${BORDER}`, marginBottom:8 }}>
        {Object.entries(NODE_TYPES).filter(([,cfg])=>!cfg.bpmn).map(([type, cfg]) => (
          <button key={type} onClick={()=>addNode(type)}
            style={{ padding:"4px 10px", borderRadius:6, fontSize:11, cursor:"pointer", background:cfg.bg, color:cfg.color, border:`1px solid ${cfg.border}`, fontWeight:500 }}>
            + {cfg.label}
          </button>
        ))}
        <div style={{ width:1, background:BORDER, margin:"0 4px" }} />
        <span style={{ fontSize:10, color:GOLD_DIM, fontWeight:700, alignSelf:"center", letterSpacing:0.5 }}>BPMN</span>
        {Object.entries(NODE_TYPES).filter(([,cfg])=>cfg.bpmn||cfg.swimlane).map(([type, cfg]) => (
          <button key={type} onClick={()=>addNode(type)}
            style={{ padding:"4px 10px", borderRadius: cfg.defaultShape==="circle"?20:6, fontSize:11, cursor:"pointer", background:cfg.bg, color:cfg.color, border:`${cfg.thick?2:1}px solid ${cfg.border}`, fontWeight:600 }}>
            + {cfg.label}
          </button>
        ))}
        <div style={{ width:1, background:BORDER, margin:"0 4px" }} />
        <button onClick={()=>setToolMode("select")}
          title="Seleccionar y rubber band (S)"
          style={{ padding:"4px 11px", borderRadius:6, fontSize:12, cursor:"pointer", fontWeight:700,
            background: toolMode==="select" ? GOLD : "#222225",
            color: toolMode==="select" ? "#141414" : GRAY,
            border:`2px solid ${toolMode==="select" ? GOLD : BORDER}` }}>
          ↖
        </button>
        <button onClick={()=>setToolMode("pan")}
          title="Mover canvas (H · mantén Espacio)"
          style={{ padding:"4px 11px", borderRadius:6, fontSize:12, cursor:"pointer", fontWeight:700,
            background: toolMode==="pan" ? "#60A5FA" : "#222225",
            color: toolMode==="pan" ? "#141414" : GRAY,
            border:`2px solid ${toolMode==="pan" ? "#60A5FA" : BORDER}` }}>
          ✋
        </button>
        <button onClick={()=>{ setConnectMode(c=>!c); setConnectFrom(null); }}
          style={{ padding:"4px 10px", borderRadius:6, fontSize:11, cursor:"pointer", background: connectMode ? GOLD : "#222225", color: connectMode ? "#141414" : WHITE, border:`1px solid ${connectMode ? GOLD : BORDER}` }}>
          {connectFrom ? "Selecciona destino..." : "Conectar"}
        </button>
        <button onClick={undo} style={{ padding:"4px 10px", borderRadius:6, fontSize:11, cursor:"pointer", background:"#222225", color:WHITE, border:`1px solid ${BORDER}` }}>Deshacer</button>
        <button onClick={()=>setSnapGrid(s=>!s)}
          style={{ padding:"4px 10px", borderRadius:6, fontSize:11, cursor:"pointer", background: snapGrid ? GOLD_DIM : "#222225", color: snapGrid ? WHITE : GRAY, border:`1px solid ${BORDER}` }}>
          Grid {snapGrid?"ON":"OFF"}
        </button>
        <div style={{ width:1, background:BORDER, margin:"0 4px" }} />
        <button onClick={()=>setZoom(z=>Math.min(2,+(z+0.1).toFixed(1)))} style={{ padding:"4px 8px", borderRadius:6, fontSize:11, cursor:"pointer", background:"#222225", color:WHITE, border:`1px solid ${BORDER}` }}>+</button>
        <span style={{ fontSize:11, color:GRAY, alignSelf:"center", minWidth:36, textAlign:"center" }}>{Math.round(zoom*100)}%</span>
        <button onClick={()=>setZoom(z=>Math.max(0.3,+(z-0.1).toFixed(1)))} style={{ padding:"4px 8px", borderRadius:6, fontSize:11, cursor:"pointer", background:"#222225", color:WHITE, border:`1px solid ${BORDER}` }}>−</button>
        <button onClick={()=>{ setZoom(1); setPan({x:0,y:0}); }}
          style={{ padding:"4px 10px", borderRadius:6, fontSize:11, cursor:"pointer", background:"#222225", color:WHITE, border:`1px solid ${BORDER}` }}>Reset</button>
        <input value={nodeSearch} onChange={e=>setNodeSearch(e.target.value)}
          placeholder="🔍 Buscar nodo..."
          onPointerDown={e=>e.stopPropagation()}
          style={{ padding:"4px 10px", borderRadius:6, fontSize:11, background:"#222225", border:`1px solid ${nodeSearch ? GOLD : BORDER}`, color:WHITE, outline:"none", width:140 }} />
        {nodeSearch && <button onClick={()=>setNodeSearch("")} style={{ padding:"4px 6px", fontSize:11, background:"none", border:"none", color:GRAY, cursor:"pointer" }}>✕</button>}
        <button onClick={()=>setIsFullscreen(f=>!f)}
          style={{ padding:"4px 10px", borderRadius:6, fontSize:11, cursor:"pointer", background: isFullscreen ? GOLD : "#222225", color: isFullscreen ? "#141414" : WHITE, border:`1px solid ${isFullscreen ? GOLD : BORDER}` }}>
          {isFullscreen ? "⊠ Salir" : "⛶ Pantalla completa"}
        </button>
        {clipboard && (
          <span style={{ fontSize:10, color:GRAY, padding:"0 4px" }}>📋 {clipboard.nodes.length} en clipboard</span>
        )}
        <div style={{ flex:1 }} />
        {apiKey && (
          <>
            <input ref={importInputRef} type="file" accept="image/*" style={{ display:"none" }} onChange={handleImportImage} />
            <button
              onClick={()=>importInputRef.current?.click()}
              disabled={importLoading}
              style={{ padding:"4px 12px", borderRadius:6, fontSize:12, cursor: importLoading ? "wait" : "pointer", background:"rgba(96,165,250,0.12)", color:"#60A5FA", border:"1px solid rgba(96,165,250,0.4)", fontWeight:600, opacity: importLoading ? 0.7 : 1 }}>
              {importLoading ? "Leyendo imagen…" : "📷 Importar imagen"}
            </button>
          </>
        )}
        {importError && (
          <span style={{ fontSize:11, color:"#EF4444", maxWidth:200 }}>{importError}</span>
        )}
        <button
          onClick={apiKey ? runAiAnalysis : ()=>setShowAnalysis(s=>!s)}
          disabled={aiLoading}
          style={{ padding:"4px 14px", borderRadius:6, fontSize:12, cursor: aiLoading ? "wait" : "pointer", background: showAnalysis ? GOLD : "rgba(212,175,55,0.12)", color: showAnalysis ? "#141414" : GOLD, border:`1px solid ${GOLD_DIM}`, fontWeight:600, opacity: aiLoading ? 0.7 : 1 }}>
          {aiLoading ? "Analizando…" : "✦ Analizar con IA"}
        </button>
      </div>

      {/* Node properties panel */}
      {_pn && _pc && (
        <div style={{ padding:"10px 14px", background:"#1A1A1D", border:`1px solid ${BORDER}`, borderRadius:8, marginBottom:6 }}>
          <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
            <span style={{ color:GRAY, fontSize:11, fontWeight:600, minWidth:50 }}>Color:</span>
            {/* Color swatches grid */}
            <div style={{ display:"flex", gap:4, alignItems:"center", flexWrap:"wrap", flex:1 }}>
              {NODE_COLORS.map(c => (
                <button key={c.label} title={c.label}
                  onClick={()=>updateNodeProp(_pn.id, { customBg: c.bg })}
                  style={{
                    width:20, height:20, borderRadius:4, cursor:"pointer",
                    background: c.bg || _pc.bg,
                    border: (_pn.customBg===c.bg) ? `2px solid ${GOLD}` : `1px solid rgba(0,0,0,0.3)`,
                    padding:0, flexShrink:0,
                  }}
                />
              ))}
              {/* Custom hex */}
              <input type="color" title="Color personalizado"
                value={_pn.customBg || "#ffffff"}
                onChange={e=>updateNodeProp(_pn.id, { customBg: e.target.value })}
                style={{ width:20, height:20, borderRadius:4, border:`1px solid ${BORDER}`, padding:0, cursor:"pointer", background:"none" }}
              />
            </div>
            <div style={{ width:1, background:BORDER, height:20 }} />
            {/* Bold toggle */}
            <button
              onClick={()=>updateNodeProp(_pn.id, { bold: !_pn.bold })}
              style={{ padding:"2px 10px", borderRadius:6, border:`1px solid ${_pn.bold ? GOLD : BORDER}`, background: _pn.bold ? "rgba(212,175,55,0.15)" : "transparent", color: _pn.bold ? GOLD : GRAY, fontWeight:700, fontSize:13, cursor:"pointer" }}>
              B
            </button>
            {/* Font size */}
            <input type="number" min={9} max={20} step={1}
              value={_pn.fontSize || 12}
              onChange={e=>updateNodeProp(_pn.id,{fontSize:Number(e.target.value)})}
              onPointerDown={e=>e.stopPropagation()}
              title="Tamaño de fuente"
              style={{ width:46, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:6, padding:"2px 5px", color:WHITE, fontSize:11, outline:"none", textAlign:"center" }} />
            {/* Text alignment */}
            {["left","center","right"].map(a => (
              <button key={a} title={a==="left"?"Izquierda":a==="center"?"Centro":"Derecha"}
                onClick={()=>updateNodeProp(_pn.id,{textAlign: (_pn.textAlign||"left")===a ? "left" : a})}
                style={{ padding:"2px 7px", borderRadius:6, fontSize:12, cursor:"pointer",
                  background: (_pn.textAlign||"left")===a ? "rgba(212,175,55,0.15)" : "transparent",
                  color: (_pn.textAlign||"left")===a ? GOLD : GRAY,
                  border:`1px solid ${(_pn.textAlign||"left")===a ? GOLD : BORDER}` }}>
                {a==="left"?"←":a==="center"?"≡":"→"}
              </button>
            ))}
            {/* Delete */}
            <button
              onClick={()=>{ deleteNode(_pn.id); setSelectedIds(new Set()); }}
              style={{ padding:"2px 10px", borderRadius:6, border:`1px solid ${RED}`, background:"transparent", color:RED, fontSize:11, cursor:"pointer", marginLeft:"auto" }}>
              Eliminar
            </button>
            <button onClick={()=>setSelectedIds(new Set())} style={{ padding:"2px 8px", borderRadius:6, border:`1px solid ${BORDER}`, background:"transparent", color:GRAY, fontSize:11, cursor:"pointer" }}>✕</button>
          </div>
          {/* Shape row */}
          <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:8 }}>
            <span style={{ color:GRAY, fontSize:11, fontWeight:600, minWidth:50 }}>Forma:</span>
            <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
              {[
                { id:"rectangle", label:"▭ Rect" },
                { id:"rounded",   label:"⬭ Redond" },
                { id:"pill",      label:"⬯ Pill" },
                { id:"circle",    label:"⬤ Círculo" },
                { id:"diamond",   label:"◆ Rombo" },
                { id:"hexagon",   label:"⬡ Hexag" },
                { id:"parallelogram", label:"▱ Paral" },
              ].map(sh => (
                <button key={sh.id}
                  onClick={()=>updateNodeProp(_pn.id, { shape: sh.id })}
                  style={{ padding:"2px 8px", borderRadius:5, fontSize:10, cursor:"pointer",
                    background: (_pn.shape||"rectangle")===sh.id ? GOLD : "#222225",
                    color: (_pn.shape||"rectangle")===sh.id ? "#141414" : GRAY,
                    border:`1px solid ${(_pn.shape||"rectangle")===sh.id ? GOLD : BORDER}` }}>
                  {sh.label}
                </button>
              ))}
            </div>
          </div>
          {/* Node width control (non-swimlane) */}
          {!_pc.swimlane && (
            <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:8 }}>
              <span style={{ color:GRAY, fontSize:11, fontWeight:600, minWidth:50 }}>Ancho:</span>
              <input type="range" min={100} max={400} step={10}
                value={_pn.w || 180}
                onChange={e=>updateNodeProp(_pn.id,{w:Number(e.target.value)})}
                onPointerDown={e=>e.stopPropagation()}
                style={{ flex:1, accentColor:GOLD, cursor:"pointer" }} />
              <span style={{ color:GRAY, fontSize:11, minWidth:30, textAlign:"right" }}>{_pn.w||180}px</span>
            </div>
          )}
          {/* Swimlane size controls */}
          {_pc.swimlane && (
            <div style={{ display:"flex", alignItems:"center", gap:10, marginTop:8 }}>
              <span style={{ color:GRAY, fontSize:11, fontWeight:600, minWidth:50 }}>Tamaño:</span>
              <span style={{ color:GRAY, fontSize:10 }}>Ancho</span>
              <input type="number" min={200} max={2000} step={20}
                value={_pn.w || _pc.defaultW || 680}
                onChange={e=>updateNodeProp(_pn.id,{w:Number(e.target.value)})}
                onPointerDown={e=>e.stopPropagation()}
                style={{ width:70, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:6, padding:"3px 6px", color:WHITE, fontSize:11, outline:"none" }} />
              <span style={{ color:GRAY, fontSize:10 }}>Alto</span>
              <input type="number" min={80} max={800} step={20}
                value={_pn.h || _pc.defaultH || 200}
                onChange={e=>updateNodeProp(_pn.id,{h:Number(e.target.value)})}
                onPointerDown={e=>e.stopPropagation()}
                style={{ width:70, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:6, padding:"3px 6px", color:WHITE, fontSize:11, outline:"none" }} />
            </div>
          )}
          {/* Badge tipo */}
          {!_pc.swimlane && (
            <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:8 }}>
              <span style={{ color:GRAY, fontSize:11, fontWeight:600, minWidth:50 }}>Tipo:</span>
              {[
                { id:"manual",   label:"✋ Manual",   color:"#60A5FA" },
                { id:"auto",     label:"⚡ Auto",     color:"#A78BFA" },
                { id:"critical", label:"🔴 Crítico",  color:"#EF4444" },
              ].map(b => (
                <button key={b.id} onClick={()=>updateNodeProp(_pn.id,{badge: _pn.badge===b.id ? null : b.id})}
                  style={{ padding:"2px 9px", borderRadius:10, fontSize:10, cursor:"pointer", fontWeight:600,
                    background: _pn.badge===b.id ? b.color+"22" : "#222225",
                    color: _pn.badge===b.id ? b.color : GRAY,
                    border:`1px solid ${_pn.badge===b.id ? b.color : BORDER}` }}>
                  {b.label}
                </button>
              ))}
            </div>
          )}
          {/* Text field */}
          <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:8 }}>
            <span style={{ color:GRAY, fontSize:11, fontWeight:600, minWidth:50 }}>Texto:</span>
            <textarea
              value={_pn.text || ""}
              onChange={e=>updateNodeProp(_pn.id, { text: e.target.value })}
              placeholder="Texto del nodo..."
              rows={2}
              onPointerDown={e=>e.stopPropagation()}
              style={{ flex:1, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:6, padding:"4px 8px", color:WHITE, fontSize:11, outline:"none", resize:"vertical", fontFamily:"inherit" }}
            />
          </div>
          {/* Link field */}
          <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:8 }}>
            <span style={{ color:GRAY, fontSize:11, fontWeight:600, minWidth:50 }}>Link:</span>
            <input
              value={_pn.link || ""}
              onChange={e=>updateNodeProp(_pn.id, { link: e.target.value })}
              placeholder="https://... (aparece como botón en el nodo)"
              style={{ flex:1, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:6, padding:"4px 8px", color:WHITE, fontSize:11, outline:"none" }}
            />
            {_pn.link && <a href={_pn.link} target="_blank" rel="noreferrer"
              style={{ padding:"3px 10px", borderRadius:6, background:GOLD, color:"#141414", fontSize:11, fontWeight:700, textDecoration:"none", flexShrink:0 }}>
              Abrir →
            </a>}
          </div>
        </div>
      )}

      {/* Edge properties panel */}
      {selectedEdgeId && (() => {
        const edge = edges.find(e=>e.id===selectedEdgeId);
        if (!edge) return null;
        const updateEdge = (patch) => update({ ...flow, edges: edges.map(e=>e.id===selectedEdgeId?{...e,...patch}:e) });
        return (
          <div style={{ padding:"10px 14px", background:"#1A1A1D", border:`1px solid ${GOLD_DIM}`, borderRadius:8, marginBottom:6 }}>
            <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
              <span style={{ color:GRAY, fontSize:11, fontWeight:600 }}>Conexión:</span>
              {[["bezier","~ Curva"],["straight","— Recta"],["step","⌐ Escala"]].map(([r,l])=>(
                <button key={r} onClick={()=>updateEdge({edgeRouting:r})}
                  style={{ padding:"2px 8px", borderRadius:5, fontSize:10, cursor:"pointer",
                    background:(edge.edgeRouting||"bezier")===r?GOLD:"#222225",
                    color:(edge.edgeRouting||"bezier")===r?"#141414":GRAY,
                    border:`1px solid ${(edge.edgeRouting||"bezier")===r?GOLD:BORDER}` }}>{l}</button>
              ))}
              <div style={{ width:1, background:BORDER, height:20 }} />
              {[["","━ Sólida"],["8,4","╌ Guiones"],["2,4","┄ Puntos"],["8,4,2,4","╍ Mixta"]].map(([d,l])=>(
                <button key={d} onClick={()=>updateEdge({edgeDash:d})}
                  style={{ padding:"2px 8px", borderRadius:5, fontSize:10, cursor:"pointer",
                    background:(edge.edgeDash||"")===d?GOLD_DIM:"#222225",
                    color:(edge.edgeDash||"")===d?WHITE:GRAY,
                    border:`1px solid ${(edge.edgeDash||"")===d?GOLD_DIM:BORDER}` }}>{l}</button>
              ))}
              <div style={{ width:1, background:BORDER, height:20 }} />
              {[[1.5,"Fina"],[2.5,"Media"],[4,"Gruesa"]].map(([w,l])=>(
                <button key={w} onClick={()=>updateEdge({edgeWidth:w})}
                  style={{ padding:"2px 8px", borderRadius:5, fontSize:10, cursor:"pointer",
                    background:(edge.edgeWidth||1.5)===w?GOLD_DIM:"#222225",
                    color:(edge.edgeWidth||1.5)===w?WHITE:GRAY,
                    border:`1px solid ${(edge.edgeWidth||1.5)===w?GOLD_DIM:BORDER}` }}>{l}</button>
              ))}
              <div style={{ width:1, background:BORDER, height:20 }} />
              <input type="color" value={edge.edgeColor||"#9B9B9F"} onChange={e=>updateEdge({edgeColor:e.target.value})}
                style={{ width:24, height:24, borderRadius:4, border:`1px solid ${BORDER}`, padding:0, cursor:"pointer" }} />
              <div style={{ width:1, background:BORDER, height:20 }} />
              {["Sí","No","Aprobado","Rechazado"].map(p=>(
                <button key={p} onClick={()=>updateEdge({label:p})}
                  style={{ padding:"2px 8px", borderRadius:10, fontSize:10, cursor:"pointer",
                    background: edge.label===p ? (p==="Sí"||p==="Aprobado") ? "rgba(76,175,125,0.2)" : "rgba(224,108,108,0.2)" : "#222225",
                    color: edge.label===p ? (p==="Sí"||p==="Aprobado") ? GREEN : RED : GRAY,
                    border:`1px solid ${edge.label===p ? (p==="Sí"||p==="Aprobado") ? GREEN : RED : BORDER}`,
                    fontWeight: edge.label===p ? 700 : 400 }}>{p}</button>
              ))}
              <input value={edge.label||""} onChange={e=>updateEdge({label:e.target.value})}
                placeholder="Etiqueta libre..."
                style={{ flex:1, minWidth:80, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:6, padding:"3px 8px", color:WHITE, fontSize:11, outline:"none" }} />
              <button onClick={()=>{ update({...flow, edges:edges.filter(e=>e.id!==selectedEdgeId)}); setSelectedEdgeId(null); }}
                style={{ padding:"2px 8px", borderRadius:5, fontSize:10, cursor:"pointer", border:`1px solid ${RED}`, color:RED, background:"transparent" }}>✕</button>
              <button onClick={()=>setSelectedEdgeId(null)}
                style={{ padding:"2px 8px", borderRadius:5, fontSize:10, cursor:"pointer", border:`1px solid ${BORDER}`, color:GRAY, background:"transparent" }}>Cerrar</button>
            </div>
          </div>
        );
      })()}

      {/* Canvas */}
      <div ref={outerRef}
        style={{ flex:1, position:"relative", overflow:"hidden", borderRadius:10, border:`1px solid ${BORDER}`, background:CANVAS_BG, cursor: isPanning ? "grabbing" : (toolMode==="pan" ? "grab" : "default"), minHeight:isFullscreen ? "calc(100vh - 120px)" : 420, userSelect:"none" }}
        onPointerDown={onOuterPointerDown}
        onPointerMove={onOuterPointerMove}
        onPointerUp={onOuterPointerUp}
        onPointerLeave={onOuterPointerUp}
      >
        {/* Dot grid */}
        <div style={{ position:"absolute", inset:0, backgroundImage:`radial-gradient(${CANVAS_DOT} 1px, transparent 1px)`, backgroundSize:"20px 20px", pointerEvents:"none" }} />

        <div style={{ position:"absolute", width:3200, height:2400, transform:`translate(${pan.x}px,${pan.y}px) scale(${zoom})`, transformOrigin:"0 0" }}>
          {/* Edges */}
          <svg style={{ position:"absolute", inset:0, width:"100%", height:"100%", overflow:"visible", pointerEvents:"none" }}>
            <defs>
              {edges.map(edge => (
                <marker key={edge.id} id={`arrow-${edge.id}`} markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                  <polygon points="0 0, 8 3, 0 6" fill={edge.edgeColor || "#9B9B9F"} />
                </marker>
              ))}
            </defs>
            {edges.map(edge => {
              const fc = getPortPt(edge.from, edge.to);
              const tc = getPortPt(edge.to, edge.from);
              if (!fc || !tc) return null;
              const mx = (fc.x+tc.x)/2, my = (fc.y+tc.y)/2;
              const col = edge.edgeColor || "#9B9B9F";
              const width = edge.edgeWidth || 1.5;
              const dash = edge.edgeDash || "";
              const isSelEdge = selectedEdgeId === edge.id;
              const routing = edge.edgeRouting || "bezier";
              let d;
              if (routing === "straight") {
                d = `M ${fc.x} ${fc.y} L ${tc.x} ${tc.y}`;
              } else if (routing === "step") {
                // Direction-aware: horizontal-first when exiting left/right, vertical-first when exiting top/bottom
                const hExit = fc.side === "left" || fc.side === "right";
                if (hExit) {
                  d = `M ${fc.x} ${fc.y} L ${mx} ${fc.y} L ${mx} ${tc.y} L ${tc.x} ${tc.y}`;
                } else {
                  d = `M ${fc.x} ${fc.y} L ${fc.x} ${my} L ${tc.x} ${my} L ${tc.x} ${tc.y}`;
                }
              } else {
                // Direction-aware bezier: control points follow the exit direction
                const dist = Math.max(Math.abs(tc.x-fc.x), Math.abs(tc.y-fc.y)) * 0.45 + 30;
                const c1x = fc.side==="left" ? fc.x-dist : fc.side==="right" ? fc.x+dist : fc.x;
                const c1y = fc.side==="top"  ? fc.y-dist : fc.side==="bottom" ? fc.y+dist : fc.y;
                const c2x = tc.side==="left" ? tc.x-dist : tc.side==="right" ? tc.x+dist : tc.x;
                const c2y = tc.side==="top"  ? tc.y-dist : tc.side==="bottom" ? tc.y+dist : tc.y;
                d = `M ${fc.x} ${fc.y} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${tc.x} ${tc.y}`;
              }
              return (
                <g key={edge.id} style={{ pointerEvents:"auto" }} onClick={()=>{ setSelectedEdgeId(edge.id); setSelectedIds(new Set()); }}>
                  <path d={d} stroke="transparent" strokeWidth={16} fill="none" style={{ cursor:"pointer" }} />
                  <path d={d} stroke={isSelEdge ? GOLD : col} strokeWidth={isSelEdge ? width+1 : width}
                    fill="none" strokeDasharray={dash}
                    markerEnd={`url(#arrow-${edge.id})`} />
                  {edge.label && (() => {
                    const pad = 10, fSize = 11;
                    const approxW = edge.label.length * (fSize * 0.62) + pad * 2;
                    const bh = 20, bw = Math.max(approxW, 28);
                    return (
                      <g style={{ cursor:"pointer", userSelect:"none" }}
                        onClick={e=>{ e.stopPropagation(); setSelectedEdgeId(edge.id); setSelectedIds(new Set()); }}>
                        <rect x={mx - bw/2} y={my - bh - 2} width={bw} height={bh}
                          rx={bh/2} fill="#1A1A1E" stroke={isSelEdge ? GOLD : col} strokeWidth={isSelEdge ? 2 : 1.5}
                          filter="drop-shadow(0 1px 3px rgba(0,0,0,0.5))" />
                        <text x={mx} y={my - 7} textAnchor="middle"
                          fill={isSelEdge ? GOLD : col} fontSize={fSize} fontWeight="700"
                          style={{ userSelect:"none" }}>
                          {edge.label}
                        </text>
                      </g>
                    );
                  })()}
                </g>
              );
            })}
            {/* Rubber band selection rect */}
            {selectionRect && (() => {
              const rx = Math.min(selectionRect.x1, selectionRect.x2);
              const ry = Math.min(selectionRect.y1, selectionRect.y2);
              const rw = Math.abs(selectionRect.x2 - selectionRect.x1);
              const rh = Math.abs(selectionRect.y2 - selectionRect.y1);
              return <rect x={rx} y={ry} width={rw} height={rh}
                fill="rgba(96,165,250,0.1)" stroke="#60A5FA" strokeWidth={1}
                strokeDasharray="4,2" />;
            })()}
          </svg>

          {/* Nodes — swimlanes rendered first so they sit behind */}
          {[...nodes].sort((a,b)=>(NODE_TYPES[a.type]?.swimlane?-1:0)-(NODE_TYPES[b.type]?.swimlane?-1:0)).map(node => {
            const cfg = NODE_TYPES[node.type] || NODE_TYPES.speech;
            const isConnSrc = connectFrom === node.id;
            const isSelected = selectedIds.has(node.id);
            const matchesSearch = nodeSearch && node.text?.toLowerCase().includes(nodeSearch.toLowerCase());
            const nodeBg = node.customBg !== undefined ? (node.customBg || cfg.bg) : cfg.bg;
            const nodeTextColor = node.customBg ? (contrastColor(node.customBg) || cfg.color) : cfg.color;
            const shapeStyle = getShapeStyle(node.shape);
            const isClipped = ["diamond","hexagon","parallelogram"].includes(node.shape);
            const bw = cfg.thick ? 5 : 2;
            const borderStyle = isClipped
              ? { border:"none", filter: matchesSearch ? `drop-shadow(0 0 0 3px #60A5FA) drop-shadow(0 0 8px #60A5FA66)` : isSelected ? `drop-shadow(0 0 0 2.5px ${GOLD})` : `drop-shadow(0 0 0 1.5px ${cfg.border})` }
              : cfg.note
                ? { borderTop:"none", borderRight:"none", borderBottom:"none", borderLeft:`3px solid ${isSelected?GOLD:cfg.border}`, borderRadius:0, boxShadow: isSelected?`0 0 0 2px ${GOLD}44`:"none" }
                : { border:`${bw}px solid ${matchesSearch ? "#60A5FA" : isSelected ? GOLD : isConnSrc ? "#60A5FA" : cfg.border}`, boxShadow: matchesSearch ? `0 0 0 3px #60A5FA, 0 0 12px #60A5FA66` : (isSelected ? `0 0 0 3px ${GOLD}44` : "0 2px 8px rgba(0,0,0,0.12)") };
            if (cfg.swimlane) {
              const sw = node.w || cfg.defaultW || 680;
              const sh = node.h || cfg.defaultH || 200;
              return (
                <div key={node.id}
                  style={{ position:"absolute", left:node.x, top:node.y, width:sw, height:sh,
                    background:nodeBg, border:`2px solid ${isSelected?GOLD:cfg.border}`,
                    borderRadius:8, cursor:"move", userSelect:"none",
                    boxShadow: isSelected?`0 0 0 3px ${GOLD}44`:"0 2px 12px rgba(0,0,0,0.08)" }}
                  onPointerDown={e=>onNodePointerDown(e,node.id)}>
                  {/* Label bar */}
                  <div style={{ position:"absolute", left:0, top:0, bottom:0, width:34,
                    background:`${cfg.border}22`, borderRight:`2px solid ${cfg.border}`,
                    borderRadius:"6px 0 0 6px", display:"flex", alignItems:"center", justifyContent:"center" }}>
                    {editingNodeId===node.id ? (
                      <input autoFocus defaultValue={node.text}
                        onBlur={e=>{ update({...flow,nodes:nodes.map(n=>n.id===node.id?{...n,text:e.target.value}:n)}); setEditingNodeId(null); }}
                        style={{ writingMode:"vertical-rl", transform:"rotate(180deg)", background:"transparent", border:"none", outline:"none", color:cfg.color, fontSize:12, fontWeight:700, width:160, textAlign:"center" }}
                        onPointerDown={e=>e.stopPropagation()} />
                    ) : (
                      <span style={{ writingMode:"vertical-rl", transform:"rotate(180deg)", color:cfg.color, fontSize:12, fontWeight:700, letterSpacing:0.5 }}
                        onDoubleClick={e=>{ e.stopPropagation(); setEditingNodeId(node.id); }}>
                        {node.text}
                      </span>
                    )}
                  </div>
                  {/* Content hint */}
                  <div style={{ position:"absolute", left:42, top:8, color:cfg.border, fontSize:10, opacity:0.5, fontStyle:"italic" }}>
                    arrastrar nodos aquí
                  </div>
                  <button onClick={e=>{ e.stopPropagation(); deleteNode(node.id); }}
                    style={{ position:"absolute", top:4, right:6, background:"none", border:"none", color:cfg.color, opacity:0.4, cursor:"pointer", fontSize:13, padding:0 }}>×</button>
                </div>
              );
            }

            return (
              <div key={node.id}
                style={{
                  position:"absolute", left:node.x, top:node.y, width: node.w || 180, minHeight:56,
                  background:nodeBg,
                  padding:"8px 10px", cursor:"move",
                  userSelect:"none",
                  ...shapeStyle,
                  ...borderStyle,
                }}
                onPointerDown={e=>onNodePointerDown(e,node.id)}
              >
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:3 }}>
                  <span style={{ fontSize:9, fontWeight:700, color:nodeTextColor, opacity:0.6, textTransform:"uppercase", letterSpacing:0.5 }}>{cfg.label}</span>
                  {node.badge && (() => {
                    const BADGES = { manual:{ icon:"✋", color:"#60A5FA" }, auto:{ icon:"⚡", color:"#A78BFA" }, critical:{ icon:"🔴", color:"#EF4444" } };
                    const b = BADGES[node.badge];
                    return b ? <span style={{ fontSize:10, background:b.color+"22", color:b.color, border:`1px solid ${b.color}55`, borderRadius:8, padding:"0px 5px", fontWeight:700, lineHeight:1.6 }}>{b.icon}</span> : null;
                  })()}
                </div>
                {editingNodeId === node.id ? (
                  <textarea autoFocus defaultValue={node.text}
                    onBlur={e=>{ update({...flow,nodes:nodes.map(n=>n.id===node.id?{...n,text:e.target.value}:n)}); setEditingNodeId(null); }}
                    style={{ width:"100%", background:"transparent", border:"none", outline:"none", color:nodeTextColor, fontSize: node.fontSize || 12, resize:"none", fontFamily:"inherit", fontWeight: node.bold ? 700 : 400, textAlign: node.textAlign || "left" }}
                    rows={3}
                    onPointerDown={e=>e.stopPropagation()}
                  />
                ) : (
                  <div style={{ fontSize: node.fontSize || 12, color:nodeTextColor, lineHeight:1.4, fontWeight: node.bold ? 700 : 400, textAlign: node.textAlign || "left" }}
                    onDoubleClick={e=>{ e.stopPropagation(); setEditingNodeId(node.id); }}>
                    {node.text}
                  </div>
                )}
                <button onClick={e=>{ e.stopPropagation(); deleteNode(node.id); }}
                  style={{ position:"absolute", top:3, right:4, background:"none", border:"none", color:nodeTextColor, opacity:0.45, cursor:"pointer", fontSize:13, padding:0, lineHeight:1 }}>×</button>
              </div>
            );
          })}
        </div>


        {/* Hint */}
        {nodes.length === 0 && (
          <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", pointerEvents:"none" }}>
            <div style={{ textAlign:"center", color:"#999" }}>
              <div style={{ fontSize:28, marginBottom:8 }}>+</div>
              <div style={{ fontSize:13 }}>Agrega nodos con la barra de herramientas</div>
              <div style={{ fontSize:11, marginTop:4 }}>Arrastrar canvas para mover · Scroll para zoom · Doble clic en nodo para editar</div>
            </div>
          </div>
        )}
      </div>

      {/* Analysis panel */}
      {showAnalysis && (
        <div style={{ marginTop:12, background:CARD, border:`1px solid ${GOLD_DIM}`, borderRadius:10, padding:16 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
            <span style={{ color:GOLD, fontWeight:600, fontSize:13 }}>
              {aiResult ? `✦ Análisis · ${clientName}` : "Datos del proceso para análisis"}
            </span>
            <div style={{ display:"flex", gap:8 }}>
              {aiResult && (
                <button onClick={()=>{ setAiResult(null); setAiError(null); }}
                  style={{ padding:"5px 12px", background:"transparent", color:GRAY, border:`1px solid ${BORDER}`, borderRadius:6, cursor:"pointer", fontSize:12 }}>
                  Limpiar
                </button>
              )}
              <button onClick={()=>navigator.clipboard.writeText(aiResult || analysisText).then(()=>alert("¡Copiado!"))}
                style={{ padding:"5px 14px", background:GOLD, color:"#141414", border:"none", borderRadius:6, cursor:"pointer", fontSize:12, fontWeight:700 }}>
                Copiar
              </button>
            </div>
          </div>

          {aiLoading && (
            <div style={{ color:GOLD, fontSize:13, padding:"16px 0", textAlign:"center" }}>Consultando a Claude…</div>
          )}

          {aiError && (
            <div style={{ color:RED, fontSize:12, marginBottom:8, padding:"8px 12px", background:"rgba(224,108,108,0.08)", borderRadius:6 }}>
              {aiError}
              {!apiKey && <span> — <strong>Configura tu API key en la pestaña Configuración.</strong></span>}
            </div>
          )}

          {aiResult ? (
            <pre style={{ background:"#0a0a0b", border:`1px solid ${BORDER}`, borderRadius:8, padding:14, fontSize:12, color:WHITE, whiteSpace:"pre-wrap", lineHeight:1.6, overflowY:"auto", maxHeight:360 }}>
              {aiResult}
            </pre>
          ) : !aiLoading && (
            <>
              {!apiKey && (
                <p style={{ color:GOLD, fontSize:11, marginBottom:8 }}>
                  Sin API key activa — copia el bloque y pégalo en Claude, o configura tu key en Configuración para análisis directo.
                </p>
              )}
              <pre style={{ background:"#0a0a0b", border:`1px solid ${BORDER}`, borderRadius:8, padding:12, fontSize:11, color:WHITE, overflowX:"auto", whiteSpace:"pre-wrap", maxHeight:300, overflowY:"auto" }}>
                {analysisText}
              </pre>
            </>
          )}
        </div>
      )}
    </div>
  );
}

// ─── PROCESO COMERCIAL TAB ────────────────────────────────────────────────────
function ProcesoComercialTab({ client, onChange, apiKey, flowTemplates, onSaveTemplate, onDeleteTemplate }) {
  const flows = Array.isArray(client.flows) ? client.flows : [];
  const [activeFlowId, setActiveFlowId] = useState(flows[0]?.id || null);
  const [renamingId, setRenamingId] = useState(null);
  const [renameVal, setRenameVal] = useState("");
  const [showTemplates, setShowTemplates] = useState(false);
  const activeFlow = flows.find(f=>f.id===activeFlowId) || flows[0];

  const addFlow = () => {
    const name = window.prompt("Nombre del proceso:", "Proceso comercial v" + (flows.length+1));
    if (!name) return;
    const nf = { id:uid(), name, createdAt:Date.now(), nodes:[], edges:[] };
    const updated = { ...client, flows: [...flows, nf] };
    onChange(updated);
    setActiveFlowId(nf.id);
  };

  const deleteFlow = (id) => {
    if (flows.length === 1) { alert("Debe quedar al menos un proceso."); return; }
    if (!confirm("¿Eliminar este proceso?")) return;
    const updated = { ...client, flows: flows.filter(f=>f.id!==id) };
    onChange(updated);
    if (activeFlowId === id) setActiveFlowId(updated.flows[0]?.id);
  };

  const updateFlow = (updatedFlow) => {
    onChange({ ...client, flows: flows.map(f=>f.id===updatedFlow.id ? updatedFlow : f) });
  };

  const startRename = (f) => { setRenamingId(f.id); setRenameVal(f.name); };
  const commitRename = () => {
    if (renameVal.trim()) onChange({ ...client, flows: flows.map(f=>f.id===renamingId ? {...f,name:renameVal.trim()} : f) });
    setRenamingId(null);
  };

  const handleSaveTemplate = () => {
    if (!activeFlow) return;
    const name = window.prompt("Nombre del template:", activeFlow.name || "Mi template");
    if (!name) return;
    onSaveTemplate(name, activeFlow);
  };

  const handleLoadTemplate = (template) => {
    if (!activeFlow) return;
    if (!confirm(`¿Cargar template "${template.name}"? Se reemplazarán los nodos del proceso actual.`)) return;
    const idMap = {};
    const newNodes = template.nodes.map(n => { const newId=uid(); idMap[n.id]=newId; return {...n,id:newId}; });
    const newEdges = template.edges.map(ed => ({ ...ed, id:uid(), from:idMap[ed.from]||ed.from, to:idMap[ed.to]||ed.to }));
    updateFlow({ ...activeFlow, nodes:newNodes, edges:newEdges });
  };

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100%", minHeight:600 }}>
      {/* Header */}
      <div style={{ background:"#0a0a0b", border:`1px solid ${GOLD}22`, borderLeft:`4px solid ${GOLD}`, borderRadius:10, padding:"12px 16px", marginBottom:14 }}>
        <div style={{ color:GOLD_DIM, fontSize:9, fontWeight:700, letterSpacing:2.5, textTransform:"uppercase", marginBottom:3 }}>Visualización</div>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:12 }}>
          <div style={{ color:WHITE, fontWeight:800, fontSize:14, letterSpacing:-0.2 }}>Proceso Comercial</div>
          <span style={{ color:GRAY, fontSize:11 }}>{flows.length} proceso{flows.length!==1?"s":""} · doble clic para renombrar</span>
        </div>
      </div>
      {/* Flow selector */}
      <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:12, alignItems:"center" }}>
        {flows.map(f => (
          <div key={f.id} style={{ display:"flex", alignItems:"center", gap:2 }}>
            {renamingId === f.id ? (
              <input autoFocus value={renameVal} onChange={e=>setRenameVal(e.target.value)}
                onBlur={commitRename} onKeyDown={e=>{ if(e.key==="Enter") commitRename(); if(e.key==="Escape") setRenamingId(null); }}
                style={{ padding:"3px 8px", borderRadius:6, border:`1px solid ${GOLD}`, background:"#111113", color:WHITE, fontSize:12, outline:"none", minWidth:120 }} />
            ) : (
              <button onClick={()=>setActiveFlowId(f.id)} onDoubleClick={()=>startRename(f)}
                style={{ padding:"4px 12px", borderRadius:6, fontSize:12, cursor:"pointer", fontWeight:500,
                  background: activeFlowId===f.id ? GOLD : "#222225", color: activeFlowId===f.id ? "#141414" : GRAY,
                  border:`1px solid ${activeFlowId===f.id ? GOLD : BORDER}` }}>
                {f.name}
              </button>
            )}
            <button onClick={()=>deleteFlow(f.id)}
              style={{ background:"none", border:"none", color:GRAY, cursor:"pointer", fontSize:12, padding:"2px 3px" }}>×</button>
          </div>
        ))}
        <button onClick={addFlow}
          style={{ padding:"4px 12px", borderRadius:6, fontSize:12, cursor:"pointer", background:"transparent", color:GOLD, border:`1px dashed ${GOLD_DIM}` }}>
          + Nuevo proceso
        </button>
        <div style={{ flex:1 }} />
        <button onClick={()=>setShowTemplates(s=>!s)}
          style={{ padding:"4px 12px", borderRadius:6, fontSize:12, cursor:"pointer",
            background: showTemplates ? "rgba(212,175,55,0.12)" : "#222225",
            color: showTemplates ? GOLD : GRAY,
            border:`1px solid ${showTemplates ? GOLD_DIM : BORDER}` }}>
          📋 Templates
        </button>
      </div>

      {/* Templates panel */}
      {showTemplates && (
        <div style={{ background:"#1A1A1D", border:`1px solid ${BORDER}`, borderRadius:8, padding:14, marginBottom:12 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
            <span style={{ color:WHITE, fontWeight:600, fontSize:13 }}>Templates de proceso</span>
            <button onClick={handleSaveTemplate}
              style={{ padding:"5px 14px", background:GOLD, color:"#141414", border:"none", borderRadius:6, cursor:"pointer", fontWeight:700, fontSize:12 }}>
              + Guardar como template
            </button>
          </div>
          {(!flowTemplates || flowTemplates.length === 0) ? (
            <div style={{ color:GRAY, fontSize:12, padding:"8px 0" }}>No hay templates guardados. Guarda el proceso actual como template.</div>
          ) : (
            <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
              {flowTemplates.map(t => (
                <div key={t.id} style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 10px", background:"rgba(255,255,255,0.02)", border:`1px solid ${BORDER}`, borderRadius:6 }}>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:12, color:WHITE, fontWeight:500 }}>{t.name}</div>
                    <div style={{ fontSize:10, color:GRAY }}>{t.nodes.length} nodos · {t.edges.length} conexiones · {new Date(t.createdAt).toLocaleDateString("es-CO")}</div>
                  </div>
                  <button onClick={()=>handleLoadTemplate(t)}
                    style={{ padding:"4px 10px", borderRadius:5, fontSize:11, cursor:"pointer", background:GOLD, color:"#141414", border:"none", fontWeight:600 }}>
                    Cargar
                  </button>
                  <button onClick={()=>onDeleteTemplate(t.id)}
                    style={{ padding:"4px 8px", borderRadius:5, fontSize:11, cursor:"pointer", border:`1px solid ${RED}`, color:RED, background:"transparent" }}>✕</button>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {activeFlow && (
        <FlowCanvas
          flow={activeFlow}
          clientName={client.name}
          clientProfile={client.profile}
          clientTasks={client.tasks}
          onUpdate={updateFlow}
          apiKey={apiKey}
        />
      )}
    </div>
  );
}
