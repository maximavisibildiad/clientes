function contrastColor(hex) {
  if (!hex || hex.length < 7) return null;
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.5 ? "#1A1A1A" : "#FFFFFF";
}

function storageGet() {
  try {
    if (window.storage) return window.storage.get(STORAGE_KEY) || null;
  } catch (_) {}
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (_) { return null; }
}

function storageSet(val) {
  try {
    if (window.storage) { window.storage.set(STORAGE_KEY, val); return; }
  } catch (_) {}
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(val)); } catch (_) {}
}
function storageGetTs() {
  try { return parseInt(localStorage.getItem(STORAGE_KEY + "_ts") || "0"); } catch(_) { return 0; }
}
function storageSetTs(ts) {
  try { localStorage.setItem(STORAGE_KEY + "_ts", ts.toString()); } catch(_) {}
}

// Firebase convierte arrays a objetos con claves numéricas. Esta función los revierte.
function fbToJs(v) {
  if (v === null || v === undefined || typeof v !== "object" || Array.isArray(v)) return v;
  const keys = Object.keys(v);
  const isArr = keys.length > 0 && keys.every(k => /^\d+$/.test(k)) &&
    keys.map(Number).sort((a,b)=>a-b).every((k,i)=>k===i);
  if (isArr) return keys.sort((a,b)=>Number(a)-Number(b)).map(k=>fbToJs(v[k]));
  const out = {};
  for (const k of keys) out[k] = fbToJs(v[k]);
  return out;
}

function syncTasksToClients(clients, globalTasks) {
  return clients.map(client => {
    const byGlobalId = {}, byN = {};
    client.tasks.forEach(t => {
      if (t.globalId) byGlobalId[t.globalId] = t;
      if (t.n != null) byN[t.n] = t;
    });
    const globalSet = new Set(globalTasks.map(gt => gt.id));
    const customTasks = client.tasks.filter(t => !t.n && !t.globalId); // keep custom one-off tasks
    const newTasks = globalTasks.map(gt => {
      const existing = byGlobalId[gt.id] || byN[gt.n];
      if (existing) return { ...existing, globalId: gt.id, area: gt.area, week: gt.week, title: gt.title, owner: gt.owner };
      return { ...gt, id: uid(), globalId: gt.id, done: false, assigneeId: null, doneAt: null };
    });
    return { ...client, tasks: [...newTasks, ...customTasks] };
  });
}

function syncPhasesToClients(clients, globalPhases) {
  const validIds = new Set(globalPhases.map(p => p.id));
  return clients.map(client => {
    const existing = client.launchPhases || {};
    const cleaned = {};
    validIds.forEach(id => { cleaned[id] = existing[id] || { done: false, date: "", owner: "" }; });
    return { ...client, launchPhases: cleaned };
  });
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function weekStats(tasks, week) {
  const wt = tasks.filter(t => t.week === week);
  return { done: wt.filter(t=>t.done).length, total: wt.length };
}

function overallPct(tasks) {
  if (!tasks.length) return 0;
  return Math.round((tasks.filter(t=>t.done).length / tasks.length) * 100);
}

// ─── EJECUCION TAB ────────────────────────────────────────────────────────────
function EjecucionTab({ client, team, onChange }) {
  const [weekFilter, setWeekFilter] = useState("Todas");
  const [areaFilter, setAreaFilter] = useState("Todas");
  const [ownerFilter, setOwnerFilter] = useState("Todos");
  const [customTitle, setCustomTitle] = useState("");
  const [customWeek, setCustomWeek] = useState("Semana 1");
  const [customArea, setCustomArea] = useState("Administrativo");
  const [customOwner, setCustomOwner] = useState("JP");

  const tasks = client.tasks;

  const filtered = tasks.filter(t => {
    if (weekFilter !== "Todas" && t.week !== weekFilter) return false;
    if (areaFilter !== "Todas" && t.area !== areaFilter) return false;
    if (ownerFilter !== "Todos" && t.owner !== ownerFilter) return false;
    return true;
  });

  const toggleTask = (taskId) => {
    const updated = tasks.map(t => t.id === taskId ? { ...t, done: !t.done, doneAt: !t.done ? Date.now() : null } : t);
    onChange({ ...client, tasks: updated });
  };

  const assignTask = (taskId, assigneeId) => {
    const updated = tasks.map(t => t.id === taskId ? { ...t, assigneeId: assigneeId||null } : t);
    onChange({ ...client, tasks: updated });
  };

  const deleteTask = (taskId) => {
    if (!confirm("¿Eliminar esta tarea?")) return;
    onChange({ ...client, tasks: tasks.filter(t => t.id !== taskId) });
  };

  const urgentTask = (taskId) => {
    const updated = tasks.map(t => t.id === taskId ? { ...t, urgent: !t.urgent } : t);
    onChange({ ...client, tasks: updated });
  };

  // Group by area when showing all weeks
  const grouped = {};
  if (weekFilter === "Todas") {
    filtered.forEach(t => {
      if (!grouped[t.area]) grouped[t.area] = [];
      grouped[t.area].push(t);
    });
  }

  const meetings = client.meetings || [];
  const [showMeetingForm, setShowMeetingForm] = useState(false);
  const [mDate, setMDate] = useState("");
  const [mTitle, setMTitle] = useState("");
  const [mDesc, setMDesc] = useState("");
  const [mTaskId, setMTaskId] = useState("");

  const saveMeeting = () => {
    if (!mDate) return;
    const newM = { id: uid(), date: mDate, title: mTitle.trim() || "Reunión", desc: mDesc.trim(), taskId: mTaskId || null };
    onChange({ ...client, meetings: [...meetings, newM].sort((a,b)=>a.date.localeCompare(b.date)) });
    setMDate(""); setMTitle(""); setMDesc(""); setMTaskId(""); setShowMeetingForm(false);
  };
  const deleteMeeting = (id) => onChange({ ...client, meetings: meetings.filter(m=>m.id!==id) });

  const upcomingMeetings = meetings.filter(m => new Date(m.date) >= new Date()).sort((a,b)=>a.date.localeCompare(b.date));
  const pastMeetings = meetings.filter(m => new Date(m.date) < new Date()).sort((a,b)=>b.date.localeCompare(a.date));
  const fmtMeeting = d => new Date(d).toLocaleDateString("es-CO", { weekday:"short", day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" });

  return (
    <div>
      {/* Reuniones */}
      <div style={{ background:"#0a0a0b", border:`1px solid #60A5FA22`, borderLeft:`4px solid #60A5FA`, borderRadius:10, padding:"14px 16px", marginBottom:20 }}>
        {/* Header */}
        <div style={{ marginBottom:12 }}>
          <div style={{ color:"#60A5FA88", fontSize:9, fontWeight:700, letterSpacing:2.5, textTransform:"uppercase", marginBottom:3 }}>Agenda</div>
          <div style={{ color:WHITE, fontWeight:800, fontSize:14, letterSpacing:-0.2 }}>Reuniones del Cliente</div>
        </div>
        {meetings.length === 0 && !showMeetingForm ? (
          <button onClick={()=>setShowMeetingForm(true)}
            style={{ width:"100%", padding:"12px", background:"rgba(96,165,250,0.06)", border:"1px dashed rgba(96,165,250,0.3)", borderRadius:8, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
            <span style={{ fontSize:14 }}>📅</span>
            <span style={{ color:GRAY, fontSize:12 }}>Agendar primera reunión</span>
          </button>
        ) : (
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom: (upcomingMeetings.length > 0 || showMeetingForm) ? 12 : 0, gap:8 }}>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              {upcomingMeetings.length > 0 && (
                <span style={{ background:"rgba(96,165,250,0.12)", color:"#60A5FA", fontSize:10, fontWeight:700, padding:"2px 8px", borderRadius:20, border:"1px solid rgba(96,165,250,0.2)" }}>
                  {upcomingMeetings.length} próxima{upcomingMeetings.length>1?"s":""}
                </span>
              )}
            </div>
            <button onClick={()=>setShowMeetingForm(s=>!s)}
              style={{ padding:"5px 12px", borderRadius:7, fontSize:12, cursor:"pointer", border:`1px solid ${showMeetingForm?GOLD:BORDER}`, background:showMeetingForm?"rgba(212,175,55,0.1)":"transparent", color:showMeetingForm?GOLD:GRAY, fontWeight:600 }}>
              {showMeetingForm ? "✕ Cancelar" : "+ Agendar"}
            </button>
          </div>
        )}

        {showMeetingForm && (
          <div style={{ padding:"12px 14px", background:"#111113", borderRadius:8, marginBottom:12, display:"flex", flexDirection:"column", gap:8 }}>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
              <div>
                <div style={{ color:GRAY, fontSize:10, marginBottom:3 }}>Fecha y hora *</div>
                <input type="datetime-local" value={mDate} onChange={e=>setMDate(e.target.value)}
                  style={{ width:"100%", background:BG, border:`1px solid ${mDate?GOLD:BORDER}`, borderRadius:7, padding:"6px 10px", color:WHITE, fontSize:12, outline:"none", colorScheme:"dark" }} />
              </div>
              <div>
                <div style={{ color:GRAY, fontSize:10, marginBottom:3 }}>Título</div>

                  style={{ width:"100%", background:BG, border:`1px solid ${BORDER}`, borderRadius:7, padding:"6px 10px", color:WHITE, fontSize:12, outline:"none" }} />

            </div>
            <div>
              <div style={{ color:GRAY, fontSize:10, marginBottom:3 }}>Descripción / agenda</div>

            </div>
            <div>

                ))}
              </select>
            </div>
            <button onClick={saveMeeting} disabled={!mDate}

              Guardar reunión

          </div>

        {upcomingMeetings.map(m => {
          const linked = m.taskId ? client.tasks.find(t=>t.id===m.taskId) : null;
          return (
            <div key={m.id} style={{ display:"flex", gap:12, alignItems:"flex-start", padding:"9px 0", borderBottom:`1px solid ${BORDER}33` }}>

              <div style={{ flex:1 }}>

                {m.desc && <div style={{ color:GRAY, fontSize:11, marginTop:2, lineHeight:1.4 }}>{m.desc}</div>}

              <button onClick={()=>deleteMeeting(m.id)} style={{ background:"none", border:"none", color:GRAY, cursor:"pointer", fontSize:13, flexShrink:0 }}>×</button>
            </div>
          );
        })}

        {pastMeetings.length > 0 && upcomingMeetings.length === 0 && (
          <div style={{ color:GRAY, fontSize:11, marginTop:4 }}>
            Última: {pastMeetings[0].title} — {fmtMeeting(pastMeetings[0].date)}
          </div>

      </div>

      {/* Week stats */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:10, marginBottom:20 }}>

          const s = weekStats(tasks, w);
          const pct = s.total ? Math.round(s.done/s.total*100) : 0;

            <div key={w} style={{ background:"#0a0a0b", border:`1px solid ${c}22`, borderTop:`2px solid ${c}55`, borderRadius:10, padding:"12px 14px" }}>
              <div style={{ color:`${c}88`, fontSize:9, fontWeight:700, letterSpacing:2, textTransform:"uppercase", marginBottom:4 }}>Semana {wi+1}</div>

          );
        })}
      </div>

      {/* Launch milestones */}
      {(() => {

        if (!start) return (
          <div style={{ background:"rgba(212,175,55,0.06)", border:`1px solid ${GOLD_DIM}`, borderRadius:10, padding:"10px 14px", marginBottom:16, fontSize:11, color:GOLD_DIM }}>

        );
      })()}

      {/* Filters */}
      <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:10 }}>
        {["Todas",...WEEKS].map(w=><Pill key={w} active={weekFilter===w} onClick={()=>setWeekFilter(w)}>{w}</Pill>)}
      </div>
      <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:10 }}>
        {["Todas",...AREAS].map(a=><Pill key={a} active={areaFilter===a} onClick={()=>setAreaFilter(a)}>{a}</Pill>)}
      </div>
      <div style={{ display:"flex", gap:6, marginBottom:16, alignItems:"center", flexWrap:"wrap" }}>
        {["Todos","JP","COO","CAIO","Media Buyer","AM"].map(o=><Pill key={o} active={ownerFilter===o} onClick={()=>setOwnerFilter(o)}>{o}</Pill>)}
      </div>

      {/* Quick-add bar */}
      <div style={{ display:"flex", gap:6, marginBottom:16, alignItems:"center", flexWrap:"wrap",
        background:"#0d0d0f", border:`1px solid ${BORDER}`, borderRadius:8, padding:"8px 10px" }}>
        <input
          value={customTitle} onChange={e=>setCustomTitle(e.target.value)}
          onKeyDown={e=>{ if(e.key==="Enter" && customTitle.trim()) {
            onChange({...client, tasks:[...tasks,{id:uid(),n:null,week:customWeek,area:customArea,title:customTitle.trim(),owner:customOwner,done:false,assigneeId:null,doneAt:null}]});

          placeholder="+ Nueva tarea para este cliente..."

          style={{ background:"#111113", border:`1px solid ${BORDER}`, borderRadius:5, padding:"3px 6px", color:GRAY, fontSize:11, outline:"none" }}>
          {["JP","COO","CAIO","Media Buyer","AM"].map(o=><option key={o} value={o}>{o}</option>)}

          {WEEKS.map(w=><option key={w} value={w}>{w}</option>)}
        </select>

          style={{ background:"#111113", border:`1px solid ${BORDER}`, borderRadius:5, padding:"3px 6px", color:GRAY, fontSize:11, outline:"none" }}>
          {AREAS.map(a=><option key={a} value={a}>{a}</option>)}
        </select>
        <button
          onClick={() => {
            if (!customTitle.trim()) return;
            onChange({...client, tasks:[...tasks,{id:uid(),n:null,week:customWeek,area:customArea,title:customTitle.trim(),owner:customOwner,done:false,assigneeId:null,doneAt:null}]});

          style={{ padding:"4px 12px", background:customTitle.trim()?GREEN:"#222225", color:customTitle.trim()?"#141414":GRAY, border:`1px solid ${customTitle.trim()?GREEN:BORDER}`, borderRadius:5, cursor:"pointer", fontWeight:700, fontSize:12, transition:"all 0.15s", flexShrink:0 }}>
          Añadir
        </button>
      </div>

      {/* Task list */}
      {weekFilter === "Todas" ? (
        Object.entries(grouped).map(([area, areaTask]) => {
          const ag = AREA_AGENT[area];
          return (
          <div key={area} style={{ marginBottom:20 }}>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>

              {ag && (
                <span title={`Agente: ${ag.file} · Actívalo en Claude /agentes`}

                  🤖 {ag.label}

          </div>
          );
        })
      ) : (
        filtered.map(t => <TaskRow key={t.id} task={t} team={team} onToggle={toggleTask} onAssign={assignTask} onDelete={deleteTask} onUrgent={urgentTask} />)
      )}

      {filtered.length === 0 && (
        <div style={{ color:GRAY, textAlign:"center", padding:"40px 0" }}>No hay tareas con estos filtros.</div>
      )}
    </div>
  );

  "CAIO":        { color:"#60A5FA", bg:"rgba(59,130,246,0.08)",  border:"rgba(59,130,246,0.4)" },
  "Media Buyer": { color:"#60A5FA", bg:"rgba(59,130,246,0.08)",  border:"rgba(59,130,246,0.4)" },
  "AM":          { color:"#4ADE80", bg:"rgba(34,197,94,0.08)",   border:"rgba(34,197,94,0.4)" },
