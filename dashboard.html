  const startRename = (f) => { setRenamingId(f.id); setRenameVal(f.name); };
  const commitRename = () => {
    if (renameVal.trim()) onChange({ ...client, flows: flows.map(f=>f.id===renamingId ? {...f,name:renameVal.trim()} : f) });
    setRenamingId(null);
  };

  const handleSaveTemplate = () => {
    if (!activeFlow) return;
    const name = window.prompt("Nombre del template:", activeFlow.name || "Mi template");
    if (!name) return;
    onSaveTemplate(name, activeFlow);
  };

  const handleLoadTemplate = (template) => {
    if (!activeFlow) return;
    if (!confirm(`¿Cargar template "${template.name}"? Se reemplazarán los nodos del proceso actual.`)) return;
    const idMap = {};
    const newNodes = template.nodes.map(n => { const newId=uid(); idMap[n.id]=newId; return {...n,id:newId}; });
    const newEdges = template.edges.map(ed => ({ ...ed, id:uid(), from:idMap[ed.from]||ed.from, to:idMap[ed.to]||ed.to }));
    updateFlow({ ...activeFlow, nodes:newNodes, edges:newEdges });
  };

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100%", minHeight:600 }}>
      {/* Header */}
      <div style={{ background:"#0a0a0b", border:`1px solid ${GOLD}22`, borderLeft:`4px solid ${GOLD}`, borderRadius:10, padding:"12px 16px", marginBottom:14 }}>
        <div style={{ color:GOLD_DIM, fontSize:9, fontWeight:700, letterSpacing:2.5, textTransform:"uppercase", marginBottom:3 }}>Visualización</div>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:12 }}>
          <div style={{ color:WHITE, fontWeight:800, fontSize:14, letterSpacing:-0.2 }}>Proceso Comercial</div>
          <span style={{ color:GRAY, fontSize:11 }}>{flows.length} proceso{flows.length!==1?"s":""} · doble clic para renombrar</span>
        </div>
      </div>
      {/* Flow selector */}
      <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:12, alignItems:"center" }}>
        {flows.map(f => (
          <div key={f.id} style={{ display:"flex", alignItems:"center", gap:2 }}>
            {renamingId === f.id ? (
              <input autoFocus value={renameVal} onChange={e=>setRenameVal(e.target.value)}
                onBlur={commitRename} onKeyDown={e=>{ if(e.key==="Enter") commitRename(); if(e.key==="Escape") setRenamingId(null); }}
                style={{ padding:"3px 8px", borderRadius:6, border:`1px solid ${GOLD}`, background:"#111113", color:WHITE, fontSize:12, outline:"none", minWidth:120 }} />
            ) : (
              <button onClick={()=>setActiveFlowId(f.id)} onDoubleClick={()=>startRename(f)}
                style={{ padding:"4px 12px", borderRadius:6, fontSize:12, cursor:"pointer", fontWeight:500,
                  background: activeFlowId===f.id ? GOLD : "#222225", color: activeFlowId===f.id ? "#141414" : GRAY,
                  border:`1px solid ${activeFlowId===f.id ? GOLD : BORDER}` }}>
                {f.name}
              </button>
            )}
            <button onClick={()=>deleteFlow(f.id)}
              style={{ background:"none", border:"none", color:GRAY, cursor:"pointer", fontSize:12, padding:"2px 3px" }}>×</button>
          </div>
        ))}
        <button onClick={addFlow}
          style={{ padding:"4px 12px", borderRadius:6, fontSize:12, cursor:"pointer", background:"transparent", color:GOLD, border:`1px dashed ${GOLD_DIM}` }}>
          + Nuevo proceso
        </button>
        <div style={{ flex:1 }} />
        <button onClick={()=>setShowTemplates(s=>!s)}
          style={{ padding:"4px 12px", borderRadius:6, fontSize:12, cursor:"pointer",
            background: showTemplates ? "rgba(212,175,55,0.12)" : "#222225",
            color: showTemplates ? GOLD : GRAY,
            border:`1px solid ${showTemplates ? GOLD_DIM : BORDER}` }}>
          📋 Templates
        </button>
      </div>

      {/* Templates panel */}
      {showTemplates && (
        <div style={{ background:"#1A1A1D", border:`1px solid ${BORDER}`, borderRadius:8, padding:14, marginBottom:12 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
            <span style={{ color:WHITE, fontWeight:600, fontSize:13 }}>Templates de proceso</span>
            <button onClick={handleSaveTemplate}
              style={{ padding:"5px 14px", background:GOLD, color:"#141414", border:"none", borderRadius:6, cursor:"pointer", fontWeight:700, fontSize:12 }}>
              + Guardar como template
            </button>
          </div>
          {(!flowTemplates || flowTemplates.length === 0) ? (
            <div style={{ color:GRAY, fontSize:12, padding:"8px 0" }}>No hay templates guardados. Guarda el proceso actual como template.</div>
          ) : (
            <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
              {flowTemplates.map(t => (
                <div key={t.id} style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 10px", background:"rgba(255,255,255,0.02)", border:`1px solid ${BORDER}`, borderRadius:6 }}>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:12, color:WHITE, fontWeight:500 }}>{t.name}</div>
                    <div style={{ fontSize:10, color:GRAY }}>{t.nodes.length} nodos · {t.edges.length} conexiones · {new Date(t.createdAt).toLocaleDateString("es-CO")}</div>
                  </div>
                  <button onClick={()=>handleLoadTemplate(t)}
                    style={{ padding:"4px 10px", borderRadius:5, fontSize:11, cursor:"pointer", background:GOLD, color:"#141414", border:"none", fontWeight:600 }}>
                    Cargar
                  </button>
                  <button onClick={()=>onDeleteTemplate(t.id)}
                    style={{ padding:"4px 8px", borderRadius:5, fontSize:11, cursor:"pointer", border:`1px solid ${RED}`, color:RED, background:"transparent" }}>✕</button>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {activeFlow && (
        <FlowCanvas
          flow={activeFlow}
          clientName={client.name}
          clientProfile={client.profile}
          clientTasks={client.tasks}
          onUpdate={updateFlow}
          apiKey={apiKey}
        />
      )}
    </div>
  );
}

// ─── CLIENT DETAIL ────────────────────────────────────────────────────────────
// ─── LAUNCH TAB ──────────────────────────────────────────────────────────────
function LaunchTab({ client, onChange, globalMvpSteps, globalFullSteps }) {
  const mvpSteps = client.customMvpSteps || globalMvpSteps || MVP_STEPS;
  const fullSteps = client.customFullSteps || globalFullSteps || FULL_STEPS;
  const [showTasks, setShowTasks] = useState(false);
  const [editingDate, setEditingDate] = useState(null);

  const lp = client.launchPhases || {};
  const startRaw = client.profile?.startDate || null;
  const startDate = startRaw ? new Date(startRaw + "T12:00:00") : null;

  const getP = (id) => lp[id] || { done: false, date: "", owner: "" };
  const setP = (id, upd) => onChange({ ...client, launchPhases: { ...lp, [id]: { ...getP(id), ...upd } } });
  const toggleDone = (id) => {
    const cur = getP(id);
    const today = new Date().toISOString().slice(0, 10);
    setP(id, { done: !cur.done, date: !cur.done ? (cur.date || today) : cur.date });
  };
  const addOffset = (offset) => {
    if (!startDate) return null;
    const d = new Date(startDate);
    d.setDate(d.getDate() + offset);
    return d.toISOString().slice(0, 10);
  };
  const fmtD = (s) => {
    if (!s) return null;
    const [y, m, d] = s.split("-");
    const MM = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][+m - 1];
    const thisY = new Date().getFullYear();
    return `${+d} ${MM}${+y !== thisY ? " '" + String(y).slice(2) : ""}`;
  };

  const doneCount = LAUNCH_PHASES.filter(p => getP(p.id).done).length;
  const pct = Math.round(doneCount / LAUNCH_PHASES.length * 100);
  const activeIdx = LAUNCH_PHASES.findIndex(p => !getP(p.id).done);
  const tasksDone = [...mvpSteps,...fullSteps].filter(s => (client.mvpChecks||{})[s.n]||(client.fullChecks||{})[s.n]).length;

  return (
    <div style={{ maxWidth:700 }}>
      {/* Header */}
      <div style={{ background:"#0a0a0b", border:`1px solid ${GOLD}22`, borderLeft:`4px solid ${GOLD}`, borderRadius:10, padding:"14px 16px", marginBottom:24 }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8 }}>
          <div>
            <div style={{ color:GOLD_DIM, fontSize:9, fontWeight:700, letterSpacing:2.5, textTransform:"uppercase", marginBottom:3 }}>Cronograma</div>
            <div style={{ color:WHITE, fontWeight:800, fontSize:15 }}>Plan de Lanzamiento</div>
          </div>
          <div style={{ textAlign:"right" }}>
            <div style={{ color:GOLD, fontWeight:800, fontSize:22, lineHeight:1 }}>{doneCount}/{LAUNCH_PHASES.length}</div>
            <div style={{ color:GRAY, fontSize:11, marginTop:2 }}>{pct}% completado</div>
          </div>
        </div>
        <ProgressBar pct={pct} color={GOLD} height={5} />
        <div style={{ marginTop:8, fontSize:11 }}>
          {startDate ? (
            <span>
              <span style={{ color:GRAY }}>Inicio: </span>
              <span style={{ color:WHITE }}>{fmtD(startRaw)}</span>
              <span style={{ color:GRAY }}> · Lanzamiento est.: </span>
              <span style={{ color:"#22C55E", fontWeight:600 }}>{fmtD(addOffset(21)) || "—"}</span>
            </span>
          ) : (
            <span style={{ color:GRAY }}>Define la fecha de inicio en Perfil para ver fechas proyectadas</span>
          )}
        </div>
      </div>

      {/* Timeline */}
      {LAUNCH_GROUPS.map((grp) => {
        const grpPhases = LAUNCH_PHASES.filter(p => p.group === grp.id);
        const grpDone = grpPhases.filter(p => getP(p.id).done).length;
        const grpFromDate = grp.id !== "pre" ? fmtD(addOffset(grpPhases[0].offset)) : null;

        return (
          <div key={grp.id} style={{ marginBottom:22 }}>
            {/* Group label */}
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>
              <div style={{ width:3, height:30, background:grp.color, borderRadius:2, flexShrink:0 }} />
              <div>
                <div style={{ fontSize:11, fontWeight:700, color:grp.color, letterSpacing:0.8, textTransform:"uppercase" }}>{grp.label}</div>
                <div style={{ fontSize:10, color:GRAY }}>
                  {grp.tag}{grpFromDate ? ` · desde ${grpFromDate}` : ""} · {grpDone}/{grpPhases.length} ejecutadas
                </div>
              </div>
            </div>

            {/* Phase rows connected by line */}
            <div style={{ position:"relative", borderLeft:`2px solid ${BORDER}`, marginLeft:20 }}>
              {grpPhases.map((phase, idx) => {
                const ph = getP(phase.id);
                const globalIdx = LAUNCH_PHASES.indexOf(phase);
                const isActive = globalIdx === activeIdx;
                const dateVal = ph.date || addOffset(phase.offset);
                const isLast = idx === grpPhases.length - 1;

                return (
                  <div key={phase.id} style={{ position:"relative", paddingLeft:28, paddingBottom: isLast ? 2 : 10, paddingTop:2 }}>
                    {/* Dot on the line */}
                    <div onClick={() => toggleDone(phase.id)} style={{
                      position:"absolute", left:-11, top:9,
                      width:22, height:22, borderRadius:"50%",
                      border:`2px solid ${ph.done ? phase.color : (isActive ? phase.color : BORDER)}`,
                      background: ph.done ? phase.color : (isActive ? phase.color+"18" : BG),
                      display:"flex", alignItems:"center", justifyContent:"center",
                      cursor:"pointer", transition:"all 0.15s", zIndex:1,
                      boxShadow: isActive ? `0 0 10px ${phase.color}55` : "none",
                    }}>
                      {ph.done
                        ? <span style={{ fontSize:10, fontWeight:900, color:"#141414" }}>✓</span>
                        : isActive ? <div style={{ width:7, height:7, borderRadius:"50%", background:phase.color }} /> : null
                      }
                    </div>

                    {/* Card */}
                    <div onClick={() => toggleDone(phase.id)} style={{
                      background: ph.done ? phase.color+"0A" : (isActive ? phase.color+"0A" : CARD),
                      border:`1px solid ${ph.done ? phase.color+"40" : (isActive ? phase.color+"40" : BORDER)}`,
                      borderRadius:8, padding:"8px 12px", cursor:"pointer", transition:"all 0.15s",
                    }}>
                      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:8 }}>
                        <span style={{ fontSize:12, fontWeight:600, color: ph.done ? GRAY : WHITE, textDecoration: ph.done ? "line-through" : "none" }}>
                          {phase.name}
                          {isActive && !ph.done && (
                            <span style={{ marginLeft:8, fontSize:9, padding:"1px 7px", borderRadius:10, background:phase.color+"22", color:phase.color, fontWeight:700, letterSpacing:0.8, textTransform:"uppercase", verticalAlign:"middle" }}>
                              En curso
                            </span>
                          )}
                        </span>
                        <div style={{ display:"flex", alignItems:"center", gap:6, flexShrink:0 }}>
                          {/* Date — click to edit */}
                          {editingDate === phase.id ? (
                            <input type="date" value={ph.date || ""} autoFocus
                              onClick={e => e.stopPropagation()}
                              onChange={e => setP(phase.id, { date: e.target.value })}
                              onBlur={() => setEditingDate(null)}
                              style={{ background:"#111113", border:`1px solid ${BORDER}`, borderRadius:5, padding:"2px 6px", color:WHITE, fontSize:11, outline:"none", width:124 }} />
                          ) : (
                            <span onClick={e => { e.stopPropagation(); setEditingDate(phase.id); }}
                              title="Click para editar fecha"
                              style={{ fontSize:11, color: ph.date ? WHITE : GRAY, cursor:"text", padding:"2px 4px", borderRadius:4 }}>
                              {dateVal ? fmtD(dateVal) : "—"}
                            </span>
                          )}
                          {/* Status badge */}
                          <span style={{ fontSize:9, padding:"2px 8px", borderRadius:10, fontWeight:700, letterSpacing:0.5, textTransform:"uppercase", flexShrink:0,
                            background: ph.done ? phase.color+"22" : "transparent",
                            color: ph.done ? phase.color : GRAY,
                            border: `1px solid ${ph.done ? phase.color+"44" : BORDER}` }}>
                            {ph.done ? "Ejecutada" : "Pendiente"}
                          </span>
                        </div>
                      </div>
                      <div style={{ fontSize:10, color:phase.color+"99", marginTop:3 }}>
                        {ph.owner || phase.defaultOwner}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}

      {/* Old task checklists — collapsed accordion */}
      <div style={{ marginTop:16, borderTop:`1px solid ${BORDER}`, paddingTop:14 }}>
        <button onClick={() => setShowTasks(s => !s)}
          style={{ background:"transparent", border:"none", color:GRAY, cursor:"pointer", fontSize:11, padding:0, display:"flex", alignItems:"center", gap:6 }}>
          <span style={{ fontSize:9 }}>{showTasks ? "▲" : "▼"}</span>
          Checklist de implementación ({tasksDone}/{mvpSteps.length + fullSteps.length})
        </button>
        {showTasks && (
          <div style={{ marginTop:14 }}>
            <div style={{ marginBottom:8, fontSize:10, fontWeight:700, color:GOLD_DIM, letterSpacing:1.5, textTransform:"uppercase" }}>Mínimo viable</div>
            <div style={{ display:"flex", flexDirection:"column", gap:5, marginBottom:18 }}>
              {mvpSteps.map(step => {
                const isDone = !!(client.mvpChecks||{})[step.n];
                return (
                  <div key={step.n} onClick={() => onChange({...client, mvpChecks:{...client.mvpChecks||{},[step.n]:!isDone}})}
                    style={{ display:"flex", alignItems:"flex-start", gap:10, padding:"8px 12px", borderRadius:8, cursor:"pointer",
                      background: isDone ? "rgba(212,175,55,0.05)" : CARD, border:`1px solid ${isDone ? GOLD_DIM : BORDER}`, opacity: isDone ? 0.7 : 1 }}>
                    <div style={{ width:18, height:18, borderRadius:4, border:`2px solid ${isDone ? GOLD : BORDER}`, background: isDone ? GOLD : "transparent",
                      display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, marginTop:1 }}>
                      {isDone && <span style={{ color:"#141414", fontSize:11, fontWeight:800 }}>✓</span>}
                    </div>
                    <div>
                      <div style={{ fontSize:12, fontWeight:600, color: isDone ? GRAY : WHITE, textDecoration: isDone ? "line-through" : "none" }}>{step.title}</div>
                      <div style={{ fontSize:10, color:GRAY }}>{step.desc}</div>
                    </div>
                  </div>
                );
              })}
            </div>
            <div style={{ marginBottom:8, fontSize:10, fontWeight:700, color:"#22C55E88", letterSpacing:1.5, textTransform:"uppercase" }}>Full Launch</div>
            <div style={{ display:"flex", flexDirection:"column", gap:5 }}>
              {fullSteps.map(step => {
                const isDone = !!(client.fullChecks||{})[step.n];
                return (
                  <div key={step.n} onClick={() => onChange({...client, fullChecks:{...client.fullChecks||{},[step.n]:!isDone}})}
                    style={{ display:"flex", alignItems:"flex-start", gap:10, padding:"8px 12px", borderRadius:8, cursor:"pointer",
                      background: isDone ? "rgba(34,197,94,0.05)" : CARD, border:`1px solid ${isDone ? "#22C55E55" : BORDER}`, opacity: isDone ? 0.7 : 1 }}>
                    <div style={{ width:18, height:18, borderRadius:4, border:`2px solid ${isDone ? "#22C55E" : BORDER}`, background: isDone ? "#22C55E" : "transparent",
                      display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, marginTop:1 }}>
                      {isDone && <span style={{ color:"#141414", fontSize:11, fontWeight:800 }}>✓</span>}
                    </div>
                    <div>
                      <div style={{ fontSize:12, fontWeight:600, color: isDone ? GRAY : WHITE, textDecoration: isDone ? "line-through" : "none" }}>{step.title}</div>
                      <div style={{ fontSize:10, color:GRAY }}>{step.desc}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function ClientDetail({ client, team, onBack, onChange, apiKey, flowTemplates, onSaveTemplate, onDeleteTemplate, globalMvpSteps, globalFullSteps }) {
  const [subTab, setSubTab] = useState("perfil");
  const pct = overallPct(client.tasks);
  const done = client.tasks.filter(t=>t.done).length;

  return (
    <div>
      {/* Header */}
      <div style={{ display:"flex", alignItems:"center", gap:14, marginBottom:20 }}>
        <button onClick={onBack} style={{ background:"rgba(42,42,46,0.5)", border:`1px solid ${BORDER}`, borderRadius:8, padding:"7px 14px", color:GRAY, cursor:"pointer", fontSize:12, fontWeight:500, letterSpacing:0.2 }}>← Clientes</button>
        <div style={{ flex:1 }}>
          <h2 style={{ margin:0, color:WHITE, fontSize:21, fontWeight:800, letterSpacing:-0.3 }}>{client.name}</h2>
          <div style={{ display:"flex", alignItems:"center", gap:10, marginTop:5 }}>
            <div style={{ flex:1, maxWidth:200 }}><ProgressBar pct={pct} /></div>
            <span style={{ fontSize:12, color:GOLD, fontWeight:600 }}>{done}/{client.tasks.length} · {pct}%</span>
          </div>
        </div>
      </div>

      {/* Sub tabs */}
      <div style={{ display:"flex", gap:0, marginBottom:20, borderBottom:`1px solid ${BORDER}` }}>
        {[["perfil","Perfil"],["lanzamiento","🎯 Lanzamiento"],["ejecucion","Ejecución"],["proceso","Proceso Comercial"]].map(([id,label]) => (
          <button key={id} className={`gp-nav-tab${subTab===id?" active":""}`} onClick={()=>setSubTab(id)}>
            {label}
          </button>
        ))}
      </div>

      {subTab === "perfil" && <PerfilTab client={client} onChange={onChange} />}
      {subTab === "lanzamiento" && <LaunchTab client={client} onChange={onChange} globalMvpSteps={globalMvpSteps} globalFullSteps={globalFullSteps} />}
      {subTab === "ejecucion" && <EjecucionTab client={client} team={team} onChange={onChange} />}
      {subTab === "proceso" && <ProcesoComercialTab client={client} onChange={onChange} apiKey={apiKey} flowTemplates={flowTemplates} onSaveTemplate={onSaveTemplate} onDeleteTemplate={onDeleteTemplate} />}
    </div>
  );
}

// ─── CLIENTS LIST ─────────────────────────────────────────────────────────────
function ClientsList({ clients, onSelect, onCreate, onDelete, teamPin }) {
  const [search, setSearch] = useState("");
  const [showModal, setShowModal] = useState(false);
  const [newName, setNewName] = useState("");
  const [newChannel, setNewChannel] = useState("Meta Ads");
  const [view, setView] = useState("cards");
  const [hoveredId, setHoveredId] = useState(null);
  const [deleteConfirm, setDeleteConfirm] = useState(null);
  const [deletePinInput, setDeletePinInput] = useState("");
  const [deletePinError, setDeletePinError] = useState(false);

  const requestDelete = (e, c) => {
    e.stopPropagation();
    setDeleteConfirm({ id: c.id, name: c.name });
    setDeletePinInput("");
    setDeletePinError(false);
  };

  const confirmDelete = () => {
    if (teamPin && deletePinInput !== teamPin) { setDeletePinError(true); return; }
    onDelete && onDelete(deleteConfirm.id);
    setDeleteConfirm(null);
    setDeletePinInput("");
  };

  const filtered = clients.filter(c => c.name.toLowerCase().includes(search.toLowerCase()));

  const handleCreate = () => {
    if (!newName.trim()) return;
    onCreate(newName.trim(), newChannel);
    setNewName(""); setNewChannel("Meta Ads"); setShowModal(false);
  };

  const getStage = (pct) => {
    if (pct === 0)   return { label:"Por iniciar", color:"#60A5FA" };
    if (pct < 50)    return { label:"En proceso",  color:GOLD };
    if (pct < 100)   return { label:"En cierre",   color:"#A78BFA" };
    return               { label:"Completado",  color:GREEN };
  };

  const nextMeeting = (c) => {
    const now = new Date();
    const m = (c.meetings||[]).filter(m=>new Date(m.date)>=now).sort((a,b)=>a.date.localeCompare(b.date))[0];
    return m ? new Date(m.date).toLocaleDateString("es-CO",{day:"2-digit",month:"short"}) : "—";
  };

  const KANBAN_STAGES = ["Por iniciar","En proceso","En cierre","Completado"];

  return (
    <div>
      {/* Delete confirmation modal */}
      {deleteConfirm && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.7)", zIndex:9999, display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
          <div style={{ background:"#1A1A1D", border:"1px solid rgba(239,68,68,0.4)", borderRadius:12, padding:24, width:"100%", maxWidth:400 }}>
            <div style={{ fontSize:24, marginBottom:8 }}>🗑️</div>
            <div style={{ color:WHITE, fontWeight:700, fontSize:16, marginBottom:6 }}>Eliminar cliente</div>
            <div style={{ color:GRAY, fontSize:13, marginBottom:16, lineHeight:1.5 }}>
              Estás por eliminar a <strong style={{ color:WHITE }}>{deleteConfirm.name}</strong>. Esta acción no se puede deshacer y se perderán todos los datos, tareas y procesos del cliente.
            </div>
            {teamPin && (
              <div style={{ marginBottom:14 }}>
                <div style={{ color:GRAY, fontSize:12, marginBottom:6 }}>Ingresá tu PIN para confirmar:</div>
                <input type="password" value={deletePinInput} onChange={e=>{ setDeletePinInput(e.target.value); setDeletePinError(false); }}
                  placeholder="PIN" autoFocus
                  style={{ width:"100%", background:BG, border:`1px solid ${deletePinError?"#EF4444":BORDER}`, borderRadius:8, padding:"8px 12px", color:WHITE, fontSize:14, outline:"none", letterSpacing:4 }} />
                {deletePinError && <div style={{ color:"#EF4444", fontSize:11, marginTop:5 }}>PIN incorrecto.</div>}
              </div>
            )}
            <div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}>
              <button onClick={()=>setDeleteConfirm(null)}
                style={{ padding:"8px 18px", borderRadius:7, fontSize:13, cursor:"pointer", background:"#222225", color:WHITE, border:`1px solid ${BORDER}` }}>
                Cancelar
              </button>
              <button onClick={confirmDelete} disabled={teamPin && !deletePinInput}
                style={{ padding:"8px 20px", borderRadius:7, fontSize:13, cursor:"pointer", background:"#EF4444", color:WHITE, border:"none", fontWeight:700, opacity: teamPin && !deletePinInput ? 0.5 : 1 }}>
                Eliminar definitivamente
              </button>
            </div>
          </div>
        </div>
      )}

      <div style={{ display:"flex", gap:10, marginBottom:20, alignItems:"center" }}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar cliente..."
          style={{ flex:1, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8, padding:"9px 14px", color:WHITE, fontSize:13, outline:"none" }} />
        {/* View toggle */}
        <div style={{ display:"flex", gap:2, background:"#111113", borderRadius:8, padding:3, border:`1px solid ${BORDER}` }}>
          {[["cards","▦ Cards"],["tabla","≡ Tabla"],["kanban","⬜ Kanban"]].map(([v,l])=>(
            <button key={v} onClick={()=>setView(v)}
              style={{ padding:"5px 12px", borderRadius:6, fontSize:12, cursor:"pointer", fontWeight:600,
                background:view===v?"linear-gradient(135deg,#D4AF37,#B8962E)":"transparent",
                color:view===v?"#141414":GRAY, border:"none" }}>
              {l}
            </button>
          ))}
        </div>
        <button onClick={()=>setShowModal(true)} className="gp-btn-gold"
          style={{ padding:"9px 20px", background:GOLD, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13, letterSpacing:0.2 }}>
          + Nuevo cliente
        </button>
      </div>

      {filtered.length === 0 && (
        <div style={{ textAlign:"center", padding:"60px 0", color:GRAY }}>
          {clients.length === 0 ? "No hay clientes. Crea el primero." : "Sin resultados."}
        </div>
      )}

      {/* ── CARDS VIEW ── */}
      {view === "cards" && (
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))", gap:14 }}>
          {filtered.map(c => {
            const pct = overallPct(c.tasks);
            const isDone = pct === 100;
            const stage = getStage(pct);
            return (
              <div key={c.id}
                style={{ position:"relative", background:CARD, borderRadius:14, padding:"18px 16px", cursor:"pointer",
                  border:`1px solid ${hoveredId===c.id?GOLD+"66":isDone?GREEN+"44":BORDER}`,
                  borderTop:`2px solid ${hoveredId===c.id?GOLD:isDone?GREEN:BORDER}`,
                  boxShadow: hoveredId===c.id ? "0 6px 24px rgba(0,0,0,0.4)" : "0 2px 10px rgba(0,0,0,0.2)",
                  transform: hoveredId===c.id ? "translateY(-2px)" : "none",
                  transition:"all 0.2s ease" }}
                onClick={()=>onSelect(c.id)}
                onMouseEnter={()=>setHoveredId(c.id)}
                onMouseLeave={()=>setHoveredId(null)}>
                {onDelete && hoveredId===c.id && (
                  <button onClick={e=>requestDelete(e,c)}
                    title="Eliminar cliente"
                    style={{ position:"absolute", top:10, right:10, background:"rgba(239,68,68,0.12)", border:"1px solid rgba(239,68,68,0.25)", color:"#EF4444", cursor:"pointer", borderRadius:6, padding:"3px 8px", fontSize:11, fontWeight:700, lineHeight:1.4, zIndex:1 }}>
                    🗑
                  </button>
                )}
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:12, paddingRight: onDelete && hoveredId===c.id ? 28 : 0 }}>
                  <div>
                    <div style={{ color:WHITE, fontWeight:700, fontSize:15, letterSpacing:-0.2 }}>{c.name}</div>
                    <div style={{ color:GRAY, fontSize:11, marginTop:3 }}>{c.profile.channel||"Meta Ads"}</div>
                  </div>
                  <span style={{ fontSize:10, fontWeight:700, color:stage.color, background:stage.color+"18", padding:"3px 9px", borderRadius:10, border:`1px solid ${stage.color}30` }}>{stage.label}</span>
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:6 }}>
                  {WEEKS.map(w => {
                    const s = weekStats(c.tasks, w);
                    const wp = s.total ? Math.round(s.done/s.total*100) : 0;
                    return (
                      <div key={w}>
                        <div style={{ fontSize:9, color:GRAY, marginBottom:3 }}>{w.replace("Semana ","S")}</div>
                        <ProgressBar pct={wp} height={3} />
                        <div style={{ fontSize:9, color:GRAY, marginTop:2 }}>{s.done}/{s.total}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* ── TABLA VIEW ── */}
      {view === "tabla" && filtered.length > 0 && (
        <div style={{ background:CARD, border:`1px solid ${BORDER}`, borderRadius:12, overflow:"hidden" }}>
          <table style={{ width:"100%", borderCollapse:"collapse" }}>
            <thead>
              <tr style={{ borderBottom:`1px solid ${BORDER}` }}>
                {["Cliente","Canal","Contrato","Inicio","Progreso","Etapa","Próx. reunión",""].map(h=>(
                  <th key={h} style={{ padding:"10px 14px", textAlign:"left", fontSize:11, color:GRAY, fontWeight:600, whiteSpace:"nowrap" }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.map((c,i) => {
                const pct = overallPct(c.tasks);
                const stage = getStage(pct);
                return (
                  <tr key={c.id} onClick={()=>onSelect(c.id)}
                    style={{ borderBottom:`1px solid ${BORDER}`, cursor:"pointer", transition:"background 0.1s" }}
                    onMouseEnter={e=>e.currentTarget.style.background="#1E1E22"}
                    onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                    <td style={{ padding:"10px 14px", color:WHITE, fontWeight:600, fontSize:13 }}>{c.name}</td>
                    <td style={{ padding:"10px 14px", color:GRAY, fontSize:12 }}>{c.profile.channel||"Meta Ads"}</td>
                    <td style={{ padding:"10px 14px", color:GRAY, fontSize:12 }}>{c.profile.contractValue ? `$${Number(c.profile.contractValue).toLocaleString("es-CO")}` : "—"}</td>
                    <td style={{ padding:"10px 14px", color:GRAY, fontSize:12 }}>{c.profile.startDate ? new Date(c.profile.startDate).toLocaleDateString("es-CO",{day:"2-digit",month:"short"}) : "—"}</td>
                    <td style={{ padding:"10px 14px" }}>
                      <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                        <div style={{ flex:1, height:6, background:BORDER, borderRadius:3 }}>
                          <div style={{ height:6, width:`${pct}%`, background:stage.color, borderRadius:3 }} />
                        </div>
                        <span style={{ fontSize:11, color:stage.color, fontWeight:700, minWidth:32 }}>{pct}%</span>
                      </div>
                    </td>
                    <td style={{ padding:"10px 14px" }}>
                      <span style={{ fontSize:11, color:stage.color, background:stage.color+"18", padding:"2px 8px", borderRadius:10, fontWeight:600 }}>{stage.label}</span>
                    </td>
                    <td style={{ padding:"10px 14px", color:GRAY, fontSize:12 }}>{nextMeeting(c)}</td>
                    <td style={{ padding:"6px 10px" }}>
                      {onDelete && (
                        <button onClick={e=>{ e.stopPropagation(); requestDelete(e,c); }}
                          style={{ background:"rgba(239,68,68,0.1)", border:"none", color:"#EF4444", cursor:"pointer", borderRadius:6, padding:"4px 8px", fontSize:12 }}>
                          🗑
                        </button>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {/* ── KANBAN VIEW ── */}
      {view === "kanban" && (
        <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:14, alignItems:"start" }}>
          {KANBAN_STAGES.map(stage => {
            const stagePcts = { "Por iniciar":[0,0], "En proceso":[1,49], "En cierre":[50,99], "Completado":[100,100] };
            const [min,max] = stagePcts[stage];
            const stageClients = filtered.filter(c=>{ const p=overallPct(c.tasks); return p>=min&&p<=max; });
            const stageColor = getStage(min===0&&max===0?0:min===1?1:min===50?50:100).color;
            return (
              <div key={stage}>
                <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:10 }}>
                  <span style={{ width:8, height:8, borderRadius:"50%", background:stageColor, display:"inline-block" }} />
                  <span style={{ color:WHITE, fontWeight:600, fontSize:13 }}>{stage}</span>
                  <span style={{ color:GRAY, fontSize:11, marginLeft:"auto" }}>{stageClients.length}</span>
                </div>
                <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                  {stageClients.map(c => {
                    const pct = overallPct(c.tasks);
                    return (
                      <div key={c.id} style={{ position:"relative", background:CARD, border:`1px solid ${hoveredId===c.id?stageColor:BORDER}`, borderRadius:10, padding:"12px 14px", cursor:"pointer", transition:"border-color 0.15s" }}
                        onClick={()=>onSelect(c.id)}
                        onMouseEnter={()=>setHoveredId(c.id)}
                        onMouseLeave={()=>setHoveredId(null)}>
                        {onDelete && hoveredId===c.id && (
                          <button onClick={e=>requestDelete(e,c)}
                            style={{ position:"absolute", top:8, right:8, background:"rgba(239,68,68,0.15)", border:"none", color:"#EF4444", cursor:"pointer", borderRadius:5, padding:"2px 6px", fontSize:11, lineHeight:1.4 }}>
                            🗑
                          </button>
                        )}
                        <div style={{ color:WHITE, fontWeight:600, fontSize:13, marginBottom:4, paddingRight: onDelete && hoveredId===c.id ? 26 : 0 }}>{c.name}</div>
                        <div style={{ color:GRAY, fontSize:11, marginBottom:8 }}>{c.profile.channel||"Meta Ads"}</div>
                        <div style={{ height:4, background:BORDER, borderRadius:2 }}>
                          <div style={{ height:4, width:`${pct}%`, background:stageColor, borderRadius:2 }} />
                        </div>
                        <div style={{ display:"flex", justifyContent:"space-between", marginTop:4 }}>
                          <span style={{ fontSize:10, color:GRAY }}>{nextMeeting(c)}</span>
                          <span style={{ fontSize:10, color:stageColor, fontWeight:700 }}>{pct}%</span>
                        </div>
                      </div>
                    );
                  })}
                  {stageClients.length === 0 && (
                    <div style={{ border:`1px dashed ${BORDER}`, borderRadius:10, padding:"20px 0", textAlign:"center", color:GRAY, fontSize:11 }}>Sin clientes</div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {showModal && (
        <Modal title="Nuevo cliente" onClose={()=>setShowModal(false)}>
          <Input label="Nombre del cliente / empresa" value={newName} onChange={setNewName} placeholder="Empresa S.A.S." />
          <div style={{ marginBottom:16 }}>
            <label style={{ display:"block", color:GRAY, fontSize:12, marginBottom:4 }}>Canal de adquisición</label>
            <select value={newChannel} onChange={e=>setNewChannel(e.target.value)}
              style={{ width:"100%", background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8, padding:"8px 10px", color:WHITE, fontSize:13, outline:"none" }}>
              {CHANNELS.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <button onClick={handleCreate} style={{ width:"100%", padding:"10px", background:GOLD, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:14 }}>
            Crear cliente
          </button>
        </Modal>
      )}
    </div>
  );
}

// ─── TEAM TAB ─────────────────────────────────────────────────────────────────
function TeamTab({ data, onChange }) {
  const [newMember, setNewMember] = useState("");
  const [newRole, setNewRole] = useState("");
  const [showDiagram, setShowDiagram] = useState(false);

  const addMember = () => {
    if (!newMember.trim()) return;
    onChange({ ...data, team: [...data.team, { id:uid(), name:newMember.trim() }] });
    setNewMember("");
  };
  const removeMember = (id) => onChange({ ...data, team: data.team.filter(m=>m.id!==id) });

  const addRole = () => {
    if (!newRole.trim()) return;
    onChange({ ...data, roles: [...data.roles, { id:uid(), name:newRole.trim() }] });
    setNewRole("");
  };
  const removeRole = (id) => onChange({ ...data, roles: data.roles.filter(r=>r.id!==id) });

  const teamFlow = data.teamFlow || { id: "team_flow", name: "Organigrama del equipo", nodes: [], edges: [] };
  const updateTeamFlow = (updated) => onChange({ ...data, teamFlow: updated });
  const apiKey = data.settings?.apiKey || "";

  return (
    <div style={{ maxWidth:900 }}>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:24, maxWidth:700, marginBottom:28 }}>
        <div>
          <h3 style={{ color:WHITE, fontSize:15, fontWeight:600, marginBottom:14 }}>Equipo</h3>
          <div style={{ display:"flex", gap:8, marginBottom:12 }}>
            <input value={newMember} onChange={e=>setNewMember(e.target.value)} placeholder="Nombre"
              onKeyDown={e=>e.key==="Enter"&&addMember()}
              style={{ flex:1, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8, padding:"7px 10px", color:WHITE, fontSize:13, outline:"none" }} />
            <button onClick={addMember} style={{ padding:"7px 14px", background:GOLD, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700 }}>+</button>
          </div>
          {data.team.map(m => (
            <div key={m.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"7px 10px", background:CARD, border:`1px solid ${BORDER}`, borderRadius:8, marginBottom:6 }}>
              <span style={{ color:WHITE, fontSize:13 }}>{m.name}</span>
              <button onClick={()=>removeMember(m.id)} style={{ background:"none", border:"none", color:RED, cursor:"pointer", fontSize:13 }}>×</button>
            </div>
          ))}
        </div>
        <div>
          <h3 style={{ color:WHITE, fontSize:15, fontWeight:600, marginBottom:14 }}>Roles</h3>
          <div style={{ display:"flex", gap:8, marginBottom:12 }}>
            <input value={newRole} onChange={e=>setNewRole(e.target.value)} placeholder="Rol"
              onKeyDown={e=>e.key==="Enter"&&addRole()}
              style={{ flex:1, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8, padding:"7px 10px", color:WHITE, fontSize:13, outline:"none" }} />
            <button onClick={addRole} style={{ padding:"7px 14px", background:GOLD, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700 }}>+</button>
          </div>
          {data.roles.map(r => (
            <div key={r.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"7px 10px", background:CARD, border:`1px solid ${BORDER}`, borderRadius:8, marginBottom:6 }}>
              <span style={{ color:WHITE, fontSize:13 }}>{r.name}</span>
              <button onClick={()=>removeRole(r.id)} style={{ background:"none", border:"none", color:RED, cursor:"pointer", fontSize:13 }}>×</button>
            </div>
          ))}
        </div>
      </div>

      {/* Internal diagram */}
      <div style={{ borderTop:`1px solid ${BORDER}`, paddingTop:20 }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:14 }}>
          <div>
            <h3 style={{ color:WHITE, fontSize:15, fontWeight:600, margin:0 }}>Diagrama interno</h3>
            <div style={{ color:GRAY, fontSize:12, marginTop:3 }}>Organigrama, flujos de operación, estructura del equipo</div>
          </div>
          <button onClick={()=>setShowDiagram(s=>!s)}
            style={{ padding:"7px 16px", borderRadius:8, fontSize:12, cursor:"pointer", border:`1px solid ${showDiagram ? GOLD : BORDER}`, background:showDiagram?"rgba(212,175,55,0.1)":"transparent", color:showDiagram?GOLD:GRAY, fontWeight:600 }}>
            {showDiagram ? "✕ Cerrar" : "🗂 Abrir diagrama"}
          </button>
        </div>
        {showDiagram && (
          <div style={{ border:`1px solid ${BORDER}`, borderRadius:10, overflow:"hidden", height:520 }}>
            <FlowCanvas
              flow={teamFlow}
              clientName="Equipo GP"
              clientProfile={{}}
              clientTasks={[]}
              onUpdate={updateTeamFlow}
              apiKey={apiKey}
            />
          </div>
        )}
      </div>
    </div>
  );
}

function isoWeek(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay()||7));
  const y = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  return Math.ceil((((date-y)/86400000)+1)/7);
}

function EntrenamientoSection({ personal, onUpdate }) {
  const { useState: us } = React;
  const trainingLogs = personal.trainingLogs || {};
  const bodyLogs     = personal.bodyLogs     || {};
  const measurements = personal.measurements  || [];
  const manualPRs    = personal.manualPRs    || {};

  const today    = new Date();
  const todayStr = today.toISOString().slice(0,10);
  const dowMap   = { 1:"lun",2:"mar",3:"mie",4:"jue",5:"vie",6:"sab" };
  const todayId  = dowMap[today.getDay()] || "lun";

  const [subTab,       setSubTab]       = us("sesion");
  const [selDayId,     setSelDayId]     = us(todayId);
  const [openExId,     setOpenExId]     = us(null);
  const [inputW,       setInputW]       = us("");
  const [inputR,       setInputR]       = us("");
  const [inputRIR,     setInputRIR]     = us("1");
  const [dfStage,      setDfStage]      = us(1); // 1=DF1, 2=DF2
  const [weekOffset,   setWeekOffset]   = us(0);
  // cuerpo inputs
  const [bw,   setBw]   = us(bodyLogs[todayStr]?.weight   || "");
  const [kcal, setKcal] = us(bodyLogs[todayStr]?.calories || "");
  const [prot, setProt] = us(bodyLogs[todayStr]?.protein  || "");
  const [slp,  setSlp]  = us(bodyLogs[todayStr]?.sleep    || "");
  const [pain, setPain] = us(bodyLogs[todayStr]?.pain     || "");
  const [fat,  setFat]  = us(bodyLogs[todayStr]?.fatigue  || "");
  const [mDate,setMDate]= us("");
  const [mArm, setMArm] = us("");
  const [mLeg, setMLeg] = us("");
  const [mWst, setMWst] = us("");

  const selDay = PPL_PLAN.find(d=>d.id===selDayId);
  const todayLog = trainingLogs[todayStr]?.[selDayId] || { completed:false, exercises:{} };

  const getSets = (exId) => todayLog.exercises?.[exId]?.sets || [];

  const setLog = (patch) => {
    const newLog = { ...todayLog, ...patch };
    onUpdate({ trainingLogs: { ...trainingLogs, [todayStr]: { ...(trainingLogs[todayStr]||{}), [selDayId]: newLog } } });
  };

  const addSet = (exId, type) => {
    const w = parseFloat(inputW); const r = parseInt(inputR);
    if (!w||!r) return;
    const sets = [...getSets(exId), { type, weight:w, reps:r, rir:parseInt(inputRIR)||0 }];
    setLog({ exercises: { ...todayLog.exercises, [exId]:{ sets } } });
    setInputW(""); setInputR("");
    if (type==="DF1") setDfStage(2);
    else { setDfStage(1); setOpenExId(null); }
  };

  const removeLastSet = (exId) => {
    const sets = getSets(exId).slice(0,-1);
    setLog({ exercises: { ...todayLog.exercises, [exId]:{ sets } } });
    if (selDay?.exercises.find(e=>e.id===exId)?.doubleF) setDfStage(sets.filter(s=>s.type==="DF1").length>sets.filter(s=>s.type==="DF2").length?2:1);
  };

  // PRs
  const getPR = (exId) => {
    let best = null;
    Object.entries(trainingLogs).forEach(([date, sess]) => {
      Object.values(sess).forEach(s => {
        (s.exercises?.[exId]?.sets||[]).filter(st=>st.type==="N").forEach(st => {
          if (!best || st.weight > best.weight || (st.weight===best.weight && st.reps>best.reps))
            best = { weight:st.weight, reps:st.reps, date };
        });
      });
    });
    return best;
  };

  // Effective volume for week
  const getVolume = (offset) => {
    const vol = {};
    Object.entries(trainingLogs).forEach(([date, daySess]) => {
      const d = new Date(date);
      if (isoWeek(d) !== isoWeek(new Date(Date.now() - offset*7*86400000))) return;
      Object.values(daySess).forEach(sess => {
        Object.entries(sess.exercises||{}).forEach(([exId, exData]) => {
          let muscle = "Otro";
          PPL_PLAN.forEach(day => { const ex = day.exercises.find(e=>e.id===exId); if(ex) muscle=ex.muscle; });
          const sets = exData.sets||[];
          const nSets = sets.filter(s=>s.type==="N").length;
          const df1 = sets.filter(s=>s.type==="DF1").length;
          const df2 = sets.filter(s=>s.type==="DF2").length;
          const eff = nSets + Math.min(df1,df2)*1.5 + Math.abs(df1-df2)*0.75;
          vol[muscle] = (vol[muscle]||0) + eff;
        });
      });
    });
    return vol;
  };

  // Progression
  const getProgression = (exId, repsMin, repsMax) => {
    const sessions = [];
    Object.entries(trainingLogs).sort().reverse().forEach(([date, daySess]) => {
      Object.values(daySess).forEach(sess => {
        const sets = (sess.exercises?.[exId]?.sets||[]).filter(s=>s.type==="N");
        if (sets.length) sessions.push(sets);
      });
    });
    if (sessions.length < 2) return "datos";
    const allMaxLast = sessions[0].every(s=>s.reps>=repsMax);
    const allMaxPrev = sessions[1].every(s=>s.reps>=repsMax);
    const anyLowLast = sessions[0].some(s=>s.reps<repsMin);
    const anyLowPrev = sessions[1].some(s=>s.reps<repsMin);
    if (allMaxLast && allMaxPrev) return "subir";
    if (anyLowLast && anyLowPrev) return "bajar";
    return "mantener";
  };

  const saveBodyLog = () => {
    const prev = bodyLogs[todayStr] || {};
    const entry = { ...prev,
      weight:parseFloat(bw)||null, calories:parseInt(kcal)||null,
      protein:parseInt(prot)||null, sleep:parseFloat(slp)||null,
      pain:parseInt(pain)||null, fatigue:parseInt(fat)||null,
    };
    onUpdate({ bodyLogs: { ...bodyLogs, [todayStr]: entry } });
  };

  const saveMeasurement = () => {
    if (!mDate) return;
    const entry = { date:mDate, arm:parseFloat(mArm)||null, leg:parseFloat(mLeg)||null, waist:parseFloat(mWst)||null };
    const existing = measurements.filter(m=>m.date!==mDate);
    onUpdate({ measurements: [...existing, entry].sort((a,b)=>a.date.localeCompare(b.date)) });
    setMDate(""); setMArm(""); setMLeg(""); setMWst("");
  };

  const tabs = [["sesion","Sesión"],["volumen","Volumen"],["alertas","Alertas"],["cuerpo","Cuerpo"]];
  const inp = (v,s,ph,w=70) => (
    <input value={v} onChange={e=>s(e.target.value)} placeholder={ph}
      style={{ width:w, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:6, padding:"5px 8px", color:WHITE, fontSize:12, outline:"none" }} />
  );

  const vol = subTab==="volumen" ? getVolume(weekOffset) : {};

  return (
    <div>
      {/* Sub-tabs */}
      <div style={{ display:"flex", gap:0, marginBottom:18, borderBottom:`1px solid ${BORDER}` }}>
        {tabs.map(([id,label])=>(
          <button key={id} onClick={()=>setSubTab(id)}
            className={`gp-nav-tab${subTab===id?" active":""}`}
            style={{ padding:"8px 14px" }}>
            {label}
          </button>
        ))}
      </div>

      {/* ── SESIÓN ── */}
      {subTab==="sesion" && (
        <div>
          {/* Day selector */}
          <div style={{ display:"flex", gap:8, marginBottom:20, flexWrap:"wrap" }}>
            {PPL_PLAN.map(d=>{
              const isToday = d.id===todayId;
              const sel = d.id===selDayId;
              const done = trainingLogs[todayStr]?.[d.id]?.completed;
              return (
                <button key={d.id} onClick={()=>{ setSelDayId(d.id); setOpenExId(null); setDfStage(1); }}
                  style={{ padding:"8px 14px", borderRadius:10, border:`2px solid ${sel?d.color:BORDER}`,
                    background: sel ? d.color+"22" : "transparent", color:sel?d.color:GRAY, cursor:"pointer", fontSize:12, fontWeight:sel?700:400,
                    position:"relative" }}>
                  {d.emoji} {d.day}
                  {isToday && <span style={{ position:"absolute", top:-4, right:-4, width:8, height:8, background:GOLD, borderRadius:"50%", display:"block" }} />}
                  {done && <span style={{ marginLeft:4, color:"#22C55E" }}>✓</span>}
                </button>
              );
            })}
          </div>

          {/* Session header */}
          <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:16 }}>
            <span style={{ fontSize:20 }}>{selDay?.emoji}</span>
            <div>
              <div style={{ color:WHITE, fontWeight:700, fontSize:15 }}>{selDay?.session}</div>
              <div style={{ color:GRAY, fontSize:12 }}>{selDay?.day}</div>
            </div>
            {!todayLog.completed && (
              <button onClick={()=>setLog({ completed:true })}
                style={{ marginLeft:"auto", padding:"6px 14px", background:"#22C55E22", color:"#22C55E", border:"1px solid #22C55E55", borderRadius:8, cursor:"pointer", fontSize:12, fontWeight:600 }}>
                ✓ Sesión completa
              </button>
            )}
            {todayLog.completed && <span style={{ marginLeft:"auto", color:"#22C55E", fontSize:13, fontWeight:700 }}>✓ Completada</span>}
          </div>

          {/* Exercise list */}
          {selDay?.exercises.map((ex, idx) => {
            const sets = getSets(ex.id);
            const nSets = sets.filter(s=>s.type==="N");
            const df1   = sets.filter(s=>s.type==="DF1");
            const df2   = sets.filter(s=>s.type==="DF2");
            const isOpen = openExId===ex.id;
            const pr = getPR(ex.id);
            return (
              <div key={ex.id} style={{ marginBottom:10, background:CARD, borderRadius:10, border:`1px solid ${isOpen?selDay?.color+"44":BORDER}`, borderLeft:`4px solid ${selDay?.color||GOLD}`, overflow:"hidden", transition:"border-color 0.2s" }}>
                {/* Header row */}
                <div onClick={()=>{ setOpenExId(isOpen?null:ex.id); setDfStage(1); setInputW(""); setInputR(""); }}
                  style={{ display:"flex", alignItems:"center", gap:10, padding:"11px 14px", cursor:"pointer" }}>
                  <span style={{ color:selDay?.color||GRAY, fontSize:11, width:22, textAlign:"right", fontWeight:700 }}>{idx+1}</span>
                  <div style={{ flex:1 }}>
                    <div style={{ color:WHITE, fontSize:13, fontWeight:700 }}>{ex.name}</div>
                    <div style={{ display:"flex", alignItems:"center", gap:6, marginTop:2 }}>
                      <span style={{ color:GRAY, fontSize:10 }}>{ex.sets} series · {ex.repsMin}–{ex.repsMax} reps · RIR {ex.rir}</span>
                      {ex.doubleF && <span style={{ fontSize:9, color:"#F59E0B", background:"#F59E0B22", padding:"1px 6px", borderRadius:4, fontWeight:700 }}>DOBLE FALLO</span>}
                      <span style={{ fontSize:10, color:selDay?.color+"99", background:selDay?.color+"11", padding:"1px 6px", borderRadius:4 }}>{ex.muscle}</span>
                    </div>
                  </div>
                  <div style={{ display:"flex", gap:6, alignItems:"center" }}>
                    {nSets.length>0 && <span style={{ color:"#22C55E", fontSize:11 }}>{nSets.length} series</span>}
                    {df1.length>0 && <span style={{ fontSize:11, color:"#F59E0B" }}>DF{df1.length}/{df2.length}</span>}
                    {pr && <span style={{ fontSize:11, color:GOLD_DIM }}>PR:{pr.weight}kg×{pr.reps}</span>}
                    <span style={{ color:GRAY, fontSize:14 }}>{isOpen?"▲":"▼"}</span>
                  </div>
                </div>

                {/* Logged sets */}
                {sets.length>0 && (
                  <div style={{ padding:"0 14px 8px", display:"flex", gap:6, flexWrap:"wrap" }}>
                    {sets.map((s,i)=>(
                      <span key={i} style={{ fontSize:11, padding:"3px 8px", borderRadius:6,
                        background: s.type==="N" ? "#22C55E22" : "#F59E0B22",
                        color: s.type==="N" ? "#22C55E" : "#F59E0B",
                        border: `1px solid ${s.type==="N"?"#22C55E44":"#F59E0B44"}` }}>
                        {s.type!=="N"?s.type+" ":""}{s.weight}kg×{s.reps} RIR{s.rir}
                      </span>
                    ))}
                    <button onClick={()=>removeLastSet(ex.id)}
                      style={{ fontSize:11, padding:"3px 8px", borderRadius:6, background:"transparent", color:GRAY, border:`1px solid ${BORDER}`, cursor:"pointer" }}>
                      ✕ deshacer
                    </button>
                  </div>
                )}

                {/* Cues */}
                {isOpen && EXERCISE_CUES[ex.id] && (
                  <div style={{ padding:"12px 14px 10px", background:"#0a0a0b", borderTop:`1px solid ${BORDER}22` }}>
                    {EXERCISE_CUES[ex.id].equipment && (
                      <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:10 }}>
                        {EXERCISE_CUES[ex.id].equipment.split(" / ").map((eq,i)=>(
                          <span key={i} style={{ fontSize:10, padding:"3px 9px", borderRadius:12, background:selDay?.color+"18", color:selDay?.color||GOLD, border:`1px solid ${selDay?.color||GOLD}33`, fontWeight:600 }}>{eq}</span>
                        ))}
                      </div>
                    )}
                    <div style={{ color:GOLD, fontSize:11, fontWeight:700, marginBottom:5 }}>FOCO</div>
                    <div style={{ color:WHITE, fontSize:12, lineHeight:1.6, marginBottom:8 }}>{EXERCISE_CUES[ex.id].focus}</div>
                    <div style={{ color:GRAY, fontSize:11, fontStyle:"italic", lineHeight:1.6, borderTop:`1px solid ${BORDER}33`, paddingTop:8 }}>{EXERCISE_CUES[ex.id].why}</div>
                  </div>
                )}

                {/* Input form */}
                {isOpen && (
                  <div style={{ padding:"0 14px 12px", borderTop:`1px solid ${BORDER}` }}>
                    {ex.doubleF && (
                      <div style={{ marginTop:8, marginBottom:8, fontSize:11, color:"#F59E0B", fontWeight:600 }}>
                        {dfStage===1 || nSets.length<ex.sets
                          ? (nSets.length<ex.sets ? `Serie normal ${nSets.length+1}/${ex.sets}` : "Doble Fallo — Serie 1 al fallo")
                          : "Doble Fallo — Serie 2 al fallo (10s descanso)"}
                      </div>
                    )}
                    {!ex.doubleF && (
                      <div style={{ marginTop:8, marginBottom:8, fontSize:11, color:GRAY }}>
                        Serie {nSets.length+1}/{ex.sets}
                      </div>
                    )}
                    <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
                      {inp(inputW, setInputW, "Peso kg", 80)}
                      {inp(inputR, setInputR, "Reps",    60)}
                      <select value={inputRIR} onChange={e=>setInputRIR(e.target.value)}
                        style={{ background:"#111113", border:`1px solid ${BORDER}`, borderRadius:6, padding:"5px 8px", color:WHITE, fontSize:12, outline:"none" }}>
                        {[0,1,2,3,4].map(n=><option key={n} value={n}>RIR {n}</option>)}
                      </select>
                      {ex.doubleF && nSets.length>=ex.sets ? (
                        dfStage===1
                          ? <button onClick={()=>addSet(ex.id,"DF1")} style={{ padding:"5px 14px", background:"#F59E0B", color:"#141414", border:"none", borderRadius:6, cursor:"pointer", fontSize:12, fontWeight:700 }}>DF1 ✓</button>
                          : <button onClick={()=>addSet(ex.id,"DF2")} style={{ padding:"5px 14px", background:"#EC4899", color:"#141414", border:"none", borderRadius:6, cursor:"pointer", fontSize:12, fontWeight:700 }}>DF2 ✓</button>
                      ) : (
                        <button onClick={()=>addSet(ex.id,"N")} style={{ padding:"5px 14px", background:GOLD, color:"#141414", border:"none", borderRadius:6, cursor:"pointer", fontSize:12, fontWeight:700 }}>+ Serie</button>
                      )}
                    </div>
                  </div>
                )}
              </div>
            );
          })}

          {/* Mentalidad del día — embebida en la sesión */}
          {(()=>{
            const dm = DAY_MINDSET[selDayId] || DAY_MINDSET["lun"];
            const dmColor = dm.emoji==="🔴"?"#EF4444":dm.emoji==="🔵"?"#3B82F6":dm.emoji==="🟢"?"#22C55E":dm.emoji==="🟡"?"#F59E0B":dm.emoji==="🟣"?"#8B5CF6":"#EC4899";
            return (
              <div style={{ marginTop:20, background:"#0a0a0b", border:`1px solid ${dmColor}44`, borderRadius:12, padding:20, borderLeft:`4px solid ${dmColor}` }}>
                <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:12 }}>
                  <span style={{ fontSize:24 }}>{dm.emoji}</span>
                  <div>
                    <div style={{ color:GRAY, fontSize:10, fontWeight:700, letterSpacing:2, marginBottom:2 }}>{dm.label} · {dm.muscles}</div>
                    <div style={{ color:WHITE, fontWeight:900, fontSize:16, letterSpacing:0.5 }}>{dm.headline}</div>
                  </div>
                </div>
                <div style={{ color:GRAY, fontSize:12, lineHeight:1.9, whiteSpace:"pre-line", marginBottom:12 }}>{dm.body}</div>
                <div style={{ background:"rgba(255,255,255,0.04)", borderRadius:8, padding:"10px 14px", marginBottom:10 }}>
                  <div style={{ color:GOLD, fontSize:10, fontWeight:700, letterSpacing:1, marginBottom:3 }}>DESAFÍO DE HOY</div>
                  <div style={{ color:WHITE, fontSize:12, lineHeight:1.6 }}>{dm.challenge}</div>
                </div>
                <div style={{ color:GOLD_DIM, fontSize:11, fontStyle:"italic" }}>✦ {dm.key}</div>
              </div>
            );
          })()}
        </div>
      )}


      {/* ── VOLUMEN ── */}
      {subTab==="volumen" && (
        <div>
          <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:16 }}>
            <button onClick={()=>setWeekOffset(w=>w+1)} style={{ background:CARD, border:`1px solid ${BORDER}`, color:WHITE, borderRadius:6, padding:"4px 10px", cursor:"pointer", fontSize:13 }}>←</button>
            <span style={{ color:WHITE, fontWeight:600, fontSize:13 }}>
              {weekOffset===0 ? "Semana actual" : `Hace ${weekOffset} semana${weekOffset>1?"s":""}`}
            </span>
            <button onClick={()=>setWeekOffset(w=>Math.max(0,w-1))} disabled={weekOffset===0}
              style={{ background:CARD, border:`1px solid ${BORDER}`, color:weekOffset===0?GRAY:WHITE, borderRadius:6, padding:"4px 10px", cursor:weekOffset===0?"default":"pointer", fontSize:13 }}>→</button>
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))", gap:10 }}>
            {Object.entries(MUSCLE_TARGETS).map(([muscle,[min,opt,max]])=>{
              const v = Math.round((vol[muscle]||0)*10)/10;
              const pct = Math.min(100, v/max*100);
              const barColor = v<min?"#EF4444": v<=opt?"#22C55E":"#F59E0B";
              return (
                <div key={muscle} style={{ background:CARD, borderRadius:10, padding:"12px 14px", border:`1px solid ${BORDER}` }}>
                  <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
                    <span style={{ color:WHITE, fontSize:12, fontWeight:600 }}>{muscle}</span>
                    <span style={{ color:barColor, fontSize:13, fontWeight:700 }}>{v}</span>
                  </div>
                  <div style={{ height:4, background:"#222", borderRadius:2 }}>
                    <div style={{ height:"100%", width:pct+"%", background:barColor, borderRadius:2, transition:"width 0.3s" }} />
                  </div>
                  <div style={{ color:GRAY, fontSize:10, marginTop:4 }}>Óptimo: {min}–{opt} · Máx: {max}</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── ALERTAS / PRs ── */}
      {subTab==="alertas" && (
        <div>
          <div style={{ color:GRAY, fontSize:12, marginBottom:16, lineHeight:1.6 }}>
            Registrá tu peso actual · 2 sesiones llegando al tope de reps → subir · 2 sesiones sin alcanzar el mínimo → bajar
          </div>
          {PPL_PLAN.map(day=>(
            <div key={day.id} style={{ marginBottom:22 }}>
              <div style={{ color:day.color, fontWeight:700, fontSize:12, marginBottom:8, letterSpacing:0.5 }}>{day.emoji} {day.session}</div>
              {day.exercises.map(ex=>{
                const prog = getProgression(ex.id, ex.repsMin, ex.repsMax);
                const autoPR = getPR(ex.id);
                const manualW = manualPRs[ex.id] || "";
                const effectiveW = manualW || autoPR?.weight || null;
                const sugg = prog==="subir" && effectiveW ? Math.round(effectiveW*1.025/2.5)*2.5 : prog==="bajar" && effectiveW ? Math.round(effectiveW*0.925/2.5)*2.5 : null;
                const progColor = prog==="subir"?"#22C55E": prog==="bajar"?"#EF4444": GOLD;
                return (
                  <div key={ex.id} style={{ padding:"10px 12px", background:CARD, borderRadius:8, marginBottom:6, border:`1px solid ${BORDER}`, borderLeft:`3px solid ${progColor}44` }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
                      <span style={{ flex:1, color:WHITE, fontSize:12, fontWeight:600 }}>{ex.name}</span>
                      <span style={{ fontSize:11, fontWeight:700, padding:"2px 10px", borderRadius:6,
                        background: prog==="subir"?"#22C55E18": prog==="bajar"?"#EF444418":"transparent",
                        color: progColor }}>
                        {prog==="subir"?"⬆ Subir": prog==="bajar"?"⬇ Bajar": prog==="mantener"?"✓ Mantener":"—"}
                      </span>
                      {sugg && <span style={{ color:GOLD, fontSize:11, fontWeight:700 }}>→ {sugg} kg</span>}
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                      <span style={{ color:GRAY, fontSize:10 }}>Peso actual:</span>
                      <input type="number" value={manualW} placeholder={autoPR ? `${autoPR.weight}` : "kg"}
                        onChange={e=>{ const v=e.target.value; onUpdate({ manualPRs:{ ...manualPRs, [ex.id]:v===''?null:parseFloat(v) } }); }}
                        style={{ width:72, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:6, padding:"4px 8px", color:WHITE, fontSize:12, outline:"none" }} />
                      <span style={{ color:GRAY, fontSize:10 }}>kg</span>
                      {autoPR && <span style={{ color:GRAY, fontSize:10, marginLeft:4 }}>· Log: {autoPR.weight}×{autoPR.reps} reps</span>}
                    </div>
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      )}

      {/* ── MENTALIDAD (WEEKLY REVIEW TAB — moved to Sesión) ── */}
      {false && (()=>{
        const dm = DAY_MINDSET[selDayId] || DAY_MINDSET["lun"];
        const weekNum = isoWeek(new Date());
        const startWeek = isoWeek(new Date("2026-07-10"));
        const relWeek = Math.max(1, weekNum - startWeek + 1);
        const themeIdx = (relWeek - 1) % 8;
        const wt = WEEKLY_THEMES[themeIdx];
        const weekKey = `${new Date().getFullYear()}-W${String(weekNum).padStart(2,"0")}`;
        const weeklyReflections = personal.weeklyReflections || {};
        const thisWeek = weeklyReflections[weekKey] || { note:"", prs:"", rating:0 };

        const saveReflection = (patch) => {
          onUpdate({ weeklyReflections: { ...weeklyReflections, [weekKey]: { ...thisWeek, ...patch } } });
        };

        // Auto-detect PRs this week vs all time before
        const weekPRs = [];
        PPL_PLAN.forEach(day => {
          day.exercises.forEach(ex => {
            let weekBest = null, prevBest = null;
            Object.entries(trainingLogs).forEach(([date, daySess]) => {
              const d = new Date(date);
              const isThisWeek = isoWeek(d) === weekNum && d.getFullYear() === new Date().getFullYear();
              Object.values(daySess).forEach(sess => {
                (sess.exercises?.[ex.id]?.sets||[]).filter(s=>s.type==="N").forEach(s => {
                  if (isThisWeek) { if (!weekBest || s.weight > weekBest.w || (s.weight===weekBest.w && s.reps>weekBest.r)) weekBest={w:s.weight,r:s.reps}; }
                  else           { if (!prevBest || s.weight > prevBest.w || (s.weight===prevBest.w && s.reps>prevBest.r)) prevBest={w:s.weight,r:s.reps}; }
                });
              });
            });
            if (weekBest && (!prevBest || weekBest.w > prevBest.w || (weekBest.w===prevBest.w && weekBest.r>prevBest.r))) {
              weekPRs.push({ name:ex.name, weight:weekBest.w, reps:weekBest.r });
            }
          });
        });

        return (
          <div>
            {/* HOY — día específico */}
            <div style={{ background:"#0a0a0b", border:`1px solid ${dm.emoji==="🔴"?"#EF4444":dm.emoji==="🔵"?"#3B82F6":dm.emoji==="🟢"?"#22C55E":dm.emoji==="🟡"?"#F59E0B":dm.emoji==="🟣"?"#8B5CF6":"#EC4899"}44`, borderRadius:12, padding:22, marginBottom:14, borderLeft:`4px solid ${dm.emoji==="🔴"?"#EF4444":dm.emoji==="🔵"?"#3B82F6":dm.emoji==="🟢"?"#22C55E":dm.emoji==="🟡"?"#F59E0B":dm.emoji==="🟣"?"#8B5CF6":"#EC4899"}` }}>
              <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:12 }}>
                <span style={{ fontSize:24 }}>{dm.emoji}</span>
                <div>
                  <div style={{ color:GRAY, fontSize:10, fontWeight:700, letterSpacing:2 }}>{dm.label} · {dm.muscles}</div>
                  <div style={{ color:WHITE, fontWeight:900, fontSize:17, letterSpacing:0.5 }}>{dm.headline}</div>
                </div>
              </div>
              <div style={{ color:GRAY, fontSize:13, lineHeight:1.8, whiteSpace:"pre-line", marginBottom:12 }}>{dm.body}</div>
              <div style={{ background:"rgba(255,255,255,0.04)", borderRadius:8, padding:"10px 14px", marginBottom:10 }}>
                <div style={{ color:GOLD, fontSize:11, fontWeight:700, marginBottom:3 }}>DESAFÍO DE HOY</div>
                <div style={{ color:WHITE, fontSize:13 }}>{dm.challenge}</div>
              </div>
              <div style={{ color:GOLD_DIM, fontSize:11, fontStyle:"italic" }}>✦ {dm.key}</div>

              {weekPRs.length>0 && (

                  <div style={{ color:GOLD, fontWeight:700, fontSize:11, letterSpacing:1, marginBottom:8 }}>PRs DETECTADOS ESTA SEMANA</div>

                      style={{ width:34, height:34, borderRadius:8, border:`1px solid ${thisWeek.rating>=n?GOLD:BORDER}`,
                        background:thisWeek.rating>=n?"#D4AF3722":"transparent", color:thisWeek.rating>=n?GOLD:GRAY,
                        cursor:"pointer", fontSize:16, fontWeight:700 }}>

              {/* Mejoras manuales */}
              <div style={{ marginBottom:10 }}>
                <div style={{ color:GRAY, fontSize:11, marginBottom:4 }}>¿Qué mejoró esta semana? (pesos subidos, técnica, energía...)</div>

          {/* Day counter + weight goal */}

            const lastW = Object.entries(bodyLogs).sort((a,b)=>b[0].localeCompare(a[0])).find(([,v])=>v.weight)?.[1]?.weight;

            return (
              <>
                {/* Banner día X */}
                <div style={{ background:"#0a0a0b", border:`1px solid ${GOLD}44`, borderRadius:12, padding:18, marginBottom:16, borderLeft:`4px solid ${GOLD}` }}>
                  <div style={{ display:"flex", alignItems:"center", gap:16, marginBottom:12 }}>
                    <div style={{ textAlign:"center" }}>
                      <div style={{ color:GOLD, fontWeight:900, fontSize:32, lineHeight:1 }}>DÍA {dayN}</div>

                      <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
                        <span style={{ color:WHITE, fontSize:12, fontWeight:600 }}>Meta: {wg.target} kg</span>

                      </div>
                      <div style={{ height:6, background:"#222", borderRadius:3 }}>
                        <div style={{ height:"100%", width:pct+"%", background:`linear-gradient(90deg,${GOLD},#22C55E)`, borderRadius:3, transition:"width 0.5s" }} />

                  {/* Macro targets */}
                  <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:8 }}>
                    {macros.map(m=>{
                      const filled = m.val ? Math.min(100, Math.round(m.val/m.target*100)) : 0;

                          </div>
                          <div style={{ height:3, background:"#222", borderRadius:2 }}>
                            <div style={{ height:"100%", width:filled+"%", background:over?"#EF4444":m.color, borderRadius:2 }} />
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </>
            );
          })()}

          {/* Daily log */}
          <div style={{ background:CARD, borderRadius:12, padding:18, border:`1px solid ${BORDER}`, marginBottom:20 }}>
            <div style={{ color:WHITE, fontWeight:700, fontSize:13, marginBottom:14 }}>Registro diario — {todayStr}</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12, marginBottom:14 }}>
              {[["Peso corporal (kg)",bw,setBw,"87"],["Calorías",kcal,setKcal,"2250"],["Proteína (g)",prot,setProt,"225"],
                ["Carbs (g)",(bodyLogs[todayStr]?.carbs||""),v=>onUpdate({bodyLogs:{...bodyLogs,[todayStr]:{...(bodyLogs[todayStr]||{}),carbs:parseFloat(v)||0}}}),"170"],
                ["Grasas (g)",(bodyLogs[todayStr]?.fat||""),v=>onUpdate({bodyLogs:{...bodyLogs,[todayStr]:{...(bodyLogs[todayStr]||{}),fat:parseFloat(v)||0}}}),"75"],
                ["Sueño (h)",slp,setSlp,"8"],
                ["Dolor articular (1-5)",pain,setPain,"1-5"],["Fatiga subjetiva (1-5)",fat,setFat,"1-5"]
              ].map(([label,val,setter,ph])=>(
                <div key={label}>
                  <div style={{ color:GRAY, fontSize:11, marginBottom:4 }}>{label}</div>
                  <input value={val} onChange={e=>typeof setter==="function"&&setter(e.target.value)} placeholder={ph}
                    style={{ width:"100%", background:"#111113", border:`1px solid ${BORDER}`, borderRadius:6, padding:"6px 10px", color:WHITE, fontSize:13, outline:"none", boxSizing:"border-box" }} />
                </div>
              ))}
            </div>
            <button onClick={saveBodyLog} style={{ padding:"7px 20px", background:GOLD, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:12 }}>Guardar</button>
          </div>

          {/* Measurements */}
          <div style={{ background:CARD, borderRadius:12, padding:18, border:`1px solid ${BORDER}`, marginBottom:20 }}>
            <div style={{ color:WHITE, fontWeight:700, fontSize:13, marginBottom:14 }}>Medidas corporales (cada 4 semanas)</div>
            <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:12 }}>
              <input value={mDate} onChange={e=>setMDate(e.target.value)} type="date"
                style={{ background:"#111113", border:`1px solid ${BORDER}`, borderRadius:6, padding:"5px 8px", color:WHITE, fontSize:12, outline:"none" }} />
              {[["Brazo cm",mArm,setMArm],["Pierna cm",mLeg,setMLeg],["Cintura cm",mWst,setMWst]].map(([ph,v,s])=>(
                <input key={ph} value={v} onChange={e=>s(e.target.value)} placeholder={ph}
                  style={{ width:90, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:6, padding:"5px 8px", color:WHITE, fontSize:12, outline:"none" }} />
              ))}
              <button onClick={saveMeasurement} style={{ padding:"5px 14px", background:GOLD, color:"#141414", border:"none", borderRadius:6, cursor:"pointer", fontSize:12, fontWeight:700 }}>+</button>
            </div>
            {measurements.length>0 && (
              <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}>
                <thead><tr style={{ color:GRAY }}>
                  {["Fecha","Brazo","Pierna","Cintura"].map(h=><th key={h} style={{ textAlign:"left", padding:"4px 8px", borderBottom:`1px solid ${BORDER}` }}>{h}</th>)}
                </tr></thead>
                <tbody>
                  {[...measurements].reverse().map((m,i)=>(
                    <tr key={i} style={{ color:WHITE }}>
                      <td style={{ padding:"4px 8px" }}>{m.date}</td>
                      <td style={{ padding:"4px 8px" }}>{m.arm ? m.arm+"cm" : "—"}</td>
                      <td style={{ padding:"4px 8px" }}>{m.leg ? m.leg+"cm" : "—"}</td>
                      <td style={{ padding:"4px 8px" }}>{m.waist ? m.waist+"cm" : "—"}</td>

                </tbody>
              </table>
            )}
          </div>

          {/* Body log history */}
          {Object.keys(bodyLogs).length>0 && (
            <div style={{ background:CARD, borderRadius:12, padding:18, border:`1px solid ${BORDER}` }}>
              <div style={{ color:WHITE, fontWeight:700, fontSize:13, marginBottom:12 }}>Historial</div>
              <table style={{ width:"100%", borderCollapse:"collapse", fontSize:11 }}>
                <thead><tr style={{ color:GRAY }}>
                  {["Fecha","Peso","Kcal","Prot","Carbs","Grasa","Sueño","Dolor","Fatiga"].map(h=>(
                    <th key={h} style={{ textAlign:"left", padding:"4px 8px", borderBottom:`1px solid ${BORDER}` }}>{h}</th>
                  ))}
                </tr></thead>
                <tbody>
                  {Object.entries(bodyLogs).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,30).map(([date,log])=>(
                    <tr key={date} style={{ color:WHITE }}>
                      <td style={{ padding:"4px 8px", color:GRAY }}>{date}</td>
                      <td style={{ padding:"4px 8px", fontWeight:600 }}>{log.weight||"—"}</td>
                      <td style={{ padding:"4px 8px", color: log.calories>2250?"#EF4444":log.calories>=2100?"#22C55E":GRAY }}>{log.calories||"—"}</td>
                      <td style={{ padding:"4px 8px", color: log.protein>=200?"#22C55E":log.protein>=150?"#F59E0B":"#EF4444" }}>{log.protein||"—"}</td>
                      <td style={{ padding:"4px 8px" }}>{log.carbs||"—"}</td>
                      <td style={{ padding:"4px 8px" }}>{log.fat||"—"}</td>
                      <td style={{ padding:"4px 8px" }}>{log.sleep||"—"}</td>
                      <td style={{ padding:"4px 8px", color: log.pain>3?"#EF4444":log.pain>2?"#F59E0B":"#22C55E" }}>{log.pain||"—"}</td>
                      <td style={{ padding:"4px 8px", color: log.fatigue>3?"#EF4444":log.fatigue>2?"#F59E0B":"#22C55E" }}>{log.fatigue||"—"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── MÉTRICAS SECTION ─────────────────────────────────────────────────────────
function MetricasSection({ personal, onUpdate }) {
  const { useState: us, useEffect: ue, useRef: ur } = React;
  const items   = personal.metricsItems || [];
  const logs    = personal.metricsLogs  || {};
  const goals   = personal.goals        || [];
  const warMap  = personal.warMap       || {};
  const warMapCategories = personal.warMapCategories || [];

  const [wmYear,      setWmYear]      = us(new Date().getFullYear());
  const [editLegend,  setEditLegend]  = us(false);
  const [selDay,      setSelDay]      = us(null);
  const [modalTitle,  setModalTitle]  = us("");
  const [modalCatId,  setModalCatId]  = us(null);
  const [modalTime,   setModalTime]   = us("09:00");
  const [modalAllDay, setModalAllDay] = us(true);
  const [paintCatId,  setPaintCatId]  = us(null);
  const [dragDays,    setDragDays]    = us([]);

  // refs for drag-paint (avoid stale closures in window events)
  const dragRef  = ur({ painting: false, days: [] });
  const snapRef  = ur({});
  snapRef.current = { warMap, warMapCategories, paintCatId, onUpdate };

  // Ref siempre actualizado para onUpdate y personal (evita stale closures en el efecto de sync)
  const syncRef = ur({});
  syncRef.current = { personal, onUpdate };

  // Sync warMapCategories from goals whenever goals change
  ue(() => {
    const { personal: p, onUpdate: upd } = syncRef.current;
    const wmc = p.warMapCategories || [];
    const goalLabels = p.goals || [];
    if (!goalLabels.length) return;
    // Solo sincroniza si hay una meta sin categoría (no remueve cats extras — addGoal/removeGoalAndCat lo manejan)
    const needsSync = goalLabels.some(g => !wmc.find(c => c.label === g));
    if (!needsSync) return;
    const COLORS = ["#22C55E","#3B82F6","#F59E0B","#8B5CF6","#EC4899","#EF4444","#06B6D4","#84CC16","#F97316"];
    const usedColors = wmc.map(c => c.color);
    const newCats = goalLabels.map((g, i) => {
      const ex = wmc.find(c => c.label === g);
      if (ex) return ex;
      const col = COLORS.find(c => !usedColors.includes(c)) || COLORS[i % COLORS.length];
      usedColors.push(col);
