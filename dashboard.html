const STORAGE_KEY = "gp_metodo_v4";
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);

function contrastColor(hex) {
  if (!hex || hex.length < 7) return null;
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.5 ? "#1A1A1A" : "#FFFFFF";
}

function storageGet() {
  try {
    if (window.storage) return window.storage.get(STORAGE_KEY) || null;
  } catch (_) {}
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (_) { return null; }
}

function storageSet(val) {
  try {
    if (window.storage) { window.storage.set(STORAGE_KEY, val); return; }
  } catch (_) {}
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(val)); } catch (_) {}
}

  const gTasks = globalTasks || GEMA_TASKS.map(t => ({...t, id:"gt_"+t.n}));
  return {
    id: uid(),
    name,
    createdAt: Date.now(),
    profile: { phone:"", email:"", contractValue:"", channel: channel||"Meta Ads", startDate:null, nextMeeting:null, notes:"" },
    tasks: gTasks.map(gt => ({ ...gt, id: uid(), globalId: gt.id, done: false, assigneeId: null, doneAt: null })),
    flows: [{ id: uid(), name:"Proceso comercial v1", createdAt: Date.now(), nodes:[], edges:[] }],
    mvpChecks: {},
    fullChecks: {},
    meetings: [],
  };
}

function getInitialData() {
  const defaults = {
    roles: [{ id: uid(), name:"Estratega" }, { id: uid(), name:"Tráfico" }, { id: uid(), name:"Diseño" }],
    team: [{ id: uid(), name:"Pena" }, { id: uid(), name:"JP" }],
    clients: [],
    settings: { apiKey:"" },
    flowTemplates: [],
    globalTasks: GEMA_TASKS.map(t => ({...t, id:"gt_"+t.n})),
    globalMvpSteps: MVP_STEPS.map(s => ({...s, id:"mvp_"+s.n})),
    globalFullSteps: FULL_STEPS.map(s => ({...s, id:"full_"+s.n})),
    teamFlow: { id: "team_flow", name: "Organigrama del equipo", nodes: [], edges: [] },
  };
  const saved = storageGet();
  if (saved && saved.clients) {
    return {
      ...defaults,
      ...saved,
      globalTasks: saved.globalTasks || defaults.globalTasks,
      globalMvpSteps: saved.globalMvpSteps || defaults.globalMvpSteps,
      globalFullSteps: saved.globalFullSteps || defaults.globalFullSteps,
      teamFlow: saved.teamFlow || defaults.teamFlow,
    };
  }
  return defaults;
}

function syncTasksToClients(clients, globalTasks) {
  return clients.map(client => {
    const byGlobalId = {}, byN = {};
    client.tasks.forEach(t => {
      if (t.globalId) byGlobalId[t.globalId] = t;
      if (t.n != null) byN[t.n] = t;
    });
    const globalSet = new Set(globalTasks.map(gt => gt.id));
    const customTasks = client.tasks.filter(t => !t.n && !t.globalId); // keep custom one-off tasks
    const newTasks = globalTasks.map(gt => {
      const existing = byGlobalId[gt.id] || byN[gt.n];
      if (existing) return { ...existing, globalId: gt.id, area: gt.area, week: gt.week, title: gt.title, owner: gt.owner };
      return { ...gt, id: uid(), globalId: gt.id, done: false, assigneeId: null, doneAt: null };
    });
    return { ...client, tasks: [...newTasks, ...customTasks] };
  });
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function weekStats(tasks, week) {
  const wt = tasks.filter(t => t.week === week);
  return { done: wt.filter(t=>t.done).length, total: wt.length };
}

function overallPct(tasks) {
  if (!tasks.length) return 0;
  return Math.round((tasks.filter(t=>t.done).length / tasks.length) * 100);
}

// ─── SMALL UI COMPONENTS ──────────────────────────────────────────────────────
function Pill({ active, onClick, children }) {
  return (
    <button
      onClick={onClick}
      style={{
        padding:"4px 12px", borderRadius:20, fontSize:12, fontWeight:500, cursor:"pointer",
        background: active ? GOLD : "transparent",
        color: active ? "#141414" : GRAY,
        border: `1px solid ${active ? GOLD : BORDER}`,
        transition:"all 0.15s",
      }}
    >{children}</button>
  );
}

function ProgressBar({ pct, color=GOLD, height=4 }) {
  return (
    <div style={{ background: BORDER, borderRadius:4, height, overflow:"hidden" }}>
      <div style={{ width:`${pct}%`, height:"100%", background:color, borderRadius:4, transition:"width 0.3s" }} />
    </div>
  );
}

function Modal({ title, onClose, children }) {
  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.7)", zIndex:1000, display:"flex", alignItems:"center", justifyContent:"center" }}
      onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div style={{ background:CARD, border:`1px solid ${BORDER}`, borderRadius:12, padding:24, minWidth:360, maxWidth:520, width:"90%" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
          <span style={{ color:WHITE, fontWeight:600, fontSize:16 }}>{title}</span>
          <button onClick={onClose} style={{ background:"none", border:"none", color:GRAY, cursor:"pointer", fontSize:18 }}>×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Input({ label, value, onChange, type="text", placeholder="" }) {
  return (
    <div style={{ marginBottom:12 }}>
      {label && <label style={{ display:"block", color:GRAY, fontSize:12, marginBottom:4 }}>{label}</label>}
      <input
        type={type} value={value||""} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
        style={{ width:"100%", background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8, padding:"8px 10px", color:WHITE, fontSize:13, outline:"none", boxSizing:"border-box" }}
      />
    </div>
  );
}

function Select({ label, value, onChange, options }) {
  return (
    <div style={{ marginBottom:12 }}>
      {label && <label style={{ display:"block", color:GRAY, fontSize:12, marginBottom:4 }}>{label}</label>}
      <select value={value||""} onChange={e=>onChange(e.target.value)}
        style={{ width:"100%", background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8, padding:"8px 10px", color:WHITE, fontSize:13, outline:"none" }}>
        {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
      </select>
    </div>
  );
}

        <Input label="Email" value={p.email} onChange={v=>set("email",v)} placeholder="cliente@empresa.com" />
        <Input label="Valor del contrato" value={p.contractValue} onChange={v=>set("contractValue",v)} placeholder="$0 COP/mes" />
        <div style={{ marginBottom:12 }}>
          <label style={{ display:"block", color:GRAY, fontSize:12, marginBottom:4 }}>Canal</label>

            style={{ width:"100%", background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8, padding:"8px 10px", color:WHITE, fontSize:13, outline:"none" }}>
            {CHANNELS.map(c=><option key={c} value={c}>{c}</option>)}

        <Input label="Próxima reunión" value={p.nextMeeting||""} onChange={v=>set("nextMeeting",v)} type="date" />
      </div>
      <div style={{ marginBottom:12 }}>
        <label style={{ display:"block", color:GRAY, fontSize:12, marginBottom:4 }}>Notas</label>
        <textarea value={p.notes||""} onChange={e=>set("notes",e.target.value)}
          placeholder="Observaciones generales del cliente..."
          style={{ width:"100%", background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8, padding:"10px", color:WHITE, fontSize:13, outline:"none", minHeight:100, resize:"vertical", boxSizing:"border-box" }}
        />
      </div>
